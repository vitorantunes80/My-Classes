/* ===== AVISOS NA APP (prazos a terminar / terminados) =====
   Ao abrir a aplicação, o colaborador vê, num aviso ao centro, as atividades de que é responsável
   (ligação: email do responsável = email da conta) que terminam nos próximos N dias ou cujo prazo já terminou.
   Ao carregar em «Visto», fica registado em avisos_vistos e o coordenador vê quem tomou conhecimento.
   Um aviso é identificado por (atividade, tipo, data de fim): se o prazo for alterado, gera-se um novo aviso. */
const TIPOS_AVISO = { a_terminar: 'Prazo a terminar', atrasada: 'Prazo terminado' };
const avisosAtivos = () => S.cfg.avisos_ativos !== false;
const antecedencia = () => Number(S.cfg.avisos_antecedencia) || 7;
const normEmail = e => String(e || '').trim().toLowerCase();

/* Avisos atuais de uma atividade (no máximo um), ou null */
function avisoDe(a) {
  if (eFechada(a) || !a.responsavel_id || !a.data_fim_prevista) return null;
  const f = pd(a.data_fim_prevista), h = S.hoje, falta = f - h;
  if (falta < 0) return { a, tipo: 'atrasada', dias: -falta };
  if (falta <= antecedencia()) return { a, tipo: 'a_terminar', dias: falta };
  return null;
}
function vistosDe(av) {
  return (S.avisosVistos || []).filter(v => v.atividade_id === av.a.id && v.tipo === av.tipo && v.data_fim_ref === av.a.data_fim_prevista);
}
function textoDias(av) {
  if (av.tipo === 'atrasada') return av.dias === 1 ? 'Terminou ontem' : `Terminou há ${av.dias} dias`;
  return av.dias === 0 ? 'Termina hoje' : av.dias === 1 ? 'Falta 1 dia' : `Faltam ${av.dias} dias`;
}
function todosAvisos() {
  return S.ativ.map(avisoDe).filter(Boolean).sort((x, y) => (x.tipo === y.tipo ? 0 : x.tipo === 'atrasada' ? -1 : 1) || pd(x.a.data_fim_prevista) - pd(y.a.data_fim_prevista));
}
/* Avisos por ver do utilizador com sessão iniciada */
function meusAvisosPorVer() {
  if (!avisosAtivos() || !S.perfil) return [];
  const me = normEmail(S.perfil.email); if (!me) return [];
  const meus = new Set(S.resp.filter(r => normEmail(r.email) === me).map(r => r.id));
  if (!meus.size) return [];
  return todosAvisos().filter(av => meus.has(av.a.responsavel_id) && !vistosDe(av).some(v => v.user_id === S.perfil.user_id));
}

function htmlItemAviso(av) {
  const a = av.a, ar = S.areaById.get(a.area_id); const mae = a.parent_id ? S.byId.get(a.parent_id) : null;
  return `<li class="aviso-it ${av.tipo}" data-aviso="${a.id}">
    <div class="grow">
      <div class="aviso-tipo">${av.tipo === 'atrasada' ? '⚠' : '⏰'} ${TIPOS_AVISO[av.tipo]} · <b>${textoDias(av)}</b></div>
      <div class="tt"><span class="code">${codigo(a)}</span> ${esc(a.designacao)}</div>
      <div class="small muted">Área ${ar ? ar.numero + '. ' + esc(ar.designacao) : ''}${mae ? ' · tarefa ' + esc(mae.designacao) : ''}</div>
      <div class="small">Prazo: <b>${fd(a.data_fim_prevista)}</b> · Execução ${fmtPct(pctAt(a))}</div>
    </div>
    <div class="aviso-bts">${possoReportar(a) ? `<button class="btn sm" data-act="ponto-novo" data-id="${a.id}" data-volta="avisos" title="Registar o que já foi feito">Ponto de situação</button>` : ''}<button class="btn primary sm" data-act="aviso-visto" data-id="${a.id}" data-tipo="${av.tipo}">✓ Visto</button></div>
  </li>`;
}
function mostrarAvisos(lista) {
  lista = lista || meusAvisosPorVer();
  if (!lista.length) { if ($('#modalRoot .aviso-lista')) fecharModal(); return; }
  const nA = lista.filter(x => x.tipo === 'atrasada').length, nT = lista.length - nA;
  abrirModal({
    titulo: '🔔 Avisos de prazos',
    tamanho: 'aviso',
    corpo: `<p style="margin-top:0">Olá. Tem ${lista.length === 1 ? '<b>1 atividade</b>' : `<b>${lista.length} atividades</b>`} a seu cargo que precisa${lista.length === 1 ? '' : 'm'} de atenção${nA ? ` (${nA} com prazo terminado${nT ? `, ${nT} a terminar` : ''})` : ''}.
      Carregue em <b>Visto</b> para confirmar que tomou conhecimento — o coordenador do projeto fica a saber.</p>
      <ul class="list aviso-lista">${lista.map(htmlItemAviso).join('')}</ul>`,
    rodape: `<span class="small muted grow">Pode fechar e voltar a ver estes avisos quando abrir a aplicação de novo.</span>${lista.length > 1 ? '<button class="btn primary" data-act="aviso-visto-todos">✓ Visto em todos</button>' : ''}<button class="btn" data-act="fechar-modal">Fechar</button>`
  });
}
async function registarVistos(lista) {
  const rows = lista.map(av => ({ atividade_id: av.a.id, tipo: av.tipo, data_fim_ref: av.a.data_fim_prevista, user_id: S.perfil.user_id, email: S.perfil.email }));
  const { data, error } = await sb.from('avisos_vistos').insert(rows).select();
  if (error && !/duplicate key/i.test(error.message || '')) throw error;
  if (data) S.avisosVistos.push(...data);
  else S.avisosVistos.push(...rows.map(r => Object.assign({ visto_em: new Date().toISOString() }, r)));
}
/* Mostra os avisos uma vez por abertura da aplicação */
function avisosAoAbrir() {
  if (S._avisosMostrados) return; S._avisosMostrados = true;
  const l = meusAvisosPorVer(); if (l.length) mostrarAvisos(l);
}

/* Painel do coordenador: quem viu o quê */
function cartaoAvisosCoord() {
  if (!eCoord() || !avisosAtivos()) return '';
  const todos = todosAvisos(); if (!todos.length) return `<section class="card" style="margin-bottom:16px"><div class="hd"><h2>Avisos aos colaboradores</h2></div><div class="bd"><div class="empty">Não há atividades a terminar nos próximos ${antecedencia()} dias nem com prazo terminado.</div></div></section>`;
  const linhas = todos.map(av => {
    const r = S.respById.get(av.a.responsavel_id); const vs = vistosDe(av);
    let est;
    if (vs.length) { const v = vs[vs.length - 1]; est = `<span class="pill s-ok">✓ Visto</span><div class="small muted">${esc(v.email || '')} · ${new Date(v.visto_em).toLocaleString('pt-PT', { dateStyle: 'short', timeStyle: 'short' })}</div>`; }
    else if (!r || !r.email) est = `<span class="pill">Sem email</span><div class="small muted">Registe o email do responsável para ele receber o aviso.</div>`;
    else est = `<span class="pill s-warn">Por ver</span>`;
    return { vs: vs.length, html: `<tr class="clk" data-act="edit-ativ" data-id="${av.a.id}"><td data-l="Atividade"><span class="code">${codigo(av.a)}</span> ${esc(av.a.designacao)}</td><td data-l="Responsável">${esc(r ? r.nome : '')}</td><td data-l="Prazo" class="nowrap">${fd(av.a.data_fim_prevista)}<div class="small ${av.tipo === 'atrasada' ? 'aviso-mau' : 'muted'}">${textoDias(av)}</div></td><td data-l="Conhecimento">${est}</td></tr>` };
  });
  const nV = linhas.filter(l => l.vs).length;
  return `<section class="card" style="margin-bottom:16px"><div class="hd"><h2>Avisos aos colaboradores</h2><span class="muted small">${nV} de ${linhas.length} vistos · antecedência ${antecedencia()} dias</span></div>
    <div class="bd"><div class="tblwrap" style="border:0;max-height:360px;overflow:auto"><table class="tbl resp"><thead><tr><th>Atividade</th><th>Responsável</th><th>Prazo</th><th>Conhecimento</th></tr></thead><tbody>${linhas.map(l => l.html).join('')}</tbody></table></div></div></section>`;
}
/* Na ficha da atividade */
function avisosAtivHtml(id) {
  const vs = (S.avisosVistos || []).filter(v => v.atividade_id === id); if (!vs.length) return '';
  return `<div class="nota" style="margin-bottom:10px"><b>Avisos vistos</b><ul style="margin:4px 0 0;padding-left:18px">${vs.map(v => `<li class="small">${TIPOS_AVISO[v.tipo]} (prazo ${fd(v.data_fim_ref)}) — visto por ${esc(v.email || '')} em ${new Date(v.visto_em).toLocaleString('pt-PT', { dateStyle: 'short', timeStyle: 'short' })}</li>`).join('')}</ul></div>`;
}

Object.assign(ACOES, {
  'aviso-visto': async el => {
    const av = meusAvisosPorVer().find(x => x.a.id === Number(el.dataset.id) && x.tipo === el.dataset.tipo); if (!av) return;
    el.disabled = true;
    try { await registarVistos([av]); toast('Registado: tomou conhecimento.'); const resto = meusAvisosPorVer(); if (resto.length) mostrarAvisos(resto); else fecharModal(); render(); }
    catch (e) { el.disabled = false; toast(erroMsg(e), 'err'); }
  },
  'aviso-visto-todos': async () => {
    const l = meusAvisosPorVer(); if (!l.length) return fecharModal();
    try { await registarVistos(l); toast('Registado em todos os avisos.'); fecharModal(); render(); }
    catch (e) { toast(erroMsg(e), 'err'); }
  },
  'ver-avisos': () => { const l = meusAvisosPorVer(); if (l.length) mostrarAvisos(l); else toast('Não tem avisos por ver.'); }
});

/* ===== PONTO DE SITUAÇÃO E RESPONSABILIDADES =====
   Cada tarefa/subtarefa tem um registo cronológico de «pontos de situação»: o que foi feito, próximo passo,
   dificuldades, pedido de apoio, execução (%) e estado. Pode registar quem é responsável pela atividade,
   pela tarefa-mãe ou pela área (pelo email), além do coordenador e editores. Gravado via RPC registar_ponto_situacao. */
const diasPonto = () => Number(S.cfg.ponto_situacao_dias) || 15;
function indexarPontos() {
  S.pontosDe = new Map();
  for (const p of (S.pontos || [])) { if (!S.pontosDe.has(p.atividade_id)) S.pontosDe.set(p.atividade_id, []); S.pontosDe.get(p.atividade_id).push(p); }
  S.pontosDe.forEach(v => v.sort((x, y) => (y.criado_em || '').localeCompare(x.criado_em || '')));
}
const pontosDe = id => (S.pontosDe && S.pontosDe.get(id)) || [];

  'ponto-novo': el => registarPonto(Number(el.dataset.id), el.dataset.volta),

  'resp-pdf': el => comBotao(el, 'A criar…', async () => { const v = el.dataset.area || ($('#respArea') ? $('#respArea').value : ''); await criarPdfResponsabilidades(v ? [S.areaById.get(Number(v))] : S.areas); toast('Relatório criado.'); })
});

document.getElementById('logo').outerHTML = LOGO;
</script>
</body>
</html>
