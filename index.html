<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Transportes DDS</title>
<style>
  :root{
    --bg:#eef2f6; --surface:#ffffff; --surface-2:#f7f9fb;
    --primary:#15486b; --primary-d:#0f3650; --primary-l:#e7f0f6;
    --text:#1f2937; --muted:#667085; --border:#e2e8f0;
    --ok:#2e7d5b; --ok-bg:#e6f4ec;
    --warn:#b26a00; --warn-bg:#fbf0dd;
    --info:#1f5f8b; --info-bg:#e5f0f8;
    --danger:#b3261e; --danger-bg:#fbe9e7;
    --slate:#5b6b7b; --slate-bg:#eceff2;
    --radius:12px; --shadow:0 1px 3px rgba(16,40,60,.08),0 1px 2px rgba(16,40,60,.06);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;
       min-height:100svh;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
  a{color:var(--primary)}

  /* ---- App shell ---- */
  .topbar{position:sticky;top:0;z-index:30;background:var(--primary);color:#fff;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;box-shadow:var(--shadow)}
  .topbar h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  .topbar .sub{font-size:12px;opacity:.85;font-weight:400}
  .nav{position:sticky;top:0;z-index:20;background:var(--primary-d);display:flex;gap:4px;overflow-x:auto;
    padding:6px 10px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{white-space:nowrap;border:0;background:transparent;color:#cfe0ec;padding:8px 12px;border-radius:8px;
    font-size:14px;font-weight:550;cursor:pointer}
  .nav button.active{background:rgba(255,255,255,.16);color:#fff}
  .wrap{max-width:960px;margin:0 auto;padding:14px 12px 40px}

  /* ---- Common ---- */
  .view-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
  .view-head h2{margin:0;font-size:19px;font-weight:650}
  .btn{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:active{background:var(--primary-d)}
  .btn-ghost{background:var(--surface);color:var(--primary);border:1px solid var(--border)}
  .btn-sm{padding:7px 10px;font-size:13px;border-radius:8px}
  .btn-danger{background:var(--danger-bg);color:var(--danger)}
  .btn-block{width:100%;justify-content:center}
  .btn:disabled{opacity:.5}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--border);border-radius:9px;
    padding:9px 10px;font-size:14px;flex:1;min-width:120px}
  .search{flex:2;min-width:150px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:12px 13px}
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .item-title{font-weight:650;font-size:15px}
  .item-sub{color:var(--muted);font-size:13px;margin-top:2px}
  .item-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--text)}
  .item-meta b{color:var(--muted);font-weight:550}
  .item-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
  .p-novo{background:var(--slate-bg);color:var(--slate)}
  .p-analise{background:var(--info-bg);color:var(--info)}
  .p-aguardar{background:var(--warn-bg);color:var(--warn)}
  .p-aprovado{background:var(--ok-bg);color:var(--ok)}
  .p-indeferido{background:var(--danger-bg);color:var(--danger)}
  .p-cancelado{background:var(--slate-bg);color:var(--slate)}
  .p-previsto{background:var(--info-bg);color:var(--info)}
  .p-realizado{background:var(--ok-bg);color:var(--ok)}
  .p-comp{background:#efe7f6;color:#6b3fa0}
  .p-disp{background:var(--ok-bg);color:var(--ok)}
  .p-indisp{background:var(--danger-bg);color:var(--danger)}
  .p-manut{background:var(--warn-bg);color:var(--warn)}
  .p-off{background:var(--slate-bg);color:var(--slate)}

  .empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:14px}
  .empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

  /* ---- Dashboard ---- */
  .dash-group{margin-bottom:18px}
  .dash-group h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:650;letter-spacing:.3px}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:12px 14px}
  .stat .n{font-size:24px;font-weight:700;line-height:1}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:4px}
  .stat.accent{background:var(--primary-l);border-color:#cfe0ec}
  .stat.accent .n{color:var(--primary)}

  /* ---- Modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(15,30,45,.45);z-index:50;display:none;
    align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .modal{background:var(--surface);width:100%;max-width:620px;max-height:92dvh;border-radius:18px 18px 0 0;
    display:flex;flex-direction:column;overflow:hidden}
  @media(min-width:640px){.overlay{align-items:center}.modal{border-radius:18px;max-height:90dvh}}
  .modal-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;
    justify-content:space-between;gap:10px;flex:0 0 auto}
  .modal-head h3{margin:0;font-size:16px;font-weight:650}
  .modal-x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;color:var(--muted)}
  .modal-body{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto}
  .modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex:0 0 auto;
    padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .modal-foot .btn{flex:1;justify-content:center}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);
    border-radius:9px;padding:10px;font-size:16px}
  .field textarea{min-height:64px;resize:vertical}
  .field-row{display:flex;gap:10px}
  .field-row .field{flex:1}
  .check{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:550}
  .check input{width:20px;height:20px}
  .sub-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .sub-row{display:flex;gap:8px;align-items:center}
  .sub-row input{flex:1}
  .icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;width:38px;height:38px;
    font-size:16px;cursor:pointer;flex:0 0 auto;color:var(--muted)}
  .add-line{background:none;border:1px dashed var(--border);color:var(--primary);border-radius:9px;padding:9px;
    width:100%;font-weight:600;cursor:pointer;font-size:13.5px}
  .divider{height:1px;background:var(--border);margin:14px 0}
  .section-label{font-size:13px;font-weight:700;color:var(--text);margin:2px 0 8px}

  /* ---- Toast ---- */
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:#1f2937;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:80;
    box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
    max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--danger)}

  .banner{background:var(--danger-bg);color:var(--danger);border:1px solid #f3c9c5;border-radius:10px;
    padding:11px 13px;font-size:13.5px;margin-bottom:12px;display:none}
  .banner.show{display:block}

  .loading{text-align:center;color:var(--muted);padding:30px;font-size:14px}
  .timeline{list-style:none;padding:0;margin:0}
  .timeline li{padding:8px 0 8px 16px;border-left:2px solid var(--border);position:relative;font-size:13.5px}
  .timeline li:before{content:"";position:absolute;left:-5px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
  .timeline .t{color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <div class="topbar">
    <h1>🚌 Transportes DDS <span class="sub">· Cabeceiras de Basto</span></h1>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="wrap">
    <div class="banner" id="banner"></div>
    <div id="view"><div class="loading">A carregar…</div></div>
  </div>

  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>

<script>
/* =========================================================
   Configuração Supabase
========================================================= */
const SB_URL = 'https://ruthhkhlmyrrzyfwmtls.supabase.co';
const SB_KEY = 'sb_publishable_ewwb05rGVH8CJYLSCRmm8Q_9vLHLci8';
const REST = SB_URL + '/rest/v1/';
const H = { apikey: SB_KEY, 'Content-Type': 'application/json' };

async function sbGet(path){
  const r = await fetch(REST + path, { headers: H });
  if(!r.ok) throw new Error('GET ' + path + ' → ' + r.status + ' ' + await r.text());
  return r.json();
}
async function sbInsert(table, body){
  const r = await fetch(REST + table, { method:'POST',
    headers:{...H, Prefer:'return=representation'}, body: JSON.stringify(body) });
  if(!r.ok) throw new Error('INSERT ' + table + ' → ' + r.status + ' ' + await r.text());
  const j = await r.json(); return Array.isArray(j) ? j[0] : j;
}
async function sbUpdate(table, id, body){
  const r = await fetch(REST + table + '?id=eq.' + id, { method:'PATCH',
    headers:{...H, Prefer:'return=representation'}, body: JSON.stringify(body) });
  if(!r.ok) throw new Error('UPDATE ' + table + ' → ' + r.status + ' ' + await r.text());
  const j = await r.json(); return Array.isArray(j) ? j[0] : j;
}
async function sbDelete(table, filter){
  const r = await fetch(REST + table + '?' + filter, { method:'DELETE',
    headers:{...H, Prefer:'return=minimal'} });
  if(!r.ok) throw new Error('DELETE ' + table + ' → ' + r.status + ' ' + await r.text());
}
async function logHist(tipo, id, pedidoId, descricao){
  try{ await sbInsert('historico', { entidade_tipo:tipo, entidade_id:id, pedido_id:pedidoId, descricao }); }
  catch(e){ console.warn('hist', e); }
}

/* =========================================================
   Utilidades
========================================================= */
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
function fmtData(d){ if(!d) return '—'; const p=String(d).slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
function fmtDataDia(d){ if(!d) return '—'; const dt=new Date(String(d).slice(0,10)+'T00:00:00'); return fmtData(d)+', '+DIAS[dt.getDay()]; }
function fmtHora(h){ return h ? String(h).slice(0,5) : '—'; }
function fmtEur(v){ return (v==null||v==='') ? '—' : Number(v).toLocaleString('pt-PT',{style:'currency',currency:'EUR'}); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekRange(){ const d=new Date(); const dow=(d.getDay()+6)%7; const mon=new Date(d); mon.setDate(d.getDate()-dow);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  return {ini:iso(mon), fim:iso(sun)}; }

let toastT;
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(err?' err':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',2600); }

/* Modal */
function openModal(html){ $('#modal').innerHTML=html; $('#overlay').classList.add('open'); document.body.style.overflow='hidden'; }
function closeModal(){ $('#overlay').classList.remove('open'); document.body.style.overflow=''; $('#modal').innerHTML=''; }
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

/* Confirmação (sem confirm nativo) */
function confirmar(msg, onYes, danger){
  openModal(`
    <div class="modal-head"><h3>Confirmar</h3><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body"><p style="margin:6px 0 2px">${esc(msg)}</p></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn ${danger?'btn-danger':'btn-primary'}" id="cfmYes">Confirmar</button>
    </div>`);
  $('#cfmYes').onclick=async()=>{ try{ await onYes(); }catch(e){ toast(e.message,true);} };
}

/* =========================================================
   Estado / caches
========================================================= */
const cache = { areas:[], entidades:[], contactos:[], tipos:[], motoristas:[], viaturas:[] };
async function loadCaches(){
  const [areas,entidades,contactos,tipos,motoristas,viaturas] = await Promise.all([
    sbGet('areas?select=*&order=ordem'),
    sbGet('entidades?select=*&order=nome'),
    sbGet('contactos_entidades?select=*&order=principal.desc,nome'),
    sbGet('tipos_servico?select=*&order=ordem'),
    sbGet('motoristas?select=*&order=nome'),
    sbGet('viaturas?select=*&order=matricula'),
  ]);
  Object.assign(cache,{areas,entidades,contactos,tipos,motoristas,viaturas});
}
const areaNome = id => (cache.areas.find(a=>a.id===id)||{}).nome || '';
const entNome  = id => (cache.entidades.find(e=>e.id===id)||{}).nome || '';
const tipoNome = id => (cache.tipos.find(t=>t.id===id)||{}).nome || '';
const motNome  = id => (cache.motoristas.find(m=>m.id===id)||{}).nome || '';
const viatLabel= id => { const v=cache.viaturas.find(x=>x.id===id); return v?(v.matricula+(v.marca?' · '+v.marca:'')):''; };
function opts(list, sel, valKey, labelFn, placeholder){
  let h = placeholder!==undefined ? `<option value="">${esc(placeholder)}</option>` : '';
  list.forEach(o=>{ const v=o[valKey]; h+=`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(labelFn(o))}</option>`; });
  return h;
}

/* =========================================================
   Navegação
========================================================= */
const VIEWS = [
  ['dashboard','Painel'], ['pedidos','Pedidos'], ['servicos','Serviços'],
  ['entidades','Entidades'], ['motoristas','Motoristas'], ['viaturas','Viaturas'], ['tipos','Tipos']
];
let current = 'dashboard';
function buildNav(){
  $('#nav').innerHTML = VIEWS.map(([k,l])=>`<button data-v="${k}" class="${k===current?'active':''}" onclick="go('${k}')">${l}</button>`).join('');
}
function go(v){ current=v; buildNav(); render(); }
function render(){
  const el=$('#view'); el.innerHTML='<div class="loading">A carregar…</div>';
  ({dashboard:viewDashboard,pedidos:viewPedidos,servicos:viewServicos,entidades:viewEntidades,
    motoristas:viewMotoristas,viaturas:viewViaturas,tipos:viewTipos}[current])().catch(e=>{
    el.innerHTML=`<div class="empty"><b>Ocorreu um erro</b>${esc(e.message)}</div>`;
  });
}

/* =========================================================
   PAINEL
========================================================= */
async function viewDashboard(){
  const wk = weekRange(); const hoje = todayISO();
  const [ped, serv, mot, viat, pag] = await Promise.all([
    sbGet('pedidos?select=id,estado'),
    sbGet('servicos?select=id,data,estado,motorista_id,viatura_id,complementar'),
    sbGet('motoristas?select=id,estado'),
    sbGet('viaturas?select=id,estado'),
    sbGet('pagamentos?select=valor_total,estado'),
  ]);
  const cP = e => ped.filter(x=>x.estado===e).length;
  const servHoje = serv.filter(s=>s.data===hoje);
  const servSem = serv.filter(s=>s.data>=wk.ini && s.data<=wk.fim);
  const motServ = new Set(servHoje.map(s=>s.motorista_id).filter(Boolean));
  const viatServ = new Set(servHoje.map(s=>s.viatura_id).filter(Boolean));
  const compSem = servSem.filter(s=>s.complementar);
  const aPagar = pag.filter(p=>p.estado==='Previsto'||p.estado==='Realizado'||p.estado==='A processar')
                    .reduce((a,p)=>a+Number(p.valor_total||0),0);
  const motAtivos = mot.filter(m=>m.estado==='Ativo');

  function grp(title, cards){ return `<div class="dash-group"><h3>${title}</h3><div class="stats">${cards}</div></div>`; }
  function st(n,l,accent){ return `<div class="stat ${accent?'accent':''}"><div class="n">${n}</div><div class="l">${l}</div></div>`; }

  $('#view').innerHTML =
    `<div class="view-head"><h2>Painel</h2></div>`+
    grp('Pedidos',
      st(cP('Novo'),'Novos',true)+st(cP('Em análise'),'Em análise')+st(cP('A aguardar informação'),'A aguardar')+
      st(cP('Aprovado'),'Aprovados')+st(cP('Indeferido'),'Indeferidos'))+
    grp('Serviços',
      st(servHoje.length,'Hoje',true)+st(servSem.length,'Esta semana')+
      st(serv.filter(s=>s.estado==='Previsto').length,'Por realizar'))+
    grp('Motoristas',
      st(motServ.size,'Em serviço hoje')+st(Math.max(motAtivos.length-motServ.size,0),'Disponíveis'))+
    grp('Viaturas',
      st(viatServ.size,'Em serviço hoje')+st(viat.filter(v=>v.estado==='Disponível').length,'Disponíveis')+
      st(viat.filter(v=>v.estado==='Indisponível').length,'Indisponíveis')+
      st(viat.filter(v=>v.estado==='Manutenção').length,'Manutenção'))+
    grp('Serviços complementares',
      st(compSem.length,'Esta semana')+st(fmtEur(aPagar),'Total a processar',true));
}

/* =========================================================
   PEDIDOS
========================================================= */
const EST_PEDIDO = ['Novo','Em análise','A aguardar informação','Aprovado','Indeferido','Cancelado'];
function pillEstadoPedido(e){
  const m={'Novo':'p-novo','Em análise':'p-analise','A aguardar informação':'p-aguardar','Aprovado':'p-aprovado','Indeferido':'p-indeferido','Cancelado':'p-cancelado'};
  return `<span class="pill ${m[e]||'p-novo'}">${esc(e)}</span>`;
}
let pedidosData=[], pedidoFiltro={q:'',estado:'',area:''};
async function viewPedidos(){
  pedidosData = await sbGet('pedidos?select=*&order=data_pedido.desc,numero.desc');
  $('#view').innerHTML = `
    <div class="view-head"><h2>Pedidos</h2><button class="btn btn-primary" onclick="editPedido()">+ Novo</button></div>
    <div class="toolbar">
      <input class="search" id="pq" placeholder="Pesquisar nº, entidade, destino…" value="${esc(pedidoFiltro.q)}">
      <select id="pest">${opts(EST_PEDIDO.map(e=>({v:e})),pedidoFiltro.estado,'v',o=>o.v,'Todos os estados')}</select>
      <select id="par">${opts(cache.areas,pedidoFiltro.area,'id',a=>a.nome,'Todas as áreas')}</select>
    </div>
    <div id="pedList" class="list"></div>`;
  $('#pq').oninput=e=>{pedidoFiltro.q=e.target.value;renderPedList();};
  $('#pest').onchange=e=>{pedidoFiltro.estado=e.target.value;renderPedList();};
  $('#par').onchange=e=>{pedidoFiltro.area=e.target.value;renderPedList();};
  renderPedList();
}
function renderPedList(){
  const q=pedidoFiltro.q.toLowerCase();
  let list=pedidosData.filter(p=>{
    if(pedidoFiltro.estado && p.estado!==pedidoFiltro.estado) return false;
    if(pedidoFiltro.area && p.area_id!==pedidoFiltro.area) return false;
    if(q){ const s=(p.numero+' '+entNome(p.entidade_id)+' '+(p.destino||'')+' '+(p.descricao||'')).toLowerCase();
      if(!s.includes(q)) return false; }
    return true;
  });
  const el=$('#pedList');
  if(!list.length){ el.innerHTML=`<div class="empty"><b>Sem pedidos</b>Cria o primeiro pedido com o botão “+ Novo”.</div>`; return; }
  el.innerHTML=list.map(p=>`
    <div class="item">
      <div class="item-top">
        <div><div class="item-title">${esc(p.numero||'—')} · ${esc(entNome(p.entidade_id))}</div>
          <div class="item-sub">${esc(areaNome(p.area_id))} · ${esc(tipoNome(p.tipo_servico_id)||'—')}</div></div>
        ${pillEstadoPedido(p.estado)}
      </div>
      <div class="item-meta">
        <span><b>Data pretendida:</b> ${fmtData(p.data_pretendida)}</span>
        <span><b>Saída:</b> ${fmtHora(p.hora_saida)}</span>

}
function collectPontos(){
  return [...document.querySelectorAll('#pontosBox .pt-input')].map(i=>i.value.trim()).filter(Boolean);
}
async function savePedido(p){
  const body={
    area_id:$('#f_area').value||null, entidade_id:$('#f_ent').value||null, contacto_id:$('#f_cont').value||null,
    tipo_servico_id:$('#f_tipo').value||null, data_pretendida:$('#f_datap').value||null,
    hora_saida:$('#f_saida').value||null, hora_regresso:$('#f_reg').value||null,
    destino:$('#f_dest').value.trim()||null, num_passageiros:$('#f_pass').value?Number($('#f_pass').value):null,
    descricao:$('#f_desc').value.trim()||null, observacoes:$('#f_obs').value.trim()||null, estado:$('#f_estado').value
  };
  if(!body.area_id||!body.entidade_id){ toast('Área e entidade são obrigatórias',true); return; }
  $('#savePed').disabled=true;
  try{
    const pontos=collectPontos();
    if(p.id){
      const estadoAntigo=p.estado;
      await sbUpdate('pedidos',p.id,body);
      await sbDelete('pontos_recolha','pedido_id=eq.'+p.id);
      for(let i=0;i<pontos.length;i++) await sbInsert('pontos_recolha',{pedido_id:p.id,local:pontos[i],ordem:i});
      if(estadoAntigo!==body.estado) await logHist('pedido',p.id,p.id,'Estado alterado para '+body.estado);
      toast('Pedido atualizado');
    }else{
      const novo=await sbInsert('pedidos',body);
      for(let i=0;i<pontos.length;i++) await sbInsert('pontos_recolha',{pedido_id:novo.id,local:pontos[i],ordem:i});
      await logHist('pedido',novo.id,novo.id,'Pedido criado');
      toast('Pedido '+(novo.numero||'')+' criado');
    }
    closeModal(); if(current==='pedidos') viewPedidos();
  }catch(e){ toast(e.message,true); $('#savePed').disabled=false; }
}
function apagarPedido(id){ confirmar('Apagar este pedido? Os serviços associados ficam sem pedido.', async()=>{
  await sbDelete('pedidos','id=eq.'+id); closeModal(); toast('Pedido apagado'); viewPedidos(); }, true); }

  openModal(`

    <div class="modal-body">

        :'<div class="empty">Sem registos de histórico.</div>'}

  renderEntList();

function renderEntList(){
  const q=entFiltro.q.toLowerCase();

  const el=$('#entList');
  if(!list.length){ el.innerHTML=`<div class="empty"><b>Sem entidades</b>Adiciona a primeira entidade requerente.</div>`; return; }
  el.innerHTML=list.map(e=>{

      <div class="item-actions"><button class="btn btn-ghost btn-sm" onclick="editEntidade('${e.id}')">Abrir</button></div>
    </div>`;
  }).join('');
}

  return `<div class="item" style="padding:10px 11px" data-cid="${c.id}">
    <div class="item-top"><div><div class="item-title" style="font-size:14px">${esc(c.nome||'(sem nome)')}${c.principal?' · principal':''}</div>
      <div class="item-sub">${esc(c.telefone||'')}${c.email?' · '+esc(c.email):''}${c.funcao?' · '+esc(c.funcao):''}</div></div>
      <button class="btn btn-ghost btn-sm" onclick="editContacto('${c.id}')">Editar</button></div></div>`;
}
async function saveEntidade(e){
  const body={ area_id:$('#e_area').value||null, nome:$('#e_nome').value.trim(),
    observacoes:$('#e_obs').value.trim()||null, ativo:$('#e_ativo').checked };
  if(!body.area_id||!body.nome){ toast('Área e nome são obrigatórios',true); return; }
  $('#saveEnt').disabled=true;
  try{ if(e.id) await sbUpdate('entidades',e.id,body); else await sbInsert('entidades',body);
    await loadCaches(); closeModal(); toast('Entidade guardada'); if(current==='entidades') viewEntidades();
  }catch(err){ toast(err.message,true); $('#saveEnt').disabled=false; }
}
function apagarEntidade(id){ confirmar('Apagar esta entidade e os seus contactos?', async()=>{
  await sbDelete('entidades','id=eq.'+id); await loadCaches(); closeModal(); toast('Entidade apagada'); viewEntidades(); }, true); }

function novoContacto(entId){ editContacto(null, entId); }
async function editContacto(id, entId){
  const c = id ? cache.contactos.find(x=>x.id===id) : {entidade_id:entId,principal:false,ativo:true};
  openModal(`
    <div class="modal-head"><h3>${id?'Contacto':'Novo contacto'}</h3><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field"><label>Nome</label><input id="c_nome" value="${esc(c.nome||'')}"></div>
      <div class="field-row">
        <div class="field"><label>Telefone</label><input id="c_tel" inputmode="tel" value="${esc(c.telefone||'')}"></div>
        <div class="field"><label>Função</label><input id="c_func" value="${esc(c.funcao||'')}"></div>
      </div>
      <div class="field"><label>Email</label><input id="c_email" inputmode="email" value="${esc(c.email||'')}"></div>
      <label class="check"><input type="checkbox" id="c_princ" ${c.principal?'checked':''}> Contacto principal</label>
    </div>
    <div class="modal-foot">
      ${id?`<button class="btn btn-danger" onclick="apagarContacto('${id}','${c.entidade_id}')">Apagar</button>`:''}
      <button class="btn btn-primary" id="saveCont">Guardar</button>
    </div>`);
  $('#saveCont').onclick=async()=>{
    const body={ entidade_id:c.entidade_id, nome:$('#c_nome').value.trim()||null, telefone:$('#c_tel').value.trim()||null,
      email:$('#c_email').value.trim()||null, funcao:$('#c_func').value.trim()||null, principal:$('#c_princ').checked };
    if(!body.nome && !body.telefone){ toast('Indica pelo menos nome ou telefone',true); return; }
    $('#saveCont').disabled=true;
    try{ if(id) await sbUpdate('contactos_entidades',id,body); else await sbInsert('contactos_entidades',body);
      await loadCaches(); editEntidade(c.entidade_id); toast('Contacto guardado');
    }catch(err){ toast(err.message,true); $('#saveCont').disabled=false; }
  };
}
function apagarContacto(id, entId){ confirmar('Apagar este contacto?', async()=>{
  await sbDelete('contactos_entidades','id=eq.'+id); await loadCaches(); editEntidade(entId); toast('Contacto apagado'); }, true); }

/* =========================================================
   MOTORISTAS
========================================================= */
async function viewMotoristas(){
  const list=cache.motoristas;
  $('#view').innerHTML=`
    <div class="view-head"><h2>Motoristas</h2><button class="btn btn-primary" onclick="editMotorista()">+ Novo</button></div>
    <div class="list">${list.length?list.map(m=>`
      <div class="item"><div class="item-top">
        <div><div class="item-title">${esc(m.nome)}</div><div class="item-sub">${esc(m.telefone||'—')}</div></div>
        <span class="pill ${m.estado==='Ativo'?'p-disp':'p-off'}">${esc(m.estado)}</span></div>
      <div class="item-meta">
        <span><b>Viatura habitual:</b> ${esc(viatLabel(m.viatura_habitual_id)||'—')}</span>
        <span><b>Valor/hora:</b> ${fmtEur(m.valor_hora)}</span></div>
      <div class="item-actions"><button class="btn btn-ghost btn-sm" onclick="editMotorista('${m.id}')">Abrir</button></div></div>`).join('')
      :`<div class="empty"><b>Sem motoristas</b>Adiciona o primeiro motorista.</div>`}</div>`;
}
async function editMotorista(id){
  const m = id ? cache.motoristas.find(x=>x.id===id) : {estado:'Ativo'};
  openModal(`
    <div class="modal-head"><h3>${id?'Motorista':'Novo motorista'}</h3><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field"><label>Nome</label><input id="m_nome" value="${esc(m.nome||'')}"></div>
      <div class="field-row">
        <div class="field"><label>Telefone</label><input id="m_tel" inputmode="tel" value="${esc(m.telefone||'')}"></div>
        <div class="field"><label>Estado</label><select id="m_estado">${opts(['Ativo','Inativo'].map(v=>({v})),m.estado,'v',o=>o.v)}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Viatura habitual</label><select id="m_viat">${opts(cache.viaturas,m.viatura_habitual_id,'id',v=>v.matricula+(v.marca?' · '+v.marca:''),'—')}</select></div>
        <div class="field"><label>Valor/hora (€)</label><input type="number" id="m_vh" inputmode="decimal" value="${esc(m.valor_hora??'')}"></div>
      </div>
      <div class="field"><label>Observações</label><textarea id="m_obs">${esc(m.observacoes||'')}</textarea></div>
    </div>
    <div class="modal-foot">
      ${id?`<button class="btn btn-danger" onclick="apagarMotorista('${id}')">Apagar</button>`:''}
      <button class="btn btn-primary" id="saveMot">Guardar</button>
    </div>`);
  $('#saveMot').onclick=async()=>{
    const body={ nome:$('#m_nome').value.trim(), telefone:$('#m_tel').value.trim()||null, estado:$('#m_estado').value,
      viatura_habitual_id:$('#m_viat').value||null, valor_hora:$('#m_vh').value?Number($('#m_vh').value):null,
      observacoes:$('#m_obs').value.trim()||null };
    if(!body.nome){ toast('O nome é obrigatório',true); return; }
    $('#saveMot').disabled=true;
    try{ if(id) await sbUpdate('motoristas',id,body); else await sbInsert('motoristas',body);
      await loadCaches(); closeModal(); toast('Motorista guardado'); viewMotoristas();
    }catch(e){ toast(e.message,true); $('#saveMot').disabled=false; }
  };
}
function apagarMotorista(id){ confirmar('Apagar este motorista?', async()=>{
  await sbDelete('motoristas','id=eq.'+id); await loadCaches(); closeModal(); toast('Motorista apagado'); viewMotoristas(); }, true); }

/* =========================================================
   VIATURAS + TAXAS
========================================================= */
async function viewViaturas(){
  const list=cache.viaturas;
  $('#view').innerHTML=`
    <div class="view-head"><h2>Viaturas</h2><button class="btn btn-primary" onclick="editViatura()">+ Nova</button></div>
    <div class="list">${list.length?list.map(v=>`
      <div class="item"><div class="item-top">
        <div><div class="item-title">${esc(v.matricula)}</div><div class="item-sub">${esc([v.marca,v.modelo].filter(Boolean).join(' '))||'—'}</div></div>
        <span class="pill ${v.estado==='Disponível'?'p-disp':v.estado==='Manutenção'?'p-manut':'p-indisp'}">${esc(v.estado)}</span></div>
      <div class="item-meta"><span><b>Lotação:</b> ${v.lotacao??'—'}</span></div>
      <div class="item-actions"><button class="btn btn-ghost btn-sm" onclick="editViatura('${v.id}')">Abrir</button></div></div>`).join('')
      :`<div class="empty"><b>Sem viaturas</b>Adiciona a primeira viatura.</div>`}</div>`;
}
const EST_VIAT=['Disponível','Indisponível','Manutenção'];
async function editViatura(id){
  const v = id ? cache.viaturas.find(x=>x.id===id) : {estado:'Disponível'};
  const taxas = id ? await sbGet('taxas_viatura?select=*&viatura_id=eq.'+id+'&order=km_de') : [];
  openModal(`
    <div class="modal-head"><h3>${id?'Viatura':'Nova viatura'}</h3><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label>Matrícula</label><input id="v_mat" value="${esc(v.matricula||'')}"></div>
        <div class="field"><label>Estado</label><select id="v_estado">${opts(EST_VIAT.map(x=>({x})),v.estado,'x',o=>o.x)}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Marca</label><input id="v_marca" value="${esc(v.marca||'')}"></div>
        <div class="field"><label>Modelo</label><input id="v_modelo" value="${esc(v.modelo||'')}"></div>
      </div>
      <div class="field"><label>Lotação</label><input type="number" id="v_lot" inputmode="numeric" value="${esc(v.lotacao??'')}"></div>
      <div class="field"><label>Observações</label><textarea id="v_obs">${esc(v.observacoes||'')}</textarea></div>
      ${id?`<div class="divider"></div>
        <div class="section-label">Escalões de km (custo por km)</div>
        <div class="item-sub" style="margin-bottom:8px">Cálculo marginal: cada faixa paga a sua taxa só nos km respetivos.</div>
        <div id="taxBox" class="sub-list">${taxas.map(t=>taxRow(t)).join('')}</div>
        <button type="button" class="add-line" style="margin-top:8px" onclick="addTax()">+ Adicionar escalão</button>`
      :'<div class="item-sub" style="margin-top:8px">Guarda a viatura para definir os escalões de km.</div>'}
    </div>
    <div class="modal-foot">
      ${id?`<button class="btn btn-danger" onclick="apagarViatura('${id}')">Apagar</button>`:''}
      <button class="btn btn-primary" id="saveViat">Guardar</button>
    </div>`);
  $('#saveViat').onclick=()=>saveViatura(v, taxas);
}
function taxRow(t){
  return `<div class="sub-row tax-row">
    <input type="number" class="tx-de" inputmode="numeric" placeholder="de km" value="${esc(t.km_de??0)}" style="flex:1">
    <input type="number" class="tx-ate" inputmode="numeric" placeholder="até (vazio=∞)" value="${esc(t.km_ate??'')}" style="flex:1">
    <input type="number" class="tx-val" inputmode="decimal" placeholder="€/km" value="${esc(t.valor_km??'')}" style="flex:1">
    <button type="button" class="icon-btn" onclick="this.parentNode.remove()">×</button></div>`;
}
function addTax(){ const b=$('#taxBox'); const d=document.createElement('div'); d.className='sub-row tax-row';
  d.innerHTML=`<input type="number" class="tx-de" inputmode="numeric" placeholder="de km" value="0" style="flex:1">
    <input type="number" class="tx-ate" inputmode="numeric" placeholder="até (vazio=∞)" style="flex:1">
    <input type="number" class="tx-val" inputmode="decimal" placeholder="€/km" style="flex:1">
    <button type="button" class="icon-btn" onclick="this.parentNode.remove()">×</button>`;
  b.appendChild(d); }
async function saveViatura(v){
  const body={ matricula:$('#v_mat').value.trim(), marca:$('#v_marca').value.trim()||null, modelo:$('#v_modelo').value.trim()||null,
    lotacao:$('#v_lot').value?Number($('#v_lot').value):null, estado:$('#v_estado').value, observacoes:$('#v_obs').value.trim()||null };
  if(!body.matricula){ toast('A matrícula é obrigatória',true); return; }
  $('#saveViat').disabled=true;
  try{
    let vid=v.id;
    if(vid) await sbUpdate('viaturas',vid,body); else { const nv=await sbInsert('viaturas',body); vid=nv.id; }
    if(v.id){
      await sbDelete('taxas_viatura','viatura_id=eq.'+vid);
      const rows=[...document.querySelectorAll('#taxBox .tax-row')];
      for(const r of rows){
        const de=r.querySelector('.tx-de').value, ate=r.querySelector('.tx-ate').value, val=r.querySelector('.tx-val').value;
        if(val==='') continue;
        await sbInsert('taxas_viatura',{viatura_id:vid, km_de:de?Number(de):0, km_ate:ate?Number(ate):null, valor_km:Number(val)});
      }
    }
    await loadCaches(); closeModal(); toast('Viatura guardada'); viewViaturas();
  }catch(e){ toast(e.message,true); $('#saveViat').disabled=false; }
}
function apagarViatura(id){ confirmar('Apagar esta viatura?', async()=>{
  await sbDelete('viaturas','id=eq.'+id); await loadCaches(); closeModal(); toast('Viatura apagada'); viewViaturas(); }, true); }

/* =========================================================
   TIPOS DE SERVIÇO
========================================================= */
async function viewTipos(){
  $('#view').innerHTML=`
    <div class="view-head"><h2>Tipos de serviço</h2><button class="btn btn-primary" onclick="editTipo()">+ Novo</button></div>
    ${cache.areas.map(a=>{
      const ts=cache.tipos.filter(t=>t.area_id===a.id);
      return `<div class="dash-group"><h3>${esc(a.nome).toUpperCase()}</h3><div class="list">
        ${ts.length?ts.map(t=>`<div class="item" style="padding:11px 12px"><div class="item-top">
          <div class="item-title" style="font-size:14px">${esc(t.nome)}</div>
          <div style="display:flex;gap:6px;align-items:center">${t.ativo===false?'<span class="pill p-off">Inativo</span>':''}
            <button class="btn btn-ghost btn-sm" onclick="editTipo('${t.id}')">Editar</button></div></div></div>`).join('')
          :'<div class="item-sub">Sem tipos nesta área.</div>'}
      </div></div>`;
    }).join('')}
    ${cache.tipos.some(t=>t.area_id==null)?`<div class="dash-group"><h3>TODAS AS ÁREAS</h3><div class="list">
      ${cache.tipos.filter(t=>t.area_id==null).map(t=>`<div class="item" style="padding:11px 12px"><div class="item-top">
        <div class="item-title" style="font-size:14px">${esc(t.nome)}</div>
        <button class="btn btn-ghost btn-sm" onclick="editTipo('${t.id}')">Editar</button></div></div>`).join('')}</div></div>`:''}`;
}
async function editTipo(id){
  const t = id ? cache.tipos.find(x=>x.id===id) : {ativo:true,ordem:0};
  openModal(`
    <div class="modal-head"><h3>${id?'Tipo de serviço':'Novo tipo'}</h3><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field"><label>Área</label><select id="t_area"><option value="">Todas as áreas</option>${opts(cache.areas,t.area_id,'id',a=>a.nome)}</select></div>
      <div class="field"><label>Nome</label><input id="t_nome" value="${esc(t.nome||'')}"></div>
      <div class="field"><label>Ordem</label><input type="number" id="t_ordem" inputmode="numeric" value="${esc(t.ordem??0)}"></div>
      <label class="check"><input type="checkbox" id="t_ativo" ${t.ativo!==false?'checked':''}> Ativo</label>
    </div>
    <div class="modal-foot">
      ${id?`<button class="btn btn-danger" onclick="apagarTipo('${id}')">Apagar</button>`:''}
      <button class="btn btn-primary" id="saveTipo">Guardar</button>
    </div>`);
  $('#saveTipo').onclick=async()=>{
    const body={ area_id:$('#t_area').value||null, nome:$('#t_nome').value.trim(),
      ordem:$('#t_ordem').value?Number($('#t_ordem').value):0, ativo:$('#t_ativo').checked };
    if(!body.nome){ toast('O nome é obrigatório',true); return; }
    $('#saveTipo').disabled=true;
    try{ if(id) await sbUpdate('tipos_servico',id,body); else await sbInsert('tipos_servico',body);
      await loadCaches(); closeModal(); toast('Tipo guardado'); viewTipos();
    }catch(e){ toast(e.message,true); $('#saveTipo').disabled=false; }
  };
}
function apagarTipo(id){ confirmar('Apagar este tipo de serviço?', async()=>{
  await sbDelete('tipos_servico','id=eq.'+id); await loadCaches(); closeModal(); toast('Tipo apagado'); viewTipos(); }, true); }

/* =========================================================
   Arranque
========================================================= */
async function init(){
  buildNav();
  try{ await loadCaches(); render(); }
  catch(e){
    $('#banner').className='banner show';
    $('#banner').textContent='Não foi possível ligar à base de dados. Verifica o URL/chave do Supabase. Detalhe: '+e.message;
    $('#view').innerHTML='';
  }
}
init();
</script>
</body>
</html>
