<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b7cc0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Espaços Cidadão">
<title>Espaços Cidadão sem Fronteiras · Planeamento</title>
<style>
/* ===== Sistema visual — baseado na Carta Desportiva Municipal ===== */
:root {
  --fundo: #f3f8fc; --sup: #ffffff; --sup2: #eaf3fb; --texto: #172430; --suave: #56687a;
  --linha: #d6e3ef; --acento: #2b7cc0; --acento-txt: #ffffff; --acento-suave: #e1effb; --topo: #e6f2fc;
  --perigo: #b42318; --perigo-suave: #fdecea; --aviso: #8a5a00; --aviso-suave: #fff4dc;
  --info: #1d5fa8; --info-suave: #e6f0fb; --roxo: #6b3fa0; --roxo-suave: #f1eafa;
  --sombra: 0 1px 2px rgba(16,24,20,.06), 0 4px 16px rgba(16,24,20,.06);
  --raio: 10px; --row: 30px;
  --g-area: #7fa6c8; --g-area-cheio: #1d4f7a; --g-tarefa: #b5d6f2; --g-tarefa-cheio: #2b7cc0; --g-linha: #edf3f9; --g-hoje: #c8402f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fundo: #0f151b; --sup: #17202a; --sup2: #1f2a36; --texto: #e4ecf3; --suave: #9aabbb;
    --linha: #2b3a48; --acento: #7cc0f2; --acento-txt: #08131d; --acento-suave: #16304a; --topo: #152738;
    --perigo: #f28b82; --perigo-suave: #3a1d1b; --aviso: #f2c063; --aviso-suave: #352a12;
    --info: #8ab8f0; --info-suave: #17283c; --roxo: #c9a8f0; --roxo-suave: #2a2038;
    --sombra: 0 1px 2px rgba(0,0,0,.4);
    --g-area: #6f97bb; --g-area-cheio: #e4ecf3; --g-tarefa: #2a4f72; --g-tarefa-cheio: #7cc0f2; --g-linha: #1f2a36; --g-hoje: #f28b82;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden], .hidden { display: none !important; }
html, body { margin: 0; background: var(--fundo); color: var(--texto); }
body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
body.locked { overflow: hidden; position: fixed; width: 100%; }
a { color: var(--acento); }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 16px; margin: 0; }
h3 { font-size: 13px; margin: 0; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; font-weight: 650; }
button, input, select, textarea { font: inherit; color: inherit; }
.muted { color: var(--suave); } .small { font-size: 13px; } .nowrap { white-space: nowrap; } .right { text-align: right; } .center { text-align: center; }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--suave); white-space: nowrap; }
.spacer { flex: 1; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Topo e navegação */
.topo { position: sticky; top: 0; z-index: 900; background: var(--topo); border-bottom: 1px solid var(--linha); padding-top: env(safe-area-inset-top); }
.topo-linha { display: flex; align-items: center; gap: 12px; padding: 10px 16px; max-width: 1240px; margin: 0 auto; }
.marca { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--texto); font-weight: 650; white-space: nowrap; }
.marca svg { width: 26px; height: 26px; flex: none; }
@media (max-width: 560px) { .topo .marca span { display: none; } }
.topo-ent { display: flex; align-items: center; gap: 8px; margin-left: auto; min-width: 0; }
.ent-nome { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.etq-funcao { background: var(--acento-suave); color: var(--acento); }
.btn-texto { border: 0; background: none; color: var(--suave); cursor: pointer; padding: 8px; }
.nav { display: flex; gap: 4px; padding: 0 12px; max-width: 1240px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { padding: 10px 12px; text-decoration: none; color: var(--suave); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; cursor: pointer; }
.nav a.on { color: var(--texto); border-bottom-color: var(--acento); }
#view { max-width: 1240px; margin: 0 auto; padding: 20px 16px calc(96px + env(safe-area-inset-bottom)); }
.cab-vista { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-bottom: 16px; }
.cab-vista .acoes { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.voltar { display: inline-block; margin-bottom: 8px; text-decoration: none; font-size: 14px; cursor: pointer; }
.rodape-app { text-align: center; color: var(--suave); font-size: 12px; padding: 8px 16px 90px; }

/* Botões e etiquetas */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--linha); background: var(--sup); cursor: pointer; text-decoration: none; color: var(--texto); font-weight: 550; min-height: 40px; white-space: nowrap; line-height: 1.2; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--acento); border-color: var(--acento); color: var(--acento-txt); }
.btn.danger { color: var(--perigo); border-color: var(--perigo); background: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--suave); }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: 14px; }
.pill { flex: none; display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--sup2); color: var(--suave); white-space: nowrap; }
.s-concluida, .s-ok, .s-concluido, .s-verde { background: var(--acento-suave); color: var(--acento); }
.s-concluida_atraso { background: var(--acento-suave); color: var(--aviso); }
.s-em_curso, .s-em_curso_np { background: var(--info-suave); color: var(--info); }
.s-atrasada, .s-conflito, .s-bad, .s-vermelho { background: var(--perigo-suave); color: var(--perigo); }
.s-inicio_atrasado, .s-risco, .s-warn, .s-em_risco, .s-amarelo { background: var(--aviso-suave); color: var(--aviso); }
.s-bloqueada { background: var(--roxo-suave); color: var(--roxo); }
.s-nao_planeada, .s-por_avaliar, .s-cinzento { background: var(--sup2); color: var(--suave); }
.s-planeada, .s-previsto, .s-cancelada, .s-cancelado, .s-inativa, .s-suspensa { background: var(--sup2); color: var(--suave); }
.p-critica { color: var(--perigo); font-weight: 700; } .p-alta { color: var(--aviso); font-weight: 600; }
.semaforo { display: inline-block; width: 11px; height: 11px; border-radius: 50%; flex: none; vertical-align: -1px; }
.sem-verde { background: #2e9e6e; } .sem-amarelo { background: #e0a21b; } .sem-vermelho { background: #d0402f; } .sem-cinzento { background: #aab4af; } .sem-concluida { background: #2b7cc0; box-shadow: inset 0 0 0 2px var(--sup); outline: 2px solid #2b7cc0; }

/* Cartões e números */
.card, .cartao { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); box-shadow: var(--sombra); }
.card > .hd { display: flex; align-items: center; gap: 8px; padding: 14px 16px 0; }
.card > .hd h2, .card > .hd h3 { flex: 1; }
.card > .bd { padding: 12px 16px 16px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1000px) { .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) { .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); padding: 14px 16px; text-decoration: none; color: inherit; }
.kpi[data-go] { cursor: pointer; } .kpi[data-go]:hover { border-color: var(--acento); }
.kpi b { display: block; font-size: 28px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi span { color: var(--suave); font-size: 13px; }
.kpi.bad b { color: var(--perigo); } .kpi.warn b { color: var(--aviso); } .kpi.ok b { color: var(--acento); }
.bar { height: 8px; background: var(--sup2); border-radius: 4px; overflow: hidden; min-width: 50px; }
.bar > i { display: block; height: 100%; background: var(--acento); border-radius: 4px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 9px 0; border-bottom: 1px solid var(--linha); display: flex; gap: 6px 10px; align-items: flex-start; flex-wrap: wrap; }
.list li:last-child { border-bottom: 0; }
.list li > .grow { flex: 1; min-width: 200px; }
.list li > .acts { margin-left: auto; }
.list .tt { cursor: pointer; } .list .tt:hover { color: var(--acento); }
.empty { color: var(--suave); font-size: 14px; padding: 8px 0; }
.alert, .nota { background: var(--info-suave); border-left: 3px solid var(--info); padding: 10px 12px; border-radius: 6px; font-size: 14px; margin: 0 0 12px; }
.alert { background: var(--perigo-suave); border-left-color: var(--perigo); }
.alert.warn, .nota.aviso { background: var(--aviso-suave); border-left-color: var(--aviso); }
.alert.info { background: var(--info-suave); border-left-color: var(--info); }
.alert dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 6px 0 0; }
.alert dt { font-weight: 600; font-size: 12.5px; color: var(--suave); } .alert dd { margin: 0; font-size: 13.5px; }
@media (max-width: 520px) { .alert dl { grid-template-columns: 1fr; } .alert dd { margin-bottom: 6px; } }
.formula { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--suave); }
.passos-lista { list-style: none; padding: 0; margin: 0; }
.passos-lista li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--linha); flex-wrap: wrap; }
.passos-lista li:last-child { border-bottom: 0; }
.passos-lista .ok { color: var(--acento); font-weight: 700; width: 18px; flex: none; }
.passos-lista .nao { color: var(--suave); width: 18px; flex: none; }
.passos-lista .txt { flex: 1; min-width: 200px; }
.passos-lista .txt small { display: block; color: var(--suave); }
.dl-dados { display: grid; grid-template-columns: minmax(130px, 200px) 1fr; gap: 6px 14px; margin: 0; font-size: 14.5px; }
.dl-dados dt { color: var(--suave); } .dl-dados dd { margin: 0; }
@media (max-width: 520px) { .dl-dados { grid-template-columns: 1fr; gap: 0; } .dl-dados dd { margin-bottom: 8px; } }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--suave); }

/* Filtros e tabelas */
.filters, .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filters select, .filters input, .toolbar select, .toolbar input[type=search], .maisfiltros select, .maisfiltros input { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--linha); background: var(--sup); font-size: 16px; min-height: 40px; max-width: 100%; min-width: 0; }
.filters input[type=search], .toolbar input[type=search] { flex: 1 1 220px; }
.maisfiltros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px; background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--linha); border-radius: 8px; overflow: hidden; background: var(--sup); max-width: 100%; overflow-x: auto; }
.seg button { flex: 0 0 auto; border: 0; background: var(--sup); padding: 8px 12px; cursor: pointer; min-height: 40px; border-right: 1px solid var(--linha); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--acento); color: var(--acento-txt); }
.tblwrap { overflow-x: auto; background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); }
.card.tblwrap { box-shadow: none; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 600; color: var(--suave); padding: 10px 12px; border-bottom: 1px solid var(--linha); white-space: nowrap; background: var(--sup2); }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--linha); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.clk { cursor: pointer; } .tbl tr.clk:hover td { background: var(--acento-suave); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.lvl2 td:nth-child(2) { padding-left: 28px; color: var(--suave); }
@media (max-width: 720px) {
  .tbl.resp thead { display: none; }
  .tbl.resp, .tbl.resp tbody, .tbl.resp tr, .tbl.resp td { display: block; width: 100%; }
  .tbl.resp tr { padding: 10px 12px; border-bottom: 1px solid var(--linha); }
  .tbl.resp td { border: 0; padding: 2px 0; display: flex; gap: 8px; align-items: center; }
  .tbl.resp td::before { content: attr(data-l); color: var(--suave); min-width: 105px; flex: none; font-size: 13px; }
  .tbl.resp td.titulo { font-weight: 600; font-size: 15px; }
  .tbl.resp td.titulo::before, .tbl.resp td[data-l=""]::before { display: none; }
  .tbl.resp td.num { text-align: left; }
}

/* Formulários */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.form .full { grid-column: 1 / -1; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--suave); min-width: 0; }
.form input, .form select, .form textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--linha); border-radius: 8px; background: var(--sup); font-size: 16px; min-height: 42px; font-weight: 400; color: var(--texto); min-width: 0; }
.form textarea { resize: vertical; min-height: 70px; line-height: 1.45; }
.form input:focus, .form select:focus, .form textarea:focus, .filters input:focus, .filters select:focus { outline: 2px solid var(--acento); outline-offset: -1px; border-color: var(--acento); }
.form :disabled { background: var(--sup2); color: var(--texto); opacity: 1; -webkit-text-fill-color: var(--texto); }
.form .calc { padding: 10px; background: var(--sup2); border-radius: 8px; font-weight: 400; font-size: 15px; color: var(--texto); min-height: 42px; }
.form .sec { grid-column: 1 / -1; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); font-weight: 650; border-bottom: 1px solid var(--linha); padding-bottom: 4px; margin-top: 6px; }
.form .err { color: var(--perigo); font-size: 13px; font-weight: 600; }
.form .chk { flex-direction: row; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: var(--texto); }
.form .chk input { width: 20px; height: 20px; min-height: 0; accent-color: var(--acento); }
@media (max-width: 640px) { .form { grid-template-columns: minmax(0, 1fr); } }
input[type=date] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; text-align: left; max-width: 100%; }
input[type=date]::-webkit-date-and-time-value { text-align: left; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--acento-suave); color: var(--acento); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 13px; }
.chip button { border: 0; background: rgba(0,0,0,.08); border-radius: 999px; width: 20px; height: 20px; cursor: pointer; line-height: 1; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--linha); margin-bottom: 12px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 12px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--suave); white-space: nowrap; font-weight: 500; }
.tabs button.on { border-color: var(--acento); color: var(--texto); }
.sw { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--sup); box-shadow: 0 0 0 1px var(--linha); cursor: pointer; padding: 0; flex: 0 0 24px; }
.arealist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px 14px; max-height: 340px; overflow: auto; border: 1px solid var(--linha); border-radius: 8px; padding: 8px 10px; background: var(--sup2); }
.arealist label { display: flex; gap: 6px; align-items: flex-start; font-size: 14px; padding: 3px 0; cursor: pointer; }

/* Modal (folha em baixo no telemóvel) */
#modalRoot { position: fixed; inset: 0; z-index: 2000; display: none; }
#modalRoot.on { display: block; }
#modalRoot .scrim { position: absolute; inset: 0; background: rgba(10,16,13,.5); }
#modalRoot .box { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(760px, calc(100vw - 32px)); max-height: 92dvh; display: flex; flex-direction: column; background: var(--sup); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
#modalRoot .box.sm { width: min(520px, calc(100vw - 32px)); }
#modalRoot .mh { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--linha); }
#modalRoot .mh h2 { flex: 1; font-size: 17px; }
#modalRoot .mh .btn.ghost { font-size: 22px; padding: 2px 8px; min-height: 0; }
#modalRoot .mb { padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
#modalRoot .mf { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--linha); flex-wrap: wrap; }
@media (max-width: 640px) {
  #modalRoot .box, #modalRoot .box.sm { top: auto; bottom: 0; transform: translateX(-50%); width: 100vw; border-radius: 14px 14px 0 0; }
  #modalRoot .mf .btn.primary { flex: 1; }
}
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 3000; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
#toast div { background: #18211d; color: #fff; padding: 12px 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 14px; }
#toast div.err { background: #8f1d14; }

/* Entrada */
#login { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
#login .card { width: 100%; max-width: 400px; padding: 28px 24px; }
#login .form { grid-template-columns: 1fr; margin-top: 20px; }
#login .btn.primary { width: 100%; min-height: 46px; }

/* Planeamento rápido / tarefas editáveis */
.pl { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; }
.pl-h, .pl-r { display: grid; grid-template-columns: minmax(0, 1fr) 140px 140px 70px 170px 132px 36px; gap: 8px; align-items: center; padding: 6px 12px; }
.pl-h { background: var(--sup2); font-size: 13px; font-weight: 600; color: var(--suave); border-bottom: 1px solid var(--linha); }
.pl-r { border-bottom: 1px solid var(--linha); }
.pl-r:last-child { border-bottom: 0; }
.pl-r.area { background: var(--sup2); font-weight: 600; }
.pl-r.t { padding-left: 28px; } .pl-r.s { padding-left: 50px; }
.pl-r .nm { display: flex; align-items: center; gap: 6px; min-width: 0; }
.pl-r .nm .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-r input, .pl-r select { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 6px; font-size: 14px; min-width: 0; color: var(--texto); }
.pl-r input:hover, .pl-r select:hover { border-color: var(--linha); background: var(--sup); }
.pl-r input:focus, .pl-r select:focus { border-color: var(--acento); background: var(--sup); outline: 2px solid var(--acento-suave); }
.pl-r input.vazio { color: var(--suave); }
.pl-r .dur { font-size: 13px; color: var(--suave); text-align: right; white-space: nowrap; }
.pl-r .car { cursor: pointer; width: 18px; flex: 0 0 18px; text-align: center; color: var(--suave); font-size: 11px; }
.pl-r .ico { border: 0; background: none; cursor: pointer; color: var(--suave); font-size: 16px; padding: 4px; }
.pl-add { padding: 8px 12px 10px 50px; border-bottom: 1px solid var(--linha); }
.pl-mini { font-size: 12px; color: var(--suave); font-weight: 400; }
.lbl-m { display: none; }
@media (max-width: 900px) {
  .pl-h { display: none; }
  .pl-r { grid-template-columns: 1fr 1fr; padding: 10px 12px; gap: 6px 8px; }
  .pl-r.t, .pl-r.s { padding-left: 12px; }
  .pl-r.s { border-left: 3px solid var(--linha); }
  .pl-r .nm { grid-column: 1 / -1; }
  .pl-r .dur { text-align: left; }
  .lbl-m { display: block; font-size: 11px; color: var(--suave); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .pl-r input, .pl-r select { border-color: var(--linha); background: var(--sup); font-size: 16px; min-height: 40px; }
  .pl-r .ico { justify-self: end; }
  .pl-add { padding-left: 12px; }
}

<script id="core-js">
/* ===== Núcleo de cálculo (sem DOM) — testável em node ===== */
const ESTADOS = { nao_iniciada: 'Não iniciada', em_curso: 'Em curso', concluida: 'Concluída', bloqueada: 'Bloqueada', suspensa: 'Suspensa', cancelada: 'Cancelada' };
const ESTADOS_MARCO = { previsto: 'Previsto', em_risco: 'Em risco', concluido: 'Concluído', cancelado: 'Cancelado' };
const PRIORIDADES = { baixa: 'Baixa', media: 'Média', alta: 'Alta', critica: 'Crítica' };
const TIPOS_DEP = { FS: 'Fim → Início', SS: 'Início → Início', FF: 'Fim → Fim', SF: 'Início → Fim' };
const TIPOS_DEP_LONGO = {
  FS: 'a sucessora só pode começar depois de a predecessora terminar',
  SS: 'a sucessora só pode começar depois de a predecessora começar',
  FF: 'a sucessora só pode terminar depois de a predecessora terminar',
  SF: 'a sucessora só pode terminar depois de a predecessora começar'
};
const DIA_MS = 86400000;

/* Datas como número de dia (UTC) para evitar problemas de fuso/horário de verão */
function pd(s) { if (!s) return null; const p = String(s).slice(0, 10).split('-').map(Number); if (p.length < 3 || p.some(isNaN)) return null; return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / DIA_MS); }
function ds(n) { if (n == null || isNaN(n)) return null; return new Date(n * DIA_MS).toISOString().slice(0, 10); }
function fd(s) { if (!s) return '—'; const p = String(s).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function fdn(n) { return n == null ? '—' : fd(ds(n)); }
function hojeN(ref) { const t = ref || new Date(); return Math.round(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / DIA_MS); }
function diaSemana(n) { return new Date(n * DIA_MS).getUTCDay(); }
function eUtil(n, fer) { const w = diaSemana(n); return w !== 0 && w !== 6 && !(fer && fer.has(n)); }
function unidade(metodo, n) { const u = metodo === 'calendario'; if (n === 1) return u ? 'dia' : 'dia útil'; return u ? 'dias' : 'dias úteis'; }
function unidadeCurta(metodo) { return metodo === 'calendario' ? 'd' : 'd.ú.'; }

/* Duração inclusiva (início e fim contam). null se faltar uma data; NaN se fim < início */
function duracao(ini, fim, metodo, fer) {
  const a = pd(ini), b = pd(fim);
  if (a == null || b == null) return null;
  if (b < a) return NaN;
  if (metodo === 'calendario') return b - a + 1;
  let c = 0; for (let n = a; n <= b; n++) if (eUtil(n, fer)) c++;
  return c;
}

/* Desloca k unidades (dias de calendário ou dias úteis) a partir do dia n */
function somarDias(n, k, metodo, fer) {
  if (!k) return n;
  if (metodo === 'calendario') return n + k;
  const passo = k > 0 ? 1 : -1; let falta = Math.abs(k), x = n, guard = 0;
  while (falta > 0 && guard++ < 20000) { x += passo; if (eUtil(x, fer)) falta--; }
  return x;
}

/* ===== Dependências ===== */
/* Regras (L = desfasamento, na unidade configurada):
   FS: início(S) > fim(P) + L       SS: início(S) ≥ início(P) + L
   FF: fim(S)   ≥ fim(P) + L        SF: fim(S)    ≥ início(P) + L        */
function regraDep(tipo) {
  return {
    FS: { campoP: 'fim', campoS: 'inicio' }, SS: { campoP: 'inicio', campoS: 'inicio' },
    FF: { campoP: 'fim', campoS: 'fim' }, SF: { campoP: 'inicio', campoS: 'fim' }
  }[tipo];
}
function dataPrev(a, campo) { return pd(campo === 'inicio' ? a.data_inicio_prevista : a.data_fim_prevista); }
function dataEf(a, campo) { return pd(campo === 'inicio' ? a.data_inicio_efetiva : a.data_fim_efetiva); }

function limitesDep(tipo, L, pVal, sVal, metodo, fer) {
  // sMin: primeiro dia admissível para a sucessora; pMax: último dia admissível para a predecessora
  L = L || 0;
  if (tipo === 'FS') return {
    sMin: pVal == null ? null : somarDias(somarDias(pVal, L, metodo, fer), 1, metodo, fer),
    pMax: sVal == null ? null : somarDias(somarDias(sVal, -1, metodo, fer), -L, metodo, fer)
  };
  return { sMin: pVal == null ? null : somarDias(pVal, L, metodo, fer), pMax: sVal == null ? null : somarDias(sVal, -L, metodo, fer) };
}
/* true se a dependência é violada */
function violaDep(tipo, L, pVal, sVal, metodo, fer) {
  L = L || 0;
  const ref = somarDias(pVal, L, metodo, fer);
  return tipo === 'FS' ? sVal <= ref : sVal < ref;
}

function eConcluida(a) { return a.estado === 'concluida'; }
function eFechada(a) { return a.estado === 'concluida' || a.estado === 'cancelada'; }

/* Avalia uma dependência. Estados: ok | conflito | risco | por_avaliar | inativa */
function avaliarDep(dep, P, S, metodo, fer, hoje) {
  const r = regraDep(dep.tipo); const L = dep.desfasamento || 0;
  if (!P || !S) return { estado: 'por_avaliar', motivo: 'Atividade inexistente.' };
  if (P.estado === 'cancelada' || S.estado === 'cancelada') return { estado: 'inativa', motivo: 'Uma das atividades está cancelada.' };
  // 1) Execução real
  const pEf = dataEf(P, r.campoP), sEf = dataEf(S, r.campoS);
  if (sEf != null) {
    if (pEf == null) return { estado: 'conflito', tipoConflito: 'execucao', r, L, sVal: sEf, pVal: null };
    const lim = limitesDep(dep.tipo, L, pEf, sEf, metodo, fer);
    if (violaDep(dep.tipo, L, pEf, sEf, metodo, fer)) return { estado: 'conflito', tipoConflito: 'execucao', r, L, sVal: sEf, pVal: pEf, sMin: lim.sMin };
    return { estado: 'ok', r, L };
  }
  // 2) Planeamento
  const pV = pEf != null ? pEf : dataPrev(P, r.campoP);
  const sV = dataPrev(S, r.campoS);
  if (pV == null || sV == null) return { estado: 'por_avaliar', r, L, faltaP: pV == null, faltaS: sV == null };
  const lim = limitesDep(dep.tipo, L, pV, sV, metodo, fer);
  if (violaDep(dep.tipo, L, pV, sV, metodo, fer)) return { estado: 'conflito', tipoConflito: 'planeamento', r, L, sVal: sV, pVal: pV, sMin: lim.sMin, pMax: lim.pMax };
  // 3) Risco: predecessora atrasada face a hoje
  if (hoje != null && pEf == null && !eFechada(P) && pV < hoje) {
    const proj = limitesDep(dep.tipo, L, hoje, sV, metodo, fer);
    if (violaDep(dep.tipo, L, hoje, sV, metodo, fer)) return { estado: 'risco', r, L, sVal: sV, pVal: pV, sMin: proj.sMin, pMax: lim.pMax };
  }
  return { estado: 'ok', r, L };
}

/* Texto do alerta, com os 5 elementos exigidos */
function alertaDep(dep, P, S, av, ctx) {
  const nome = a => ctx.codigo(a) + ' ' + a.designacao;
  const campo = c => c === 'inicio' ? 'início' : 'conclusão';
  const oCampo = c => c === 'inicio' ? 'o início' : 'a conclusão';
  const doCampo = c => c === 'inicio' ? 'do início' : 'da conclusão';
  const lag = av.L ? ` com desfasamento de ${av.L > 0 ? '+' : ''}${av.L} ${unidade(ctx.metodo, Math.abs(av.L))}` : '';
  const nSuc = ctx.nSucessoras ? ctx.nSucessoras(S.id) : 0;
  const base = { afetada: nome(S), predecessora: nome(P) };
  if (av.estado === 'por_avaliar') {
    const falta = [av.faltaP ? `a data ${doCampo(av.r.campoP)} da predecessora` : null, av.faltaS ? `a data ${doCampo(av.r.campoS)} da sucessora` : null].filter(Boolean).join(' e ');
    return Object.assign(base, {
      incompatibilidade: `Dependência ${TIPOS_DEP[dep.tipo]}${lag} não pode ser verificada: falta ${falta}.`,
      consequencia: 'Não é possível confirmar se o planeamento respeita esta dependência.',
      correcao: 'Definir as datas previstas em falta.'
    });
  }
  if (av.tipoConflito === 'execucao') {
    return Object.assign(base, {
      incompatibilidade: av.pVal == null
        ? `A sucessora tem data efetiva ${doCampo(av.r.campoS)} (${fdn(av.sVal)}), mas a predecessora ainda não tem data efetiva ${doCampo(av.r.campoP)} (${TIPOS_DEP[dep.tipo]}: ${TIPOS_DEP_LONGO[dep.tipo]}).`
        : `A data efetiva ${doCampo(av.r.campoS)} da sucessora (${fdn(av.sVal)}) é anterior ao mínimo permitido (${fdn(av.sMin)}) pela data efetiva ${doCampo(av.r.campoP)} da predecessora (${fdn(av.pVal)}).`,
      consequencia: 'A execução não respeitou a sequência definida; o trabalho realizado pode ter de ser revisto.',
      correcao: 'Confirmar as datas efetivas registadas ou rever/eliminar a dependência se já não se aplicar.'

async function gravar(tabela, op, payload, filtro) {
  let r;
  if (op === 'insert') r = await sb.from(tabela).insert(payload).select();
  else if (op === 'update') r = await sb.from(tabela).update(payload).match(filtro).select();
  else if (op === 'delete') r = await sb.from(tabela).delete().match(filtro);
  if (r.error) throw r.error;
  if (op === 'update' && Array.isArray(r.data) && r.data.length === 0) throw new Error('A alteração não foi guardada (sem permissão ou registo inexistente).');
  return r.data;
}

const SEMAFORO = { verde: 'Dentro do previsto', amarelo: 'Requer atenção', vermelho: 'Atraso ou conflito', cinzento: 'Por planear', concluida: 'Concluída' };
function semaforoArea(ar) {
  if (ar.estado === 'concluida') return 'concluida';
  const todas = S.ativ.filter(a => a.area_id === ar.id && a.estado !== 'cancelada');
  const temDatas = (ar.data_inicio_prevista && ar.data_fim_prevista) || todas.some(a => !semDatas(a));
  if (!temDatas) return 'cinzento';
  const h = S.hoje;
  const atraso = (ar.data_fim_prevista && pd(ar.data_fim_prevista) < h) || todas.some(a => eAtrasada(a, h));
  const confl = S.deps.some(d => { const P = S.byId.get(d.predecessora_id), X = S.byId.get(d.sucessora_id); return ((P && P.area_id === ar.id) || (X && X.area_id === ar.id)) && avaliar(d).estado === 'conflito'; });
  if (atraso || confl) return 'vermelho';
  const iniciou = ar.data_inicio_prevista && pd(ar.data_inicio_prevista) <= h;
  const atencao = todas.some(a => sit(a) === 'inicio_atrasado' || a.estado === 'bloqueada') || (iniciou && todas.some(semDatas)) || S.deps.some(d => { const X = S.byId.get(d.sucessora_id); return X && X.area_id === ar.id && avaliar(d).estado === 'risco'; });
  return atencao ? 'amarelo' : 'verde';
}

function filtroTarefas(a, f) {
  if (f.area && String(a.area_id) !== String(f.area)) return false;
  if (f.resp === '_none' ? a.responsavel_id : (f.resp && String(a.responsavel_id) !== String(f.resp))) return false;
  if (f.prio && a.prioridade !== f.prio) return false;
  if (f.nivel && String(a.nivel) !== f.nivel) return false;
  const s = sit(a);
  if (f.sit && s !== f.sit) return false;
  if (f.q) { const t = (codigo(a) + ' ' + a.designacao + ' ' + (a.observacoes || '')).toLowerCase(); if (!t.includes(f.q.toLowerCase())) return false; }
  switch (f.quick) {

const ZOOMS = { dia: ['Dia', 30], semana: ['Semana', 9], mes: ['Mês', 2.6], trimestre: ['Trimestre', 1.05], ano: ['Ano', 0.4] };
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const ROW = 30;

function filtrosAtivosG(g) { return !!(g.resp || g.estado || g.prio || g.de || g.ate || g.quick); }
function passaFiltroG(a, g) {
  if (g.resp === '_none' ? a.responsavel_id : (g.resp && String(a.responsavel_id) !== String(g.resp))) return false;
  if (g.prio && a.prioridade !== g.prio) return false;
  const s = sit(a);
  if (g.estado && a.estado !== g.estado) return false;
  if (g.de || g.ate) {
    const i = pd(a.data_inicio_prevista), f = pd(a.data_fim_prevista);
    if (i == null || f == null) return false;
    if (g.de && f < pd(g.de)) return false; if (g.ate && i > pd(g.ate)) return false;
  }
  switch (g.quick) {
    case 'emcurso': if (!(a.estado === 'em_curso' || ['em_curso', 'em_curso_np'].includes(s))) return false; break;
    case 'atrasadas': if (!(s === 'atrasada' || s === 'inicio_atrasado')) return false; break;
    case 'bloqueadas': if (a.estado !== 'bloqueada') return false; break;
    case 'naoplaneadas': if (a.estado === 'cancelada' || !semDatas(a)) return false; break;
  }
  return true;
}
function linhasGantt(g) {
  const rows = []; const exp = new Set(g.exp), expT = new Set(g.expT); const filt = filtrosAtivosG(g);
  const marcosProj = S.marcos.filter(m => m.estado !== 'cancelado' && (m.data_prevista || m.data_efetiva));
  if (!g.area && !filt && marcosProj.length) rows.push({ tipo: 'marcos' });
  for (const ar of S.areas) {
    if (g.area && String(ar.id) !== String(g.area)) continue;
    const tarefas = S.tarefasDe.get(ar.id) || [];
    let filhos = [];
    for (const t of tarefas) {
      const subs = S.filhosDe.get(t.id) || [];
      const subsOk = filt ? subs.filter(s => passaFiltroG(s, g)) : subs;
      const tOk = !filt || passaFiltroG(t, g);
      if (!tOk && !subsOk.length) continue;
      filhos.push({ t, subs: subsOk, forcarSubs: filt && subsOk.length > 0 && !tOk });
    }
    if (filt && !filhos.length) continue;
    const aberta = exp.has(ar.id) || filt || !!g.area;
    rows.push({ tipo: 'area', obj: ar, aberta, n: tarefas.length });
    if (!aberta) continue;
    for (const { t, subs, forcarSubs } of filhos) {
      const nSubs = (S.filhosDe.get(t.id) || []).length;
      const abertaT = g.subs || expT.has(t.id) || forcarSubs || (filt && subs.length);
      rows.push({ tipo: 'ativ', obj: t, nivel: 1, aberta: abertaT, nSubs });
      if (abertaT) for (const s of subs) rows.push({ tipo: 'ativ', obj: s, nivel: 2 });
    }
  }
  return rows;

  const lbl = { ok: 'OK', conflito: 'Conflito', risco: 'Risco', por_avaliar: 'Por avaliar', inativa: 'Inativa' }[av.estado];
  return `<li><div class="grow"><div class="tt" data-act="ver-dep" data-id="${d.id}"><span class="code">${codigo(P)}</span> ${viewDe === d.predecessora_id ? '<b>esta</b>' : esc(P ? P.designacao : '')} <span class="muted">→ ${TIPOS_DEP[d.tipo]}${d.desfasamento ? ' ' + (d.desfasamento > 0 ? '+' : '') + d.desfasamento : ''} →</span> <span class="code">${codigo(X)}</span> ${viewDe === d.sucessora_id ? '<b>esta</b>' : esc(X ? X.designacao : '')}</div></div>${pill(av.estado, lbl)}</li>`;
}

/* Impactos de uma alteração: avalia dependências e limites com as datas propostas, sem alterar nada */
function analisarImpactos(orig, v) {
  const prop = Object.assign({}, orig);
  for (const k of ['data_inicio_prevista', 'data_fim_prevista', 'data_inicio_efetiva', 'data_fim_efetiva', 'estado']) if (k in v && v[k] !== undefined) prop[k] = v[k];
  const out = [];
  const ligadas = [...(S.predDe.get(orig.id) || []), ...(S.sucDe.get(orig.id) || [])];
  for (const d of ligadas) {
    const antes = avaliar(d), depois = avaliar(d, prop);
    if (depois.estado === 'conflito' || depois.estado === 'risco') {
      const P = d.predecessora_id === orig.id ? prop : S.byId.get(d.predecessora_id), X = d.sucessora_id === orig.id ? prop : S.byId.get(d.sucessora_id);
      out.push({ novo: antes.estado !== depois.estado, al: alertaDep(d, P, X, depois, ctxAlerta()), estado: depois.estado });
    }
  }
  const lim = [];
  if (orig.nivel === 1) { const ar = S.areaById.get(orig.area_id); if (ar) lim.push(...foraDeIntervalo(prop, { ini: ar.data_inicio_prevista, fim: ar.data_fim_prevista, rotulo: 'da área' })); }
  else { const p = S.byId.get(orig.parent_id); if (p) lim.push(...foraDeIntervalo(prop, { ini: p.data_inicio_prevista, fim: p.data_fim_prevista, rotulo: 'da tarefa' })); }
  for (const f of (S.filhosDe.get(orig.id) || [])) for (const m of foraDeIntervalo(f, { ini: prop.data_inicio_prevista, fim: prop.data_fim_prevista, rotulo: 'desta tarefa' })) lim.push(`a subtarefa ${codigo(f)} ${m}`);
  return { deps: out, lim };
}
function htmlAlerta(x) {
  const al = x.al;
  return `<div class="alert ${x.estado === 'risco' ? 'warn' : ''}"><b>${x.estado === 'risco' ? 'Risco' : 'Conflito'} de dependência${x.novo ? ' (novo)' : ''}</b><dl><dt>Atividade afetada</dt><dd>${esc(al.afetada)}</dd><dt>Predecessora</dt><dd>${esc(al.predecessora)}</dd><dt>Incompatibilidade</dt><dd>${esc(al.incompatibilidade)}</dd><dt>Consequência</dt><dd>${esc(al.consequencia)}</dd><dt>Correção possível</dt><dd>${esc(al.correcao)}</dd></dl></div>`;
}
function mostrarImpactos(box, orig, v) {
  const el = box.querySelector('[data-calc=impactos]'); if (!el) return;
  const r = analisarImpactos(orig, v);
  el.innerHTML = (r.lim.length ? `<div class="alert warn small"><b>Fora dos limites:</b> ${r.lim.map(esc).join('; ')}.</div>` : '') + r.deps.map(htmlAlerta).join('');
}
async function gravarAtividade(id) {
  const box = $('#modalRoot .box'); const v = lerForm(box); const novo = box._novo;
  if (!v.designacao || !v.designacao.trim()) return toast('Indique a designação.', 'err');
  const errD = validarDatas(v); if (errD) return toast(errD, 'err');
  const orig = id ? S.byId.get(id) : null;
  if (v.estado === 'concluida' && !v.data_fim_efetiva) return toast('Indique a data em que foi concluída.', 'err');
  if (orig) {
    const muda = (orig.data_inicio_prevista && v.data_inicio_prevista !== orig.data_inicio_prevista) || (orig.data_fim_prevista && v.data_fim_prevista !== orig.data_fim_prevista);
    if (muda && !(v.motivo_alteracao || '').trim()) return toast('Indique o motivo da alteração das datas planeadas.', 'err');
    const imp = analisarImpactos(orig, v);
    if (imp.deps.some(x => x.novo) || imp.lim.length) {
      const ok = await dialogo({ titulo: 'Impactos da alteração', html: `<p class="small">A alteração não altera automaticamente nenhuma outra atividade. Analise os impactos abaixo e decida.</p>${imp.lim.length ? `<div class="alert warn small"><b>Fora dos limites:</b> ${imp.lim.map(esc).join('; ')}.</div>` : ''}${imp.deps.map(htmlAlerta).join('')}`, botoes: [{ txt: 'Voltar e rever', valor: false }, { txt: 'Gravar mesmo assim', cls: 'primary', valor: true }] });
      if (!ok) return;
    }
  }
  const payload = {
    designacao: v.designacao.trim(), responsavel_id: v.responsavel_id ? Number(v.responsavel_id) : null, prioridade: v.prioridade,
    data_inicio_prevista: v.data_inicio_prevista, data_fim_prevista: v.data_fim_prevista, data_fim_efetiva: v.estado === 'concluida' ? v.data_fim_efetiva : null,
    estado: v.estado, peso: Number(v.peso) || 1, decisao_pendente: !!v.decisao_pendente, decisao_descricao: v.decisao_pendente ? v.decisao_descricao : null,
    motivo_bloqueio: v.estado === 'bloqueada' ? v.motivo_bloqueio : null, observacoes: v.observacoes,
    cor: v.cor_def ? null : v.cor
  };
  if (v.percentagem != null) payload.percentagem = Math.max(0, Math.min(100, Number(v.percentagem) || 0));
  if (payload.estado === 'concluida') payload.percentagem = 100;
  if (payload.data_inicio_efetiva && payload.estado === 'nao_iniciada') payload.estado = 'em_curso';
  try {
    if (id) { payload.motivo_alteracao = v.motivo_alteracao || null; await gravar('atividades', 'update', payload, { id }); }
    else {
      const areaId = novo.area_id || Number(v.area_id); if (!areaId) return toast('Escolha a área.', 'err');
      const irmaos = novo.parent_id ? (S.filhosDe.get(novo.parent_id) || []) : (S.tarefasDe.get(areaId) || []);
      Object.assign(payload, { area_id: areaId, parent_id: novo.parent_id || null, ordem: irmaos.reduce((m, x) => Math.max(m, x.ordem), 0) + 1, origem: 'utilizador' });
      await gravar('atividades', 'insert', payload);
    }
    fecharTodos(); toast('Guardado.'); await recarregar();
  } catch (e) { toast(erroMsg(e), 'err'); }
}

/* Alteração rápida de estado (painel) */
async function estadoRapido(id, estado, sel) {
  const a = S.byId.get(id); if (!a) return;
  const payload = { estado };
  if (estado === 'concluida') {
    const r = await dialogo({ titulo: 'Concluir atividade', html: `<div class="form"><label class="full">${esc(nomeAtiv(a))}</label><label class="full">Concluída em<input type="date" id="dFim" value="${ds(S.hoje)}"></label></div>`, botoes: [{ txt: 'Cancelar', valor: null }, { txt: 'Concluir', cls: 'primary', valor: w => ({ i: a.data_inicio_efetiva, f: w.querySelector('#dFim').value }) }] });
    if (!r || !r.f) { sel.value = a.estado; return; }
    if (r.i && pd(r.f) < pd(r.i)) { sel.value = a.estado; return toast('A conclusão efetiva é anterior ao início efetivo.', 'err'); }
    Object.assign(payload, { data_fim_efetiva: r.f, data_inicio_efetiva: r.i || null, percentagem: 100 });
  } else if (false) {
    const r = await dialogo({ titulo: 'Iniciar atividade', html: `<div class="form"><label class="full">${esc(nomeAtiv(a))}</label><label>Início efetivo (opcional)<input type="date" id="dIni" value="${ds(S.hoje)}"></label></div>`, botoes: [{ txt: 'Cancelar', valor: null }, { txt: 'Guardar', cls: 'primary', valor: w => ({ i: w.querySelector('#dIni').value }) }] });
    if (!r) { sel.value = a.estado; return; }
    if (r.i) payload.data_inicio_efetiva = r.i;
  } else if (estado === 'bloqueada') {
    const r = await dialogo({ titulo: 'Bloquear atividade', html: `<div class="form"><label class="full">Motivo do bloqueio<input id="mot" value="${esc(a.motivo_bloqueio || '')}"></label></div>`, botoes: [{ txt: 'Cancelar', valor: null }, { txt: 'Guardar', cls: 'primary', valor: w => w.querySelector('#mot').value }] });
    if (r == null) { sel.value = a.estado; return; }
    payload.motivo_bloqueio = r;
  }
  try { await gravar('atividades', 'update', payload, { id }); toast('Estado atualizado.'); await recarregar(); }
  catch (e) { sel.value = a.estado; toast(erroMsg(e), 'err'); }
}
async function notaRapida(ent, id) {
  const r = await dialogo({ titulo: 'Nota de acompanhamento', html: `<div class="form"><label class="full">${ent === 'atividade' ? esc(nomeAtiv(S.byId.get(id))) : ent === 'area' ? esc((S.areaById.get(id) || {}).designacao) : 'Projeto'}<textarea id="txt" rows="4"></textarea></label></div>`, botoes: [{ txt: 'Cancelar', valor: null }, { txt: 'Guardar nota', cls: 'primary', valor: w => w.querySelector('#txt').value }] });

  try { await gravar('notas', 'insert', { entidade: ent, entidade_id: id || null, texto: r.trim(), autor_email: S.perfil.email }); toast('Nota guardada.'); await recarregar(); }

}

async function gravarArea(id) {
  const box = $('#modalRoot .box'); const v = lerForm(box); const ar = S.areaById.get(id);

function vMarcos() {
  const ms = S.marcos.slice().sort((a, b) => (pd(a.data_prevista) || 9e9) - (pd(b.data_prevista) || 9e9));

/* ===== 6. DEPENDÊNCIAS ===== */
function vDependencias() {
  const lista = S.deps.map(d => ({ d, av: avaliar(d), P: S.byId.get(d.predecessora_id), X: S.byId.get(d.sucessora_id) }));
  const ordem = { conflito: 0, risco: 1, por_avaliar: 2, ok: 3, inativa: 4 };

  <div class="muted small" style="margin-bottom:10px">Tipos: Fim→Início (a sucessora só começa depois de a predecessora terminar), Início→Início, Fim→Fim e Início→Fim; o desfasamento é expresso em ${unidade(metodo(), 2)} (negativo = antecipação). A aplicação nunca altera datas: assinala o conflito e sugere correções. Dependências circulares são recusadas.</div>
  ${lista.length ? lista.map(({ d, av, P, X }) => {
    const lbl = { ok: 'OK', conflito: 'Conflito', risco: 'Risco', por_avaliar: 'Por avaliar', inativa: 'Inativa' }[av.estado];
    const al = (av.estado !== 'ok' && av.estado !== 'inativa') ? alertaDep(d, P, X, av, ctxAlerta()) : null;
    return `<div class="card" style="margin-bottom:8px"><div class="bd"><div class="row" style="align-items:flex-start"><div class="grow" style="flex:1;min-width:0">
      <div><span class="tt" data-act="edit-ativ" data-id="${P.id}" style="cursor:pointer"><span class="code">${codigo(P)}</span> ${esc(P.designacao)}</span></div>
      <div class="small muted" style="margin:2px 0">↓ ${TIPOS_DEP[d.tipo]}${d.desfasamento ? ` (${d.desfasamento > 0 ? '+' : ''}${d.desfasamento} ${unidadeCurta(metodo())})` : ''}${P.area_id !== X.area_id ? ' · entre áreas ' + S.areaById.get(P.area_id).numero + ' → ' + S.areaById.get(X.area_id).numero : ''}</div>
      <div><span class="tt" data-act="edit-ativ" data-id="${X.id}" style="cursor:pointer"><span class="code">${codigo(X)}</span> ${esc(X.designacao)}</span></div>
      ${d.observacoes ? `<div class="small muted">${esc(d.observacoes)}</div>` : ''}
    </div>${pill(av.estado, lbl)}${podeEditar() ? `<button class="btn sm ghost" data-act="edit-dep" data-id="${d.id}">Editar</button>` : ''}</div>
    ${al ? `<div class="alert ${av.estado === 'conflito' ? '' : av.estado === 'risco' ? 'warn' : 'info'}" style="margin-bottom:0"><dl><dt>Atividade afetada</dt><dd>${esc(al.afetada)}</dd><dt>Predecessora</dt><dd>${esc(al.predecessora)}</dd><dt>Incompatibilidade</dt><dd>${esc(al.incompatibilidade)}</dd><dt>Consequência</dt><dd>${esc(al.consequencia)}</dd><dt>Correção possível</dt><dd>${esc(al.correcao)}</dd></dl></div>` : ''}
    </div></div>`;
  }).join('') : '<div class="card"><div class="bd empty">Ainda não foram definidas dependências. Use «Nova dependência» ou abra uma tarefa e acrescente predecessoras/sucessoras.</div></div>'}`;
}
function editarDep(id, pre) {
  const d = id ? S.deps.find(x => x.id === id) : Object.assign({ tipo: 'FS', desfasamento: 0 }, pre || {});
  datalistAtiv();
  const P = d.predecessora_id ? S.byId.get(d.predecessora_id) : null, X = d.sucessora_id ? S.byId.get(d.sucessora_id) : null;
  const corpo = `<form class="form" onsubmit="return false">
    <label class="full">Atividade predecessora<input list="dlAtiv" name="pred" value="${P ? esc(rotuloPicker(P)) : ''}" placeholder="Nº ou nome da atividade…"></label>
    <label>Tipo de dependência<select name="tipo">${Object.entries(TIPOS_DEP).map(([k, t]) => `<option value="${k}" ${d.tipo === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    <label>Desfasamento (${unidade(metodo(), 2)})<input type="number" name="desfasamento" step="1" value="${d.desfasamento || 0}"></label>
    <label class="full">Atividade sucessora<input list="dlAtiv" name="suc" value="${X ? esc(rotuloPicker(X)) : ''}" placeholder="Nº ou nome da atividade…"></label>

  </form>`;
  abrirModal({
    titulo: id ? 'Editar dependência' : 'Nova dependência', corpo, tamanho: '',
    rodape: `${id ? `<button class="btn danger" data-act="apagar-dep" data-id="${id}">Eliminar</button>` : ''}<span class="spacer"></span><button class="btn" data-act="fechar-modal">Cancelar</button><button class="btn primary" data-act="gravar-dep" data-id="${id || ''}">Gravar</button>`,
    onOpen: box => {
      const upd = () => {
        const v = lerForm(box); const pi = idDoPicker(v.pred), si = idDoPicker(v.suc);
        box.querySelector('[data-calc=descTipo]').textContent = 'Regra: ' + TIPOS_DEP_LONGO[v.tipo] + (Number(v.desfasamento) ? ` (desfasamento de ${v.desfasamento} ${unidade(metodo(), Math.abs(Number(v.desfasamento)))})` : '') + '.';
        const el = box.querySelector('[data-calc=prev]');
        if (!pi || !si) { el.innerHTML = ''; return; }
        if (criaCiclo(S.deps, pi, si, id || null)) { el.innerHTML = '<div class="alert">Esta dependência criaria um ciclo (a predecessora já depende, direta ou indiretamente, da sucessora). Não é permitida.</div>'; return; }
        const dd = { tipo: v.tipo, desfasamento: Number(v.desfasamento) || 0 }; const av = avaliarDep(dd, S.byId.get(pi), S.byId.get(si), metodo(), S.fer, S.hoje);

        else if (av.estado === 'inativa') el.innerHTML = '';
        else el.innerHTML = htmlAlerta({ al: alertaDep(dd, S.byId.get(pi), S.byId.get(si), av, ctxAlerta()), estado: av.estado === 'por_avaliar' ? 'risco' : av.estado }).replace(/Risco de dependência/, av.estado === 'por_avaliar' ? 'Por avaliar' : 'Risco de dependência');

async function gravarDep(id) {
  const box = $('#modalRoot .box'); const v = lerForm(box);
  const pi = idDoPicker(v.pred), si = idDoPicker(v.suc);
  if (!pi || !si) return toast('Escolha a predecessora e a sucessora a partir da lista.', 'err');
  if (pi === si) return toast('Uma atividade não pode depender de si própria.', 'err');
  const a = S.byId.get(pi), b = S.byId.get(si);
  if (a.parent_id === si || b.parent_id === pi) return toast('Não crie dependências entre uma tarefa e as suas próprias subtarefas: a hierarquia já as relaciona.', 'err');
  if (criaCiclo(S.deps, pi, si, id || null)) return toast('Dependência circular: não permitida.', 'err');
  const payload = { predecessora_id: pi, sucessora_id: si, tipo: v.tipo, desfasamento: parseInt(v.desfasamento || '0', 10) || 0, observacoes: v.observacoes };
  try {
    if (id) await gravar('dependencias', 'update', payload, { id }); else await gravar('dependencias', 'insert', payload);
    fecharTodos(); toast('Dependência guardada.'); await recarregar();
  } catch (e) { toast(erroMsg(e), 'err'); }
}
function verDep(id) {

function csv(tipo) {
  const linhas = [];
  const c = v => { if (v == null) return ''; const s = String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  if (tipo === 'atividades') {
    linhas.push(['Nº', 'Nível', 'Área', 'Designação', 'Responsável', 'Prioridade', 'Início inicial', 'Fim inicial', 'Início previsto', 'Fim previsto', 'Duração (' + unidadeCurta(metodo()) + ')', 'Início efetivo', 'Fim efetivo', 'Execução %', 'Estado', 'Situação', 'Peso', 'Observações']);
    for (const a of ordenarAtiv(S.ativ)) { const d = duracao(a.data_inicio_prevista, a.data_fim_prevista, metodo(), S.fer); linhas.push([codigo(a), a.nivel === 1 ? 'Tarefa' : 'Subtarefa', S.areaById.get(a.area_id).numero, a.designacao, nomeResp(a.responsavel_id), PRIORIDADES[a.prioridade], fd(a.data_inicio_inicial), fd(a.data_fim_inicial), fd(a.data_inicio_prevista), fd(a.data_fim_prevista), d == null || isNaN(d) ? '' : d, fd(a.data_inicio_efetiva), fd(a.data_fim_efetiva), Math.round(pctAt(a)), ESTADOS[a.estado], SITUACOES[sit(a)], a.peso, a.observacoes]); }
  } else if (tipo === 'areas') {
    linhas.push(['Nº', 'Área', 'Responsável', 'Unidade orgânica', 'Início previsto', 'Fim previsto', 'Início efetivo', 'Fim efetivo', 'Execução %', 'Estado']);
    for (const a of S.areas) linhas.push([a.numero, a.designacao, nomeResp(a.responsavel_id), a.unidade_organica, fd(a.data_inicio_prevista), fd(a.data_fim_prevista), fd(a.data_inicio_efetiva), fd(a.data_fim_efetiva), pctArea(a) == null ? '' : Math.round(pctArea(a)), ESTADOS[a.estado]]);
  } else if (tipo === 'dependencias') {
    linhas.push(['Predecessora', 'Tipo', 'Desfasamento', 'Sucessora', 'Situação']);
    for (const d of S.deps) linhas.push([nomeAtiv(S.byId.get(d.predecessora_id)), TIPOS_DEP[d.tipo], d.desfasamento, nomeAtiv(S.byId.get(d.sucessora_id)), avaliar(d).estado]);
  } else {
    linhas.push(['Marco', 'Área', 'Data inicial', 'Data prevista', 'Data efetiva', 'Responsável', 'Estado']);
    for (const m of S.marcos) linhas.push([m.designacao, m.area_id ? S.areaById.get(m.area_id).numero : '', fd(m.data_inicial), fd(m.data_prevista), fd(m.data_efetiva), nomeResp(m.responsavel_id), sitMarco(m)[1]]);
  }
  const blob = new Blob(['﻿' + linhas.map(l => l.map(c).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `ecsf_${tipo}_${ds(S.hoje)}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function aposSessao() {
  const { data } = await sb.auth.getSession(); S.sessao = data.session;
  if (!S.sessao) return ecraLogin();
  const { data: p, error } = await sb.from('perfis').select('*').eq('user_id', S.sessao.user.id).maybeSingle();
  if (error || !p) return ecraLogin('Não foi possível obter o seu perfil. ' + (error ? erroMsg(error) : ''));
  S.perfil = p;
  if (p.papel === 'pendente') {
    $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
    $('#login').innerHTML = `<div class="card"><h1>Acesso pendente</h1><p>A sua conta (${esc(p.email)}) foi criada, mas ainda não tem acesso. O coordenador do projeto tem de lhe atribuir um papel em Configurações → Utilizadores.</p><button class="btn" data-act="sair">Terminar sessão</button></div>`;
    return;
  }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#view').innerHTML = '<div class="muted">A carregar dados…</div>';
  try { await carregarTudo(); } catch (e) { $('#view').innerHTML = `<div class="alert">Erro ao carregar dados: ${esc(erroMsg(e))}</div>`; return; }
  const h = (location.hash || '').replace('#', '').split('/');
  if (h[0] && (VIEWS.some(v => v[0] === h[0]) || h[0] === 'area')) { S.view = h[0]; S.param = h[1] || null; }
  render();
  avisosAoAbrir();
}

function planFiltro(a) {
  const P = S.plan;
  if (P.q) { const t = (codigo(a) + ' ' + a.designacao).toLowerCase(); if (!t.includes(P.q.toLowerCase())) return false; }
  if (P.so === 'semdatas' && (a.estado === 'cancelada' || !semDatas(a))) return false;
  if (P.so === 'atrasadas' && !eAtrasada(a, S.hoje)) return false;
  if (P.so === 'semresp' && (eFechada(a) || a.responsavel_id)) return false;
  return true;
}
function celula(lbl, html) { return `<div><span class="lbl-m">${lbl}</span>${html}</div>`; }
function linhaPlan(tipo, o, extraNome) {
  const ro = !podeEditar(); const dis = ro ? 'disabled' : '';
  const k = `data-tipo="${tipo}" data-id="${o.id}"`;
  const sel = tipo === 'area' ? `<select data-pl="estado" ${k} ${dis}>${optsObj(ESTADOS, o.estado)}</select>` : `<select data-act-change="estado-rapido" data-id="${o.id}" ${dis}>${optsObj(ESTADOS, o.estado)}</select>`;
  return `${celula('Início previsto', `<input type="date" data-pl="data_inicio_prevista" ${k} value="${o.data_inicio_prevista || ''}" class="${o.data_inicio_prevista ? '' : 'vazio'}" ${dis}>`)}
    ${celula('Fim previsto', `<input type="date" data-pl="data_fim_prevista" ${k} value="${o.data_fim_prevista || ''}" class="${o.data_fim_prevista ? '' : 'vazio'}" ${dis}>`)}
    ${celula('Duração', `<div class="dur" data-dur="${tipo}-${o.id}">${o.data_inicio_prevista && o.data_fim_prevista ? durTxt(o.data_inicio_prevista, o.data_fim_prevista) : '—'}</div>`)}
    ${celula('Responsável', `<select data-pl="responsavel_id" ${k} ${dis}>${optsResp(o.responsavel_id, '—')}</select>`)}
    ${celula('Estado', sel)}
    <button class="ico" title="Mais detalhes" data-act="${tipo === 'area' ? 'edit-area' : 'edit-ativ'}" data-id="${o.id}">✎</button>`;
}
function vPlaneamento() {
  const P = S.plan; const filt = !!(P.q || P.so);
  let corpo = '';
  for (const ar of S.areas) {
    const tarefas = S.tarefasDe.get(ar.id) || [];
    const datadas = tarefas.filter(t => !semDatas(t)).length;
    let filhos = tarefas.map(t => { const subs = (S.filhosDe.get(t.id) || []); const subsOk = filt ? subs.filter(planFiltro) : subs; return { t, subs, subsOk, ok: !filt || planFiltro(t) || subsOk.length }; }).filter(x => x.ok);
    if (filt && !filhos.length) continue;
    const aberta = P.aberta.has(ar.id) || filt;
    corpo += `<div class="pl-r area"><div class="nm"><span class="car" data-act="pl-area" data-id="${ar.id}">${aberta ? '▼' : '▶'}</span><span class="lbl" data-act="pl-area" data-id="${ar.id}" style="cursor:pointer">${ar.numero}. ${esc(ar.designacao)}</span><span class="pl-mini nowrap">${datadas}/${tarefas.length} datadas</span></div>${linhaPlan('area', ar)}</div>`;
    if (!aberta) continue;
    for (const { t, subs, subsOk } of filhos) {
      const abertaT = P.abertaT.has(t.id) || (filt && subsOk.length && !planFiltro(t));
      corpo += `<div class="pl-r t"><div class="nm">${subs.length ? `<span class="car" data-act="pl-tarefa" data-id="${t.id}">${abertaT ? '▼' : '▶'}</span>` : '<span class="car"></span>'}<span class="code">${codigo(t)}</span><span class="lbl" title="${esc(t.designacao)}">${esc(t.designacao)}</span>${subs.length ? `<span class="pl-mini nowrap">${subs.length} sub.</span>` : ''}</div>${linhaPlan('ativ', t)}</div>`;
      if (abertaT) for (const s of (filt ? subsOk : subs)) corpo += `<div class="pl-r s"><div class="nm"><span class="car"></span><span class="code">${codigo(s)}</span><span class="lbl" title="${esc(s.designacao)}">${esc(s.designacao)}</span></div>${linhaPlan('ativ', s)}</div>`;
    }
    if (podeEditar()) corpo += `<div class="pl-add"><button class="btn sm ghost" data-act="nova-tarefa" data-area="${ar.id}">＋ Acrescentar tarefa à área ${ar.numero}</button> <button class="btn sm ghost" data-act="ir" data-v="area" data-p="${ar.id}">Ficha da área</button></div>`;
  }
  return `<div class="toolbar">
      <input type="search" placeholder="Pesquisar tarefa…" value="${esc(P.q)}" data-act-input="pl-q" style="flex:1;min-width:180px;max-width:320px">
      <select data-act-change="pl-so"><option value="">Mostrar tudo</option><option value="semdatas" ${P.so === 'semdatas' ? 'selected' : ''}>Só sem datas</option><option value="semresp" ${P.so === 'semresp' ? 'selected' : ''}>Só sem responsável</option><option value="atrasadas" ${P.so === 'atrasadas' ? 'selected' : ''}>Só atrasadas</option></select>
      <button class="btn sm" data-act="pl-abrir">Abrir todas</button><button class="btn sm" data-act="pl-fechar">Fechar todas</button>
    </div>
    <div class="small muted" style="margin-bottom:10px">Escreva as datas diretamente — as alterações são gravadas automaticamente. Clique numa área para ver as suas tarefas; use ✎ para observações, dependências e execução. Duração em ${metodo() === 'calendario' ? 'dias de calendário' : 'dias úteis'}.</div>
    <div class="pl"><div class="pl-h"><div>Área / tarefa</div><div>Início previsto</div><div>Fim previsto</div><div class="right">Duração</div><div>Responsável</div><div>Estado</div><div></div></div>
    ${corpo || '<div class="bd empty" style="padding:14px">Nada corresponde à pesquisa.</div>'}</div>`;
}

/* Gravação imediata de um campo */
async function gravarCampoPlan(el) {
  const tipo = el.dataset.tipo, id = Number(el.dataset.id), campo = el.dataset.pl;
  const lista = tipo === 'area' ? S.areas : S.ativ;
  const orig = lista.find(x => x.id === id); if (!orig) return;
  let val = el.value === '' ? null : el.value;
  if (campo === 'responsavel_id') val = val ? Number(val) : null;
  const repor = () => { el.value = orig[campo] == null ? '' : orig[campo]; };
  const cand = Object.assign({}, orig, { [campo]: val });
  if (cand.data_inicio_prevista && cand.data_fim_prevista && pd(cand.data_fim_prevista) < pd(cand.data_inicio_prevista)) {
    repor(); return toast('A data de fim não pode ser anterior à data de início.', 'err');
  }
  const payload = { [campo]: val };
  if (campo === 'estado' && val === 'concluida' && !orig.data_fim_efetiva) {
    const f = await dialogo({ titulo: 'Concluir área', html: `<div class="form"><label class="full">Data de conclusão efetiva<input type="date" id="dF" value="${ds(S.hoje)}"></label></div>`, botoes: [{ txt: 'Cancelar', valor: null }, { txt: 'Concluir', cls: 'primary', valor: w => w.querySelector('#dF').value }] });
    if (!f) return repor(); payload.data_fim_efetiva = f;
  }
  if ((campo === 'data_inicio_prevista' || campo === 'data_fim_prevista') && orig[campo] && orig[campo] !== val) {
    const m = await dialogo({ titulo: 'Motivo da alteração', html: `<p class="small">Está a alterar uma data já planeada (${fd(orig[campo])} → ${val ? fd(val) : 'sem data'}). O planeamento inicial mantém-se e a alteração fica no histórico.</p><div class="form"><label class="full">Motivo<input id="mot" placeholder="Ex.: atraso na aprovação"></label></div>`, botoes: [{ txt: 'Cancelar', valor: null }, { txt: 'Gravar', cls: 'primary', valor: w => w.querySelector('#mot').value.trim() || undefined, manter: true }] });
    if (!m) return repor(); payload.motivo_alteracao = m;
  }
  if (tipo === 'ativ' && campo.startsWith('data_')) {
    const imp = analisarImpactos(orig, cand);
    if (imp.deps.some(x => x.novo) || imp.lim.length) {
      const ok = await dialogo({ titulo: 'Atenção: impacto da alteração', html: `<p class="small">Nenhuma outra atividade é alterada automaticamente. Decida se mantém esta data.</p>${imp.lim.length ? `<div class="alert warn small"><b>Fora dos limites:</b> ${imp.lim.map(esc).join('; ')}.</div>` : ''}${imp.deps.map(htmlAlerta).join('')}`, botoes: [{ txt: 'Cancelar', valor: false }, { txt: 'Gravar mesmo assim', cls: 'primary', valor: true }] });
      if (!ok) return repor();
    }
  }
  try {
    const r = await gravar(tipo === 'area' ? 'areas' : 'atividades', 'update', payload, { id });
    const novo = r[0]; const i = lista.findIndex(x => x.id === id); lista[i] = novo; indexar();
    el.classList.toggle('vazio', !el.value);
    const d = document.querySelector(`[data-dur="${tipo}-${id}"]`); if (d) d.textContent = novo.data_inicio_prevista && novo.data_fim_prevista ? durTxt(novo.data_inicio_prevista, novo.data_fim_prevista) : '—';
    toast('Gravado.');
  } catch (e) { repor(); toast(erroMsg(e), 'err'); }
}

const _carregados = {};

/* ---------- Cronograma em SVG (ecrã, documento e PDF) ---------- */
function ganttSVG(rows, o) {
  const W = o.largura || 900, LW = o.labelW || 280, RH = o.rowH || 16, HH = 24, fs = o.fonte || Math.max(8, Math.min(11, RH * 0.62));
  const t0 = o.t0, t1 = o.t1, span = t1 - t0 + 1, gx = LW, gw = W - LW - 4;
  const X = n => gx + (n - t0) / span * gw; const H = HH + rows.length * RH + 2;
  const e = s => esc(s);
  const out = [`<svg class="gsvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Roboto">`, `<rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>`];
  out.push(`<rect x="0" y="0" width="${W}" height="${HH}" fill="#1f6aa5"/>`, `<text x="6" y="${HH - 8}" font-size="${fs}" font-weight="bold" fill="#ffffff">${e(o.titulo || 'Área / tarefa')}</text>`);
  // meses
  const meses = Math.round(span / 30.4); const passo = meses > 30 ? 3 : 1;
  let d = new Date(t0 * DIA_MS), yy = d.getUTCFullYear(), mm = d.getUTCMonth(); const linhasV = [];
  while (true) {
    const n = Math.round(Date.UTC(yy, mm, 1) / DIA_MS); if (n > t1) break;
    const nx = Math.round(Date.UTC(yy, mm + passo, 1) / DIA_MS); const x0 = X(Math.max(n, t0)), x1 = X(Math.min(nx, t1 + 1));
    linhasV.push([X(Math.max(n, t0)), mm === 0]);
    const lbl = passo === 1 ? MESES[mm] + (mm === 0 || n <= t0 ? ' ' + String(yy).slice(2) : '') : 'T' + (Math.floor(mm / 3) + 1) + ' ' + String(yy).slice(2);
    if (x1 - x0 > lbl.length * fs * 0.5) out.push(`<text x="${((x0 + x1) / 2).toFixed(1)}" y="${HH - 8}" font-size="${fs * 0.92}" fill="#ffffff" text-anchor="middle"${mm === 0 ? ' font-weight="bold"' : ''}>${lbl}</text>`);
    mm += passo; if (mm >= 12) { mm -= 12; yy++; }
  }
  // linhas
  rows.forEach((r, k) => {
    const y = HH + k * RH;
    if (r.area) out.push(`<rect x="0" y="${y}" width="${W}" height="${RH}" fill="#e9f3fc"/>`); else if (k % 2) out.push(`<rect x="0" y="${y}" width="${W}" height="${RH}" fill="#f6f9fc"/>`);
    const ind = r.area ? 5 : r.nivel === 2 ? 22 : 12; const maxC = Math.floor((LW - ind - 6) / (fs * 0.5));
    let t = r.label; if (t.length > maxC) t = t.slice(0, maxC - 1).trimEnd() + '…';
    out.push(`<text x="${ind}" y="${(y + RH / 2 + fs * 0.35).toFixed(1)}" font-size="${r.area ? fs : fs * 0.95}" fill="${r.nivel === 2 ? '#5b6863' : '#1d2320'}"${r.area ? ' font-weight="bold"' : ''}>${e(t)}</text>`);
  });
  for (const [x, ano] of linhasV) out.push(`<line x1="${x.toFixed(1)}" y1="${HH}" x2="${x.toFixed(1)}" y2="${H}" stroke="${ano ? '#a7bfd4' : '#e2eaf2'}" stroke-width="${ano ? 0.9 : 0.5}"/>`);
  out.push(`<line x1="${gx}" y1="0" x2="${gx}" y2="${H}" stroke="#c8d8e8" stroke-width="0.8"/>`);
  rows.forEach((r, k) => {
    const y = HH + k * RH; const i = pd(r.ini), f = pd(r.fim);
    if (i != null && f != null) {
      const bh = r.area ? RH * 0.42 : RH * 0.56, by = y + (RH - bh) / 2;
      const i0 = pd(r.ini0), f0 = pd(r.fim0);
      if (i0 != null && f0 != null && (i0 !== i || f0 !== f)) out.push(`<rect x="${X(i0).toFixed(1)}" y="${(y + RH - 2.2).toFixed(1)}" width="${Math.max(1, X(f0 + 1) - X(i0)).toFixed(1)}" height="1.4" fill="#94a3b8"/>`);
      const x0 = X(Math.max(i, t0)), w = Math.max(1.5, X(Math.min(f, t1) + 1) - x0);
      const cor = r.cor || (r.area ? '#5b8ab4' : '#2b7cc0');
      const base = r.bloq ? '#e6b9d6' : r.concl && !r.area ? '#9fd3b4' : misturar(cor, '#ffffff', r.area ? 0.35 : 0.58);
      const cheio = r.concl && !r.area ? '#2e7d4f' : r.area ? misturar(cor, '#000000', 0.2) : cor;
      out.push(`<rect x="${x0.toFixed(1)}" y="${by.toFixed(1)}" width="${w.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${base}"${r.atras ? ' stroke="#c8402f" stroke-width="1.3"' : ''}/>`);
      if (r.pct > 0) out.push(`<rect x="${x0.toFixed(1)}" y="${by.toFixed(1)}" width="${(w * Math.min(100, r.pct) / 100).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${cheio}"/>`);
    } else out.push(`<text x="${gx + 4}" y="${(y + RH / 2 + fs * 0.3).toFixed(1)}" font-size="${fs * 0.8}" fill="#9aa6a0" font-style="italic">por planear</text>`);
    for (const m of (r.marcos || [])) { const n = pd(m.data_efetiva || m.data_prevista); if (n == null || n < t0 || n > t1) continue; const cx = X(n), cy = y + RH / 2, s = Math.min(5, RH * 0.32); const done = m.estado === 'concluido' || m.data_efetiva; const late = marcoAtrasado(m); out.push(`<polygon points="${cx},${cy - s} ${cx + s},${cy} ${cx},${cy + s} ${cx - s},${cy}" fill="${done ? '#2e7d4f' : late ? '#c8402f' : '#ffffff'}" stroke="${done ? '#2e7d4f' : late ? '#c8402f' : '#b26a00'}" stroke-width="1"/>`); }
  });
  if (S.hoje >= t0 && S.hoje <= t1) out.push(`<line x1="${X(S.hoje).toFixed(1)}" y1="${HH}" x2="${X(S.hoje).toFixed(1)}" y2="${H}" stroke="#c8402f" stroke-width="1.2"/>`);
  out.push('</svg>');
  return out.join('');
}

/* ===== RELATÓRIO DE INDICADORES (1 página) ===== */
function dadosIndicadores() {
  const h = S.hoje; const ativas = S.ativ.filter(a => a.estado !== 'cancelada');
  const t = ativas.filter(a => a.nivel === 1), s = ativas.filter(a => a.nivel === 2);
  const concl = ativas.filter(a => a.estado === 'concluida');
  const comp = concl.filter(a => a.data_fim_efetiva && a.data_fim_prevista);
  const noPrazo = comp.filter(a => pd(a.data_fim_efetiva) <= pd(a.data_fim_prevista)).length;
  const porRealizar = ativas.filter(a => a.estado !== 'concluida');
  const I = indicadores(dadosInd(), h);
  return {
    I, nT: t.length, nS: s.length, nTot: ativas.length,
    tConcl: t.filter(a => a.estado === 'concluida').length, sConcl: s.filter(a => a.estado === 'concluida').length,
    nConcl: concl.length, nPorRealizar: porRealizar.length,
    nEmCurso: porRealizar.filter(a => a.estado === 'em_curso' || a.data_inicio_efetiva).length,
    nAtras: ativas.filter(a => eAtrasada(a, h)).length, nBloq: ativas.filter(a => a.estado === 'bloqueada').length,
    nSemDatas: porRealizar.filter(semDatas).length,
    nPrazoComp: comp.length, nNoPrazo: noPrazo, nForaPrazo: comp.length - noPrazo,
    taxaConclusao: ativas.length ? concl.length / ativas.length * 100 : null,
    taxaPrazo: comp.length ? noPrazo / comp.length * 100 : null,
    areasConcl: S.areas.filter(a => a.estado === 'concluida').length,
    porSit: ['concluida', 'concluida_atraso', 'em_curso', 'planeada', 'inicio_atrasado', 'atrasada', 'bloqueada', 'nao_planeada'].map(k => [k, ativas.filter(a => { const x = sit(a); return k === 'em_curso' ? (x === 'em_curso' || x === 'em_curso_np') : x === k; }).length])
  };
}
async function criarPdfIndicadores() {

  const grelha = linhas => ({ table: { widths: ['*', '*', '*', '*'], body: linhas }, layout: { hLineWidth: () => 3, vLineWidth: () => 3, hLineColor: () => '#ffffff', vLineColor: () => '#ffffff', paddingLeft: () => 0, paddingRight: () => 0, paddingTop: () => 0, paddingBottom: () => 0 }, margin: [-3, 0, -3, 8] });

  // barra de distribuição

  // execução por área (duas colunas)

  const meio = Math.ceil(S.areas.length / 2);
  const tabArea = lista => ({ table: { widths: [10, '*', 62, 22], body: lista.map(linhaArea) }, layout: { hLineWidth: () => 0, vLineWidth: () => 0, paddingTop: () => 1.2, paddingBottom: () => 1.2, paddingLeft: () => 1, paddingRight: () => 2 } });
  const conteudo = [
    { columns: [{ stack: [{ text: 'Relatório de indicadores', fontSize: 18, bold: true, color: AZ }, { text: projeto, fontSize: 10.5, color: CORP.texto }] }, { stack: [{ text: ent ? ent.nome : '', fontSize: 8.5, color: CORP.suave, alignment: 'right' }, { text: `Data de referência: ${fd(ds(S.hoje))}`, fontSize: 8.5, alignment: 'right', bold: true }, { text: S.cfg.data_inicio ? `Período do projeto: ${fd(S.cfg.data_inicio)} a ${fd(S.cfg.data_fim)}` : 'Período do projeto por definir', fontSize: 8, color: CORP.suave, alignment: 'right' }], width: 'auto' }] },
    { canvas: [{ type: 'line', x1: 0, y1: 4, x2: 483, y2: 4, lineWidth: 1, lineColor: AZ }], margin: [0, 0, 0, 8] },
    tit('Âmbito'),
    grelha([[tile(S.areas.length, 'Áreas de trabalho', `${I.nAreasPlaneadas} com datas · ${D.areasConcl} concluídas`), tile(D.nT, 'Tarefas', `${D.tConcl} realizadas`), tile(D.nS, 'Subtarefas', `${D.sConcl} realizadas`), tile(D.nTot, 'Total de atividades', 'tarefas + subtarefas')]]),
    tit('Execução'),
    grelha([[tile(D.nConcl, 'Realizadas', `${pctTxt(D.taxaConclusao)} do total`, '#2e7d4f'), tile(D.nPorRealizar, 'Por realizar', `${D.nEmCurso} em curso · ${D.nSemDatas} sem datas`), tile(D.nAtras, 'Atrasadas', `${D.nBloq} bloqueadas`, D.nAtras ? '#c8402f' : AZ), tile(pctTxt(I.execucaoGlobal), 'Taxa de execução', 'média ponderada das tarefas')]]),

    tit('Distribuição das atividades por situação'),
    { canvas: canv.length ? canv : [{ type: 'rect', x: 0, y: 0, w: L, h: 14, color: '#e2eaf2' }], margin: [0, 0, 0, 5] },
    { columns: [{ stack: legenda.slice(0, Math.ceil(legenda.length / 2)) }, { stack: legenda.slice(Math.ceil(legenda.length / 2)) }], margin: [0, 0, 0, 4] },
    tit('Execução por área'),
    { columns: [tabArea(S.areas.slice(0, meio)), tabArea(S.areas.slice(meio))], columnGap: 14 },
    { text: [{ text: 'Notas: ', bold: true }, `Atividades = tarefas e subtarefas não canceladas. Realizadas = estado «Concluída». Dentro do prazo = concluída até à data de fim prevista. Taxa de execução = média das percentagens das tarefas, ponderada por ${S.cfg.metodo_ponderacao === 'duracao' ? 'duração prevista' : 'peso da tarefa × peso da área'}. Cor da barra de cada área = situação (verde, amarelo, vermelho).`], fontSize: 6.8, color: CORP.suave, margin: [0, 8, 0, 0] }
  ];
  const def = { pageSize: 'A4', pageMargins: [56, 40, 56, 40], info: { title: `Relatório de indicadores — ${projeto}` }, content: conteudo, defaultStyle: { font: 'Roboto', fontSize: 9, color: CORP.texto },
    footer: () => ({ margin: [56, 10, 56, 0], columns: [{ text: ent ? ent.nome : projeto, fontSize: 7.5, color: CORP.suave }, { text: `Gerado em ${new Date().toLocaleString('pt-PT')}`, fontSize: 7.5, color: CORP.suave, alignment: 'right' }] }) };
  const blob = await new Promise((ok, falha) => { try { pdfMake.createPdf(def).getBlob(ok); } catch (e) { falha(e); } });
  descarregarBlob(blob, `Relatorio de indicadores - ${ds(S.hoje)}.pdf`);
