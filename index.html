<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ECSF Planeamento">
<meta name="theme-color" content="#14263d">
<title>ECSF · Planeamento</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface2:#f8f9fb;--line:#e3e6eb;--line2:#d2d7de;
  --ink:#1b2430;--ink2:#4a5568;--ink3:#7a8494;
  --accent:#1f5fa8;--accent-ink:#fff;--accent-soft:#e7f0fa;
  --ok:#2e7d4f;--ok-soft:#e5f3eb;--warn:#b26a00;--warn-soft:#fdf1dd;--bad:#c0392b;--bad-soft:#fbe9e7;--info:#5b4fb5;--info-soft:#eeebfa;--mute:#8a94a3;--mute-soft:#eef0f3;
  --radius:10px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --side:232px;--row:30px;
  font-synthesis:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:20px}h2{font-size:16px}h3{font-size:14px}
.muted{color:var(--ink3)}.small{font-size:12px}.nowrap{white-space:nowrap}.right{text-align:right}.center{text-align:center}
.hidden{display:none!important}

/* Layout */
#app{display:flex;min-height:100svh}
#side{width:var(--side);background:#14263d;color:#d6dfeb;flex:0 0 var(--side);display:flex;flex-direction:column;position:sticky;top:0;height:100svh}
#side .brand{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
#side .brand b{display:block;color:#fff;font-size:15px}
#side .brand span{font-size:12px;color:#9fb0c6}
#nav{flex:1;overflow:auto;padding:8px}
#nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 10px;border-radius:8px;cursor:pointer}
#nav button:hover{background:rgba(255,255,255,.06)}
#nav button.on{background:#24446b;color:#fff}
#nav .n{width:20px;height:20px;border-radius:5px;background:rgba(255,255,255,.08);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
#side .user{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
#side .user button{background:none;border:1px solid rgba(255,255,255,.2);color:#d6dfeb;border-radius:6px;padding:4px 8px;margin-top:6px;cursor:pointer}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
#top .t{flex:1;min-width:0}
#top .t small{display:block;color:var(--ink3);font-size:12px}
#menuBtn{display:none}
#view{padding:20px 22px 60px;min-width:0}
@media (max-width:900px){
  #side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s}
  #side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  #menuBtn{display:inline-flex}
  #top{padding:10px 16px}
  #view{padding:16px 16px 70px}
  #scrim.on{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:55}
}

/* Componentes */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:#efc2bc}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 8px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card>.hd h2,.card>.hd h3{flex:1}
.card>.bd{padding:12px 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;cursor:default}
.kpi[data-go]{cursor:pointer}.kpi[data-go]:hover{border-color:var(--accent)}
.kpi b{display:block;font-size:22px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--mute-soft);color:var(--ink2)}
.s-concluida,.s-ok{background:var(--ok-soft);color:var(--ok)}
.s-concluida_atraso{background:#eaf3e0;color:#5a7a1e}
.s-em_curso,.s-em_curso_np{background:var(--accent-soft);color:var(--accent)}
.s-atrasada,.s-conflito,.s-bad{background:var(--bad-soft);color:var(--bad)}
.s-inicio_atrasado,.s-risco,.s-warn,.s-em_risco{background:var(--warn-soft);color:var(--warn)}
.s-bloqueada{background:#f6e3f0;color:#9b2c7a}
.s-nao_planeada,.s-por_avaliar{background:var(--info-soft);color:var(--info)}
.s-planeada,.s-previsto{background:var(--mute-soft);color:var(--ink2)}
.s-cancelada,.s-cancelado,.s-inativa,.s-suspensa{background:var(--mute-soft);color:var(--mute);text-decoration:none}
.s-concluido{background:var(--ok-soft);color:var(--ok)}
.p-critica{color:var(--bad);font-weight:700}.p-alta{color:var(--warn);font-weight:600}
.bar{height:6px;background:var(--mute-soft);border-radius:4px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:6px 8px;align-items:flex-start;flex-wrap:wrap}
.list li>.grow{min-width:200px}
.list li>.acts{margin-left:auto}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .tt{cursor:pointer}.list .tt:hover{color:var(--accent)}
.code{font-variant-numeric:tabular-nums;color:var(--ink3);font-size:12px;white-space:nowrap}
.empty{color:var(--ink3);font-size:13px;padding:6px 0}
table.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--ink2);font-weight:600;background:var(--surface2);position:sticky;top:0;z-index:1}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:#f7faff}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.lvl2 td:nth-child(2){padding-left:26px}
.tblwrap{overflow:auto;max-width:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line2);border-radius:8px;padding:6px 8px;background:var(--surface);max-width:100%}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{flex:0 0 auto;border:0;background:none;padding:6px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.alert{border-left:3px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;margin:8px 0}
.alert.warn{border-color:var(--warn);background:var(--warn-soft)}
.alert.info{border-color:var(--info);background:var(--info-soft)}
.alert dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 10px;margin:6px 0 0}
.alert dt{font-weight:600;font-size:12px;color:var(--ink2)}
.alert dd{margin:0;font-size:13px}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink2)}

/* Formulários */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);font-weight:600}
.form input,.form select,.form textarea{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:var(--surface);font-weight:400;font-size:14px;width:100%;min-width:0}
.form textarea{min-height:64px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.form .calc{padding:8px 10px;background:var(--surface2);border:1px dashed var(--line2);border-radius:8px;font-weight:400;font-size:14px;color:var(--ink)}
.form .sec{grid-column:1/-1;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:6px}
.form .err{color:var(--bad);font-size:12px;font-weight:600}
.form .chk{flex-direction:row;align-items:center;gap:8px}
.form .chk input{width:auto}
@media (max-width:640px){.form{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px}
.chip button{border:0;background:rgba(0,0,0,.06);border-radius:999px;width:18px;height:18px;cursor:pointer;line-height:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink2);white-space:nowrap}
.tabs button.on{border-color:var(--accent);color:var(--accent);font-weight:600}

/* Modal */
#modalRoot{position:fixed;inset:0;z-index:100;display:none}
#modalRoot.on{display:block}
#modalRoot .scrim{position:absolute;inset:0;background:rgba(15,23,42,.45)}
#modalRoot .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 24px));max-height:92dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#modalRoot .box.sm{width:min(460px,calc(100vw - 24px))}
#modalRoot .mh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
#modalRoot .mh h2{flex:1}
#modalRoot .mb{padding:14px 16px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#modalRoot .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
@media (max-width:640px){#modalRoot .box{top:auto;bottom:0;transform:translateX(-50%);border-radius:14px 14px 0 0;max-height:92dvh;width:100vw}}
body.locked{overflow:hidden;position:fixed;width:100%}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#1b2430;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:90vw}
#toast div.err{background:var(--bad)}

/* Login */
#login{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,#14263d,#24446b)}
#login .card{width:min(400px,100%);padding:24px}
#login h1{margin-bottom:4px}
#login .form{grid-template-columns:1fr;margin-top:16px}

/* Gantt */
.gwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.gscroll{overflow:auto;max-height:calc(100svh - 230px);position:relative;-webkit-overflow-scrolling:touch}
.gtable{display:grid;grid-template-columns:var(--gl,330px) auto;position:relative}
.ghl,.ghr{position:sticky;top:0;z-index:6;background:var(--surface2);border-bottom:1px solid var(--line2);height:46px}
.ghl{left:0;z-index:8;border-right:1px solid var(--line2);display:flex;align-items:flex-end;padding:0 10px 6px;font-size:12px;color:var(--ink2);font-weight:600}
.ghr{position:sticky}
.ghr .tk{position:absolute;font-size:11px;color:var(--ink2);border-left:1px solid var(--line);padding-left:4px;white-space:nowrap;overflow:hidden}
.ghr .tk.t1{top:0;height:23px;line-height:23px;font-weight:600}
.ghr .tk.t2{top:23px;height:23px;line-height:23px;border-top:1px solid var(--line)}
.ghr .tk.we{background:rgba(0,0,0,.03)}
.gl{position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--line2)}
.gl .r{height:var(--row);display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid #f0f2f5;cursor:pointer;white-space:nowrap;overflow:hidden}
.gl .r:hover{background:#f7faff}
.gl .r.area{background:#f6f8fb;font-weight:600}
.gl .r.lv1{padding-left:22px}.gl .r.lv2{padding-left:40px;color:var(--ink2)}
.gl .r.marcos{background:#fffaf0;font-weight:600}
.gl .r .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.gl .r .meta{font-size:11px;color:var(--ink3);font-weight:400}
.gl .car{width:16px;flex:0 0 16px;text-align:center;color:var(--ink3);font-size:10px}
.gr{position:relative}
.gr .r{height:var(--row);border-bottom:1px solid #f0f2f5;position:relative}
.gr .r.area{background:rgba(246,248,251,.6)}
.gr .r.marcos{background:#fffaf0}
.gbg{position:absolute;top:0;bottom:0;pointer-events:none}
.gbg.we{background:rgba(0,0,0,.025)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:#e74c3c;opacity:.6;pointer-events:none;z-index:2}
.gproj{position:absolute;top:0;bottom:0;border-left:2px dashed #94a3b8;pointer-events:none;z-index:1}
.gb{position:absolute;top:7px;height:16px;border-radius:4px;background:#9db7d8;cursor:pointer;overflow:hidden;z-index:3;min-width:3px}
.gb>i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.85}
.gb.area{top:9px;height:12px;background:#4c6a91}
.gb.area>i{background:#14263d}
.gb.span{background:repeating-linear-gradient(45deg,#cfd8e3,#cfd8e3 4px,#e6ebf1 4px,#e6ebf1 8px);border:1px dashed #94a3b8}
.gb.st-concluida,.gb.st-concluida_atraso{background:#9fd3b4}.gb.st-concluida>i,.gb.st-concluida_atraso>i{background:var(--ok)}
.gb.st-atrasada{box-shadow:0 0 0 2px var(--bad)}
.gb.st-inicio_atrasado{box-shadow:0 0 0 2px var(--warn)}
.gb.st-bloqueada{background:repeating-linear-gradient(45deg,#e6b9d6,#e6b9d6 4px,#f3dceb 4px,#f3dceb 8px)}
.gb.st-cancelada{opacity:.35}
.gbase{position:absolute;top:25px;height:3px;background:#94a3b8;border-radius:2px;z-index:2;pointer-events:none}
.gef{position:absolute;top:2px;height:4px;background:#14263d;border-radius:2px;z-index:3;pointer-events:none}
.gnp{position:absolute;top:7px;font-size:11px;color:#a6a0d6;font-style:italic;white-space:nowrap;pointer-events:none}
.gm{position:absolute;top:8px;width:13px;height:13px;transform:rotate(45deg);border:2px solid #b26a00;background:#fff;z-index:4;cursor:pointer;margin-left:-6px}
.gm.done{background:var(--ok);border-color:var(--ok)}
.gm.late{border-color:var(--bad);background:var(--bad)}
.glbl{position:absolute;top:7px;font-size:11px;color:var(--ink2);white-space:nowrap;pointer-events:none;z-index:3}
svg.garrows{position:absolute;left:0;top:0;pointer-events:none;z-index:5;overflow:visible}
.glegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);padding:8px 12px;border-top:1px solid var(--line)}
.glegend i{display:inline-block;width:18px;height:8px;border-radius:2px;vertical-align:middle;margin-right:4px}
@media (max-width:700px){.gtable{--gl:170px!important}.gl .r .meta{display:none}}
@media print{#side,#top,.noprint,.filters{display:none!important}#view{padding:0}.card{box-shadow:none}.gscroll{max-height:none;overflow:visible}}

.navsep{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7f93ad;padding:14px 10px 4px}
/* Primeiros passos */
.passos{display:grid;gap:10px}
.passo{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.passo .num{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--mute-soft);color:var(--ink2)}
.passo.feito .num{background:var(--ok);color:#fff}
.passo.atual{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.passo.atual .num{background:var(--accent);color:#fff}
.passo .txt{flex:1;min-width:0}
.passo .txt b{display:block}
.passo .txt span{font-size:13px;color:var(--ink2)}
.hero{background:linear-gradient(135deg,#14263d,#24446b);color:#fff;border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.hero h2{font-size:18px;margin-bottom:4px}.hero p{margin:0;color:#c9d6e6;font-size:13px}
/* Planeamento (edição direta) */
.pl{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.pl-h,.pl-r{display:grid;grid-template-columns:minmax(0,1fr) 138px 138px 74px 170px 128px 34px;gap:8px;align-items:center;padding:6px 10px}
.pl-h{background:var(--surface2);font-size:12px;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line2)}
.pl-r{border-bottom:1px solid #eef0f3}
.pl-r.area{background:#f3f6fa;font-weight:600;border-top:1px solid var(--line2)}
.pl-r.t{padding-left:30px}.pl-r.s{padding-left:52px;background:#fcfcfd}
.pl-r .nm{display:flex;align-items:center;gap:6px;min-width:0}
.pl-r .nm .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-r input,.pl-r select{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;font-size:13px;min-width:0}
.pl-r input:hover,.pl-r select:hover{border-color:var(--line2);background:#fff}
.pl-r input:focus,.pl-r select:focus{border-color:var(--accent);background:#fff;outline:2px solid var(--accent-soft)}
.pl-r input[type=date]:invalid,.pl-r input.vazio{color:var(--ink3)}
.pl-r .dur{font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.pl-r .car{cursor:pointer;width:18px;flex:0 0 18px;text-align:center;color:var(--ink3);font-size:11px}
.pl-r .ico{border:0;background:none;cursor:pointer;color:var(--ink3);font-size:15px;padding:4px}
.pl-r .ico:hover{color:var(--accent)}
.pl-r.erro{background:var(--bad-soft)}
.pl-add{padding:6px 10px 10px 52px}
.pl-mini{font-size:11px;color:var(--ink3);font-weight:400}
.pl .lbl-m{display:none}
@media (max-width:900px){
  .pl-h{display:none}
  .pl-r{grid-template-columns:1fr 1fr;padding:10px 12px;gap:6px 8px}
  .pl-r.t,.pl-r.s{padding-left:12px}
  .pl-r.s{border-left:3px solid var(--line2)}
  .pl-r .nm{grid-column:1/-1}
  .pl-r .dur{text-align:left}
  .pl .lbl-m{display:block;font-size:10px;color:var(--ink3);font-weight:600;text-transform:uppercase}
  .pl-r input,.pl-r select{border-color:var(--line2);background:#fff}
  .pl-r .ico{justify-self:end}
}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

<script id="core-js">
/* ===== Núcleo de cálculo (sem DOM) — testável em node ===== */
const ESTADOS = { nao_iniciada: 'Não iniciada', em_curso: 'Em curso', concluida: 'Concluída', bloqueada: 'Bloqueada', suspensa: 'Suspensa', cancelada: 'Cancelada' };
const ESTADOS_MARCO = { previsto: 'Previsto', em_risco: 'Em risco', concluido: 'Concluído', cancelado: 'Cancelado' };
const PRIORIDADES = { baixa: 'Baixa', media: 'Média', alta: 'Alta', critica: 'Crítica' };
const TIPOS_DEP = { FS: 'Fim → Início', SS: 'Início → Início', FF: 'Fim → Fim', SF: 'Início → Fim' };
const TIPOS_DEP_LONGO = {
  FS: 'a sucessora só pode começar depois de a predecessora terminar',
  SS: 'a sucessora só pode começar depois de a predecessora começar',
  FF: 'a sucessora só pode terminar depois de a predecessora terminar',
  SF: 'a sucessora só pode terminar depois de a predecessora começar'
};
const DIA_MS = 86400000;

/* Datas como número de dia (UTC) para evitar problemas de fuso/horário de verão */
function pd(s) { if (!s) return null; const p = String(s).slice(0, 10).split('-').map(Number); if (p.length < 3 || p.some(isNaN)) return null; return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / DIA_MS); }
function ds(n) { if (n == null || isNaN(n)) return null; return new Date(n * DIA_MS).toISOString().slice(0, 10); }
function fd(s) { if (!s) return '—'; const p = String(s).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function fdn(n) { return n == null ? '—' : fd(ds(n)); }
function hojeN(ref) { const t = ref || new Date(); return Math.round(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / DIA_MS); }
function diaSemana(n) { return new Date(n * DIA_MS).getUTCDay(); }
function eUtil(n, fer) { const w = diaSemana(n); return w !== 0 && w !== 6 && !(fer && fer.has(n)); }
function unidade(metodo, n) { const u = metodo === 'calendario'; if (n === 1) return u ? 'dia' : 'dia útil'; return u ? 'dias' : 'dias úteis'; }
function unidadeCurta(metodo) { return metodo === 'calendario' ? 'd' : 'd.ú.'; }

/* Duração inclusiva (início e fim contam). null se faltar uma data; NaN se fim < início */
function duracao(ini, fim, metodo, fer) {
  const a = pd(ini), b = pd(fim);
  if (a == null || b == null) return null;
  if (b < a) return NaN;
  if (metodo === 'calendario') return b - a + 1;
  let c = 0; for (let n = a; n <= b; n++) if (eUtil(n, fer)) c++;
  return c;
}

/* Desloca k unidades (dias de calendário ou dias úteis) a partir do dia n */
function somarDias(n, k, metodo, fer) {
  if (!k) return n;
  if (metodo === 'calendario') return n + k;
  const passo = k > 0 ? 1 : -1; let falta = Math.abs(k), x = n, guard = 0;
  while (falta > 0 && guard++ < 20000) { x += passo; if (eUtil(x, fer)) falta--; }
  return x;
}

/* ===== Dependências ===== */
/* Regras (L = desfasamento, na unidade configurada):
   FS: início(S) > fim(P) + L       SS: início(S) ≥ início(P) + L
   FF: fim(S)   ≥ fim(P) + L        SF: fim(S)    ≥ início(P) + L        */
function regraDep(tipo) {
  return {
    FS: { campoP: 'fim', campoS: 'inicio' }, SS: { campoP: 'inicio', campoS: 'inicio' },
    FF: { campoP: 'fim', campoS: 'fim' }, SF: { campoP: 'inicio', campoS: 'fim' }
  }[tipo];
}
function dataPrev(a, campo) { return pd(campo === 'inicio' ? a.data_inicio_prevista : a.data_fim_prevista); }
function dataEf(a, campo) { return pd(campo === 'inicio' ? a.data_inicio_efetiva : a.data_fim_efetiva); }

function limitesDep(tipo, L, pVal, sVal, metodo, fer) {
  // sMin: primeiro dia admissível para a sucessora; pMax: último dia admissível para a predecessora
  L = L || 0;
  if (tipo === 'FS') return {
    sMin: pVal == null ? null : somarDias(somarDias(pVal, L, metodo, fer), 1, metodo, fer),
    pMax: sVal == null ? null : somarDias(somarDias(sVal, -1, metodo, fer), -L, metodo, fer)
  };
  return { sMin: pVal == null ? null : somarDias(pVal, L, metodo, fer), pMax: sVal == null ? null : somarDias(sVal, -L, metodo, fer) };
}
/* true se a dependência é violada */
function violaDep(tipo, L, pVal, sVal, metodo, fer) {
  L = L || 0;
  const ref = somarDias(pVal, L, metodo, fer);
  return tipo === 'FS' ? sVal <= ref : sVal < ref;
}

function eConcluida(a) { return a.estado === 'concluida'; }
function eFechada(a) { return a.estado === 'concluida' || a.estado === 'cancelada'; }

/* Avalia uma dependência. Estados: ok | conflito | risco | por_avaliar | inativa */
function avaliarDep(dep, P, S, metodo, fer, hoje) {
  const r = regraDep(dep.tipo); const L = dep.desfasamento || 0;
  if (!P || !S) return { estado: 'por_avaliar', motivo: 'Atividade inexistente.' };
  if (P.estado === 'cancelada' || S.estado === 'cancelada') return { estado: 'inativa', motivo: 'Uma das atividades está cancelada.' };
  // 1) Execução real
  const pEf = dataEf(P, r.campoP), sEf = dataEf(S, r.campoS);
  if (sEf != null) {
    if (pEf == null) return { estado: 'conflito', tipoConflito: 'execucao', r, L, sVal: sEf, pVal: null };
    const lim = limitesDep(dep.tipo, L, pEf, sEf, metodo, fer);
    if (violaDep(dep.tipo, L, pEf, sEf, metodo, fer)) return { estado: 'conflito', tipoConflito: 'execucao', r, L, sVal: sEf, pVal: pEf, sMin: lim.sMin };
    return { estado: 'ok', r, L };
  }
  // 2) Planeamento
  const pV = pEf != null ? pEf : dataPrev(P, r.campoP);
  const sV = dataPrev(S, r.campoS);
  if (pV == null || sV == null) return { estado: 'por_avaliar', r, L, faltaP: pV == null, faltaS: sV == null };
  const lim = limitesDep(dep.tipo, L, pV, sV, metodo, fer);
  if (violaDep(dep.tipo, L, pV, sV, metodo, fer)) return { estado: 'conflito', tipoConflito: 'planeamento', r, L, sVal: sV, pVal: pV, sMin: lim.sMin, pMax: lim.pMax };
  // 3) Risco: predecessora atrasada face a hoje
  if (hoje != null && pEf == null && !eFechada(P) && pV < hoje) {
    const proj = limitesDep(dep.tipo, L, hoje, sV, metodo, fer);
    if (violaDep(dep.tipo, L, hoje, sV, metodo, fer)) return { estado: 'risco', r, L, sVal: sV, pVal: pV, sMin: proj.sMin, pMax: lim.pMax };
  }
  return { estado: 'ok', r, L };
}

/* Texto do alerta, com os 5 elementos exigidos */
function alertaDep(dep, P, S, av, ctx) {
  const nome = a => ctx.codigo(a) + ' ' + a.designacao;
  const campo = c => c === 'inicio' ? 'início' : 'conclusão';
  const oCampo = c => c === 'inicio' ? 'o início' : 'a conclusão';
  const doCampo = c => c === 'inicio' ? 'do início' : 'da conclusão';
  const lag = av.L ? ` com desfasamento de ${av.L > 0 ? '+' : ''}${av.L} ${unidade(ctx.metodo, Math.abs(av.L))}` : '';
  const nSuc = ctx.nSucessoras ? ctx.nSucessoras(S.id) : 0;
  const base = { afetada: nome(S), predecessora: nome(P) };
  if (av.estado === 'por_avaliar') {
    const falta = [av.faltaP ? `a data ${doCampo(av.r.campoP)} da predecessora` : null, av.faltaS ? `a data ${doCampo(av.r.campoS)} da sucessora` : null].filter(Boolean).join(' e ');
    return Object.assign(base, {
      incompatibilidade: `Dependência ${TIPOS_DEP[dep.tipo]}${lag} não pode ser verificada: falta ${falta}.`,
      consequencia: 'Não é possível confirmar se o planeamento respeita esta dependência.',
      correcao: 'Definir as datas previstas em falta.'
    });
  }
  if (av.tipoConflito === 'execucao') {
    return Object.assign(base, {
      incompatibilidade: av.pVal == null
        ? `A sucessora tem data efetiva ${doCampo(av.r.campoS)} (${fdn(av.sVal)}), mas a predecessora ainda não tem data efetiva ${doCampo(av.r.campoP)} (${TIPOS_DEP[dep.tipo]}: ${TIPOS_DEP_LONGO[dep.tipo]}).`
        : `A data efetiva ${doCampo(av.r.campoS)} da sucessora (${fdn(av.sVal)}) é anterior ao mínimo permitido (${fdn(av.sMin)}) pela data efetiva ${doCampo(av.r.campoP)} da predecessora (${fdn(av.pVal)}).`,
      consequencia: 'A execução não respeitou a sequência definida; o trabalho realizado pode ter de ser revisto.',
      correcao: 'Confirmar as datas efetivas registadas ou rever/eliminar a dependência se já não se aplicar.'
    });
  }
  const conseq = `${nome(S)} não poderá ${av.r.campoS === 'inicio' ? 'iniciar' : 'terminar'} na data prevista (${fdn(av.sVal)})` + (nSuc ? `; ${nSuc} atividade(s) que dela dependem poderão também ser afetadas.` : '.');
  if (av.estado === 'risco') {
    return Object.assign(base, {
      incompatibilidade: `A predecessora está atrasada: a data prevista ${doCampo(av.r.campoP)} (${fdn(av.pVal)}) já passou sem registo de execução. Mesmo que termine hoje, a sucessora só poderia ${av.r.campoS === 'inicio' ? 'iniciar' : 'terminar'} a partir de ${fdn(av.sMin)} (${TIPOS_DEP[dep.tipo]}${lag}).`,
      consequencia: conseq,
      correcao: `Concluir/registar a execução da predecessora, ou replanear ${av.r.campoS === 'inicio' ? 'o início' : 'a conclusão'} da sucessora para ${fdn(av.sMin)} ou depois.`
    });
  }
  return Object.assign(base, {
    incompatibilidade: `Dependência ${TIPOS_DEP[dep.tipo]}${lag}: a data prevista ${doCampo(av.r.campoS)} da sucessora (${fdn(av.sVal)}) é anterior ao mínimo permitido (${fdn(av.sMin)}), porque a data ${doCampo(av.r.campoP)} da predecessora é ${fdn(av.pVal)}.`,
    consequencia: conseq,
    correcao: `Adiar ${av.r.campoS === 'inicio' ? 'o início' : 'a conclusão'} da sucessora para ${fdn(av.sMin)} ou depois` + (av.pMax != null ? `, ou antecipar ${av.r.campoP === 'inicio' ? 'o início' : 'a conclusão'} da predecessora para ${fdn(av.pMax)} ou antes` : '') + ', ou rever o tipo/desfasamento da dependência.'
  });
}

/* Ciclos: criar P→S fecha um ciclo se P for alcançável a partir de S */
function criaCiclo(deps, predId, sucId, ignorarId) {
  if (predId === sucId) return true;
  const adj = new Map();
  for (const d of deps) { if (d.id === ignorarId) continue; if (!adj.has(d.predecessora_id)) adj.set(d.predecessora_id, []); adj.get(d.predecessora_id).push(d.sucessora_id); }
  const vis = new Set([sucId]); const pilha = [sucId];
  while (pilha.length) { const x = pilha.pop(); if (x === predId) return true; for (const y of (adj.get(x) || [])) if (!vis.has(y)) { vis.add(y); pilha.push(y); } }
  return false;
}

/* ===== Situação / atraso ===== */
function situacao(a, hoje) {
  if (a.estado === 'cancelada') return 'cancelada';
  const fp = pd(a.data_fim_prevista), ip = pd(a.data_inicio_prevista), fe = pd(a.data_fim_efetiva);
  if (a.estado === 'concluida') return (fe != null && fp != null && fe > fp) ? 'concluida_atraso' : 'concluida';
  if (a.estado === 'bloqueada') return 'bloqueada';
  if (ip == null || fp == null) return a.estado === 'em_curso' ? 'em_curso_np' : 'nao_planeada';
  if (fp < hoje) return 'atrasada';
  if (ip < hoje && a.estado === 'nao_iniciada' && !a.data_inicio_efetiva) return 'inicio_atrasado';
  if (a.estado === 'em_curso' || a.data_inicio_efetiva) return 'em_curso';
  if (a.estado === 'suspensa') return 'suspensa';
  return 'planeada';
}
const SITUACOES = {
  cancelada: 'Cancelada', concluida: 'Concluída', concluida_atraso: 'Concluída com atraso', bloqueada: 'Bloqueada',
  nao_planeada: 'Não planeada', em_curso_np: 'Em curso (sem datas)', atrasada: 'Atrasada', inicio_atrasado: 'Início em atraso',
  em_curso: 'Em curso', suspensa: 'Suspensa', planeada: 'Planeada'
};
function eAtrasada(a, hoje) { const fp = pd(a.data_fim_prevista); return !eFechada(a) && fp != null && fp < hoje; }
function semDatas(a) { return !a.data_inicio_prevista || !a.data_fim_prevista; }

/* ===== Execução ponderada =====
   Folha (sem subtarefas): 100 se concluída; senão a % registada.
   Tarefa com subtarefas: média ponderada das subtarefas não canceladas.
   Área: média ponderada das tarefas não canceladas.
   Projeto: média ponderada de todas as tarefas não canceladas.
   Peso: método 'peso' → peso da tarefa × peso da área; método 'duracao' → duração prevista (atividades sem datas ficam de fora). */
function pctFolha(a) { return a.estado === 'concluida' ? 100 : (Number(a.percentagem) || 0); }
function pesoAtiv(a, cfg, fer) {
  if (cfg.metodo_ponderacao === 'duracao') { const d = duracao(a.data_inicio_prevista, a.data_fim_prevista, cfg.metodo_duracao, fer); return (d && !isNaN(d)) ? d : 0; }
  return Number(a.peso) || 1;
}
function pctAtividade(a, filhosDe, cfg, fer) {
  const f = (filhosDe.get(a.id) || []).filter(x => x.estado !== 'cancelada');
  if (!f.length) return pctFolha(a);
  let s = 0, w = 0; for (const x of f) { const p = pesoAtiv(x, cfg, fer); s += p * pctFolha(x); w += p; }
  if (!w) return pctFolha(a);
  return s / w;
}
function pctConjunto(tarefas, filhosDe, cfg, fer, pesoExtra) {
  let s = 0, w = 0, n = 0;
  for (const t of tarefas) {
    if (t.estado === 'cancelada') continue;
    const p = pesoAtiv(t, cfg, fer) * (pesoExtra ? pesoExtra(t) : 1);
    if (!p) continue;
    s += p * pctAtividade(t, filhosDe, cfg, fer); w += p; n++;
  }
  return w ? { pct: s / w, n, pesoTotal: w } : { pct: null, n: 0, pesoTotal: 0 };
}

/* ===== Indicadores ===== */
function indicadores(D, hoje) {
  const { cfg, fer, areas, ativ, deps, marcos } = D;
  const ativas = ativ.filter(a => a.estado !== 'cancelada');
  const tarefas = ativas.filter(a => a.nivel === 1);
  const filhosDe = D.filhosDe;
  const areaPeso = new Map(areas.map(a => [a.id, Number(a.peso) || 1]));
  const g = pctConjunto(tarefas, filhosDe, cfg, fer, cfg.metodo_ponderacao === 'peso' ? (t => areaPeso.get(t.area_id) || 1) : null);
  const byId = D.byId;
  let conflitos = 0, riscos = 0, porAvaliar = 0;
  for (const d of deps) { const av = avaliarDep(d, byId.get(d.predecessora_id), byId.get(d.sucessora_id), cfg.metodo_duracao, fer, hoje); if (av.estado === 'conflito') conflitos++; else if (av.estado === 'risco') riscos++; else if (av.estado === 'por_avaliar') porAvaliar++; }
  const concl = ativas.filter(a => a.estado === 'concluida' && a.data_fim_efetiva && a.data_fim_prevista);
  const desvios = concl.map(a => pd(a.data_fim_efetiva) - pd(a.data_fim_prevista));
  const desviosIni = ativas.filter(a => a.data_inicio_efetiva && a.data_inicio_prevista).map(a => pd(a.data_inicio_efetiva) - pd(a.data_inicio_prevista));
  const mAt = marcos.filter(m => m.estado !== 'cancelado' && m.estado !== 'concluido' && !m.data_efetiva && m.data_prevista && pd(m.data_prevista) < hoje);
  const media = arr => arr.length ? arr.reduce((x, y) => x + y, 0) / arr.length : null;
  return {
    execucaoGlobal: g.pct,
    execucaoBase: g,
    areasPlaneadas: areas.length ? areas.filter(a => a.data_inicio_prevista && a.data_fim_prevista).length / areas.length * 100 : null,
    nAreasPlaneadas: areas.filter(a => a.data_inicio_prevista && a.data_fim_prevista).length, nAreas: areas.length,
    tarefasConcluidas: tarefas.length ? tarefas.filter(a => a.estado === 'concluida').length / tarefas.length * 100 : null,
    nTarefasConcluidas: tarefas.filter(a => a.estado === 'concluida').length, nTarefas: tarefas.length,
    nAtrasadas: ativas.filter(a => eAtrasada(a, hoje)).length,
    nBloqueadas: ativas.filter(a => a.estado === 'bloqueada').length,
    nSemResponsavel: ativas.filter(a => !eFechada(a) && !a.responsavel_id).length,
    nSemDatas: ativas.filter(a => semDatas(a)).length,
    nAtividades: ativas.length,
    nConflitos: conflitos, nRiscos: riscos, nPorAvaliar: porAvaliar, nDeps: deps.length,
    nMarcosConcluidos: marcos.filter(m => m.estado === 'concluido').length, nMarcos: marcos.filter(m => m.estado !== 'cancelado').length,
    nMarcosAtraso: mAt.length,
    desvioMedio: media(desvios), nDesvio: desvios.length,
    desvioMedioInicio: media(desviosIni), nDesvioInicio: desviosIni.length,
    noPrazo: concl.length ? concl.filter(a => pd(a.data_fim_efetiva) <= pd(a.data_fim_prevista)).length / concl.length * 100 : null,
    nNoPrazo: concl.filter(a => pd(a.data_fim_efetiva) <= pd(a.data_fim_prevista)).length, nConcluidasComDatas: concl.length
  };
}

/* ===== Coerência hierárquica (sobreposições / limites) ===== */
function foraDeIntervalo(filho, pai) {
  const fi = pd(filho.data_inicio_prevista), ff = pd(filho.data_fim_prevista), pi = pd(pai.ini), pf = pd(pai.fim);
  const r = [];
  if (fi != null && pi != null && fi < pi) r.push(`começa (${fd(filho.data_inicio_prevista)}) antes do início ${pai.rotulo} (${fd(pai.ini)})`);
  if (ff != null && pf != null && ff > pf) r.push(`termina (${fd(filho.data_fim_prevista)}) depois do fim ${pai.rotulo} (${fd(pai.fim)})`);
  return r;
}

if (typeof module !== 'undefined' && typeof window === 'undefined') module.exports = { ESTADOS, PRIORIDADES, TIPOS_DEP, pd, ds, fd, fdn, hojeN, eUtil, duracao, somarDias, limitesDep, avaliarDep, alertaDep, criaCiclo, situacao, eAtrasada, semDatas, pctFolha, pctAtividade, pctConjunto, indicadores, foraDeIntervalo, unidade };

</script>

/* ===== Carregamento ===== */
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }
async function carregarTudo() {
  const [cfg, fer, resp, areas, ativ, deps, marcos, ma, notas] = await Promise.all([
    q(sb.from('configuracao').select('*').eq('id', 1).single()),
    q(sb.from('feriados').select('*').order('data')),
    q(sb.from('responsaveis').select('*').order('nome')),
    q(sb.from('areas').select('*').order('numero')),
    q(sb.from('atividades').select('*').order('area_id').order('nivel').order('ordem').range(0, 9999)),
    q(sb.from('dependencias').select('*').range(0, 9999)),
    q(sb.from('marcos').select('*').order('data_prevista', { nullsFirst: false }).order('id')),
    q(sb.from('marco_atividades').select('*').range(0, 9999)),
    q(sb.from('notas').select('*').order('criado_em', { ascending: false }).range(0, 1999))
  ]);
  Object.assign(S, { cfg, feriados: fer, resp, areas, ativ, deps, marcos, marcoAtiv: ma, notas });
  if (eCoord()) { try { S.perfis = await q(sb.from('perfis').select('*').order('criado_em')); } catch (e) { S.perfis = []; } }
  indexar();
}
function indexar() {
  S.hoje = hojeN();
  S.fer = new Set(S.feriados.map(f => pd(f.data)));
  S.byId = new Map(S.ativ.map(a => [a.id, a]));
  S.areaById = new Map(S.areas.map(a => [a.id, a]));
  S.respById = new Map(S.resp.map(r => [r.id, r]));
  S.filhosDe = new Map(); S.tarefasDe = new Map();
  for (const a of S.ativ) {
    if (a.parent_id) { if (!S.filhosDe.has(a.parent_id)) S.filhosDe.set(a.parent_id, []); S.filhosDe.get(a.parent_id).push(a); }
    else { if (!S.tarefasDe.has(a.area_id)) S.tarefasDe.set(a.area_id, []); S.tarefasDe.get(a.area_id).push(a); }
  }
  const ord = (x, y) => x.ordem - y.ordem || x.id - y.id;
  S.filhosDe.forEach(v => v.sort(ord)); S.tarefasDe.forEach(v => v.sort(ord));
  S.sucDe = new Map(); S.predDe = new Map();
  for (const d of S.deps) {
    if (!S.sucDe.has(d.predecessora_id)) S.sucDe.set(d.predecessora_id, []); S.sucDe.get(d.predecessora_id).push(d);
    if (!S.predDe.has(d.sucessora_id)) S.predDe.set(d.sucessora_id, []); S.predDe.get(d.sucessora_id).push(d);
  }
  S.marcosDeAtiv = new Map(); S.ativDeMarco = new Map();
  for (const x of S.marcoAtiv) {
    if (!S.marcosDeAtiv.has(x.atividade_id)) S.marcosDeAtiv.set(x.atividade_id, []); S.marcosDeAtiv.get(x.atividade_id).push(x.marco_id);
    if (!S.ativDeMarco.has(x.marco_id)) S.ativDeMarco.set(x.marco_id, []); S.ativDeMarco.get(x.marco_id).push(x.atividade_id);
  }
}
function codigo(a) {
  if (!a) return '';
  const ar = S.areaById.get(a.area_id); const n = ar ? ar.numero : '?';
  if (a.nivel === 2) { const p = S.byId.get(a.parent_id); return n + '.' + (p ? p.ordem : '?') + '.' + a.ordem; }
  return n + '.' + a.ordem;
}
function nomeAtiv(a) { return a ? codigo(a) + ' ' + a.designacao : '(removida)'; }
function ctxAlerta() { return { codigo, metodo: metodo(), nSucessoras: id => (S.sucDe.get(id) || []).length }; }
function avaliar(d, sobrepor) {
  const get = id => (sobrepor && sobrepor.id === id) ? sobrepor : S.byId.get(id);
  return avaliarDep(d, get(d.predecessora_id), get(d.sucessora_id), metodo(), S.fer, S.hoje);
}
function pctAt(a) { return pctAtividade(a, S.filhosDe, S.cfg, S.fer); }
function pctArea(area) { return pctConjunto(S.tarefasDe.get(area.id) || [], S.filhosDe, S.cfg, S.fer).pct; }
function dadosInd() { return { cfg: S.cfg, fer: S.fer, areas: S.areas, ativ: S.ativ, deps: S.deps, marcos: S.marcos, filhosDe: S.filhosDe, byId: S.byId }; }
function sit(a) { return situacao(a, S.hoje); }

/* Incoerências hierárquicas e de calendário */
function incoerencias() {
  const out = [];
  const proj = { ini: S.cfg.data_inicio, fim: S.cfg.data_fim, rotulo: 'do projeto' };
  for (const ar of S.areas) {
    for (const m of foraDeIntervalo(ar, proj)) out.push({ tipo: 'area', obj: ar, txt: `Área ${ar.numero} ${m}.` });
    const pai = { ini: ar.data_inicio_prevista, fim: ar.data_fim_prevista, rotulo: 'da área' };
    for (const t of (S.tarefasDe.get(ar.id) || [])) {
      if (t.estado === 'cancelada') continue;
      for (const m of foraDeIntervalo(t, pai)) out.push({ tipo: 'ativ', obj: t, txt: `${codigo(t)} ${m}.` });
      const pt = { ini: t.data_inicio_prevista, fim: t.data_fim_prevista, rotulo: 'da tarefa' };
      for (const s of (S.filhosDe.get(t.id) || [])) { if (s.estado === 'cancelada') continue; for (const m of foraDeIntervalo(s, pt)) out.push({ tipo: 'ativ', obj: s, txt: `${codigo(s)} ${m}.` }); }
    }
  }
  for (const m of S.marcos) {
    if (!m.data_prevista || m.estado === 'cancelado') continue;
    for (const aid of (S.ativDeMarco.get(m.id) || [])) {
      const a = S.byId.get(aid); if (!a || !a.data_fim_prevista || a.estado === 'cancelada') continue;
      if (pd(a.data_fim_prevista) > pd(m.data_prevista)) out.push({ tipo: 'marco', obj: m, txt: `Marco «${m.designacao}» (${fd(m.data_prevista)}) é anterior à conclusão prevista da atividade associada ${codigo(a)} (${fd(a.data_fim_prevista)}).` });
    }
  }
  return out;
}

/* ===== UI base: toast, modal, confirmação ===== */
function toast(msg, tipo) {
  const d = document.createElement('div'); if (tipo === 'err') d.className = 'err'; d.textContent = msg;
  const t = $('#toast'); while (t.children.length >= 2) t.firstChild.remove(); t.appendChild(d); setTimeout(() => d.remove(), tipo === 'err' ? 5000 : 1500);
}
function erroMsg(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/row-level security|permission denied/i.test(m)) return 'Sem permissão para esta operação.';
  if (/duplicate key.*dependencias/i.test(m)) return 'Essa dependência já existe.';
  return m;
}
function abrirModal({ titulo, corpo, rodape, tamanho, onOpen }) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="scrim" data-act="fechar-modal"></div><div class="box ${tamanho || ''}"><div class="mh"><h2>${titulo}</h2><button class="btn ghost" data-act="fechar-modal" aria-label="Fechar">✕</button></div><div class="mb">${corpo}</div>${rodape ? `<div class="mf">${rodape}</div>` : ''}</div>`;
  root.classList.add('on');
  if (!document.body.classList.contains('locked')) { S._scrollY = window.scrollY; document.body.style.top = -S._scrollY + 'px'; document.body.classList.add('locked'); }
  if (onOpen) onOpen(root.querySelector('.box'));
  return root.querySelector('.box');
}
function fecharModal() {
  const root = $('#modalRoot');
  root.classList.remove('on'); root.innerHTML = '';
  document.body.classList.remove('locked'); document.body.style.top = ''; window.scrollTo(0, S._scrollY || 0);
}

/* Diálogo simples que não destrói o modal subjacente (usa camada própria) */
function dialogo({ titulo, html, botoes }) {
  return new Promise(res => {
    const wrap = document.createElement('div'); wrap.id = 'dlg';
    wrap.style.cssText = 'position:fixed;inset:0;z-index:150';
    wrap.innerHTML = `<div style="position:absolute;inset:0;background:rgba(15,23,42,.5)"></div><div class="card" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 24px));max-height:88dvh;display:flex;flex-direction:column"><div class="hd"><h2>${titulo}</h2></div><div class="bd" style="overflow:auto">${html}</div><div class="bd row" style="justify-content:flex-end;border-top:1px solid var(--line)">${botoes.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.txt)}</button>`).join('')}</div></div>`;
    document.body.appendChild(wrap);
    wrap.addEventListener('click', ev => { const b = ev.target.closest('button[data-i]'); if (!b) return; const i = +b.dataset.i; const val = botoes[i].valor; const out = typeof val === 'function' ? val(wrap) : val; if (out === undefined && botoes[i].manter) return; wrap.remove(); res(out); });
    const f = wrap.querySelector('input,textarea,select'); if (f) setTimeout(() => f.focus(), 50);
  });
}
const confirmar = (titulo, html, ok = 'Confirmar', cls = 'primary') => dialogo({ titulo, html, botoes: [{ txt: 'Cancelar', valor: false }, { txt: ok, cls, valor: true }] });

/* ===== Escrita ===== */
async function gravar(tabela, op, payload, filtro) {
  let r;
  if (op === 'insert') r = await sb.from(tabela).insert(payload).select();
  else if (op === 'update') r = await sb.from(tabela).update(payload).match(filtro).select();
  else if (op === 'delete') r = await sb.from(tabela).delete().match(filtro);
  if (r.error) throw r.error;
  if (op === 'update' && Array.isArray(r.data) && r.data.length === 0) throw new Error('A alteração não foi guardada (sem permissão ou registo inexistente).');
  return r.data;
}

function passosInicio() {
  const tarefas = S.ativ.filter(a => a.nivel === 1 && a.estado !== 'cancelada');
  const tComDatas = tarefas.filter(a => !semDatas(a)).length;
  const aComDatas = S.areas.filter(a => a.data_inicio_prevista && a.data_fim_prevista).length;

  return [
    { feito: !!(S.cfg.data_inicio && S.cfg.data_fim), t: 'Definir as datas do projeto', d: S.cfg.data_inicio && S.cfg.data_fim ? `${fd(S.cfg.data_inicio)} → ${fd(S.cfg.data_fim)}` : 'Data de início e data de conclusão prevista do projeto.', btn: ['Definir datas', 'data-act="datas-projeto"'] },

  }
  html += `<div class="kpis" style="margin-bottom:16px">
    ${kpi('Execução global', fmtPct(I.execucaoGlobal, 1), 'média ponderada', '', 'relatorios:indicadores')}

  return html;

/* ===== 4. TAREFAS ===== */
function filtroTarefas(a, f) {
  if (f.area && String(a.area_id) !== String(f.area)) return false;
  if (f.resp === '_none' ? a.responsavel_id : (f.resp && String(a.responsavel_id) !== String(f.resp))) return false;
  if (f.prio && a.prioridade !== f.prio) return false;
  if (f.nivel && String(a.nivel) !== f.nivel) return false;
  const s = sit(a);
  if (f.sit && s !== f.sit) return false;
  if (f.q) { const t = (codigo(a) + ' ' + a.designacao + ' ' + (a.observacoes || '')).toLowerCase(); if (!t.includes(f.q.toLowerCase())) return false; }
  switch (f.quick) {
    case 'atrasadas': if (!eAtrasada(a, S.hoje)) return false; break;
    case 'bloqueadas': if (a.estado !== 'bloqueada') return false; break;
    case 'semdatas': if (a.estado === 'cancelada' || !semDatas(a)) return false; break;
    case 'semresp': if (eFechada(a) || a.responsavel_id) return false; break;
    case 'emcurso': if (!['em_curso', 'em_curso_np', 'inicio_atrasado', 'atrasada'].includes(s) && a.estado !== 'em_curso') return false; break;
    case 'decisoes': if (!a.decisao_pendente || eFechada(a)) return false; break;
    case '7dias': { const fp = pd(a.data_fim_prevista); if (eFechada(a) || fp == null || fp < S.hoje || fp > S.hoje + 7) return false; break; }
  }
  return true;
}

/* Impactos de uma alteração: avalia dependências e limites com as datas propostas, sem alterar nada */
function analisarImpactos(orig, v) {
  const prop = Object.assign({}, orig);
  for (const k of ['data_inicio_prevista', 'data_fim_prevista', 'data_inicio_efetiva', 'data_fim_efetiva', 'estado']) if (k in v && v[k] !== undefined) prop[k] = v[k];
  const out = [];
  const ligadas = [...(S.predDe.get(orig.id) || []), ...(S.sucDe.get(orig.id) || [])];
  for (const d of ligadas) {
    const antes = avaliar(d), depois = avaliar(d, prop);
    if (depois.estado === 'conflito' || depois.estado === 'risco') {
      const P = d.predecessora_id === orig.id ? prop : S.byId.get(d.predecessora_id), X = d.sucessora_id === orig.id ? prop : S.byId.get(d.sucessora_id);
      out.push({ novo: antes.estado !== depois.estado, al: alertaDep(d, P, X, depois, ctxAlerta()), estado: depois.estado });
    }
  }
  const lim = [];
  if (orig.nivel === 1) { const ar = S.areaById.get(orig.area_id); if (ar) lim.push(...foraDeIntervalo(prop, { ini: ar.data_inicio_prevista, fim: ar.data_fim_prevista, rotulo: 'da área' })); }
  else { const p = S.byId.get(orig.parent_id); if (p) lim.push(...foraDeIntervalo(prop, { ini: p.data_inicio_prevista, fim: p.data_fim_prevista, rotulo: 'da tarefa' })); }
  for (const f of (S.filhosDe.get(orig.id) || [])) for (const m of foraDeIntervalo(f, { ini: prop.data_inicio_prevista, fim: prop.data_fim_prevista, rotulo: 'desta tarefa' })) lim.push(`a subtarefa ${codigo(f)} ${m}`);
  return { deps: out, lim };
}
function htmlAlerta(x) {
  const al = x.al;
  return `<div class="alert ${x.estado === 'risco' ? 'warn' : ''}"><b>${x.estado === 'risco' ? 'Risco' : 'Conflito'} de dependência${x.novo ? ' (novo)' : ''}</b><dl><dt>Atividade afetada</dt><dd>${esc(al.afetada)}</dd><dt>Predecessora</dt><dd>${esc(al.predecessora)}</dd><dt>Incompatibilidade</dt><dd>${esc(al.incompatibilidade)}</dd><dt>Consequência</dt><dd>${esc(al.consequencia)}</dd><dt>Correção possível</dt><dd>${esc(al.correcao)}</dd></dl></div>`;
}
function mostrarImpactos(box, orig, v) {
  const el = box.querySelector('[data-calc=impactos]'); if (!el) return;
  const r = analisarImpactos(orig, v);
  el.innerHTML = (r.lim.length ? `<div class="alert warn small"><b>Fora dos limites:</b> ${r.lim.map(esc).join('; ')}.</div>` : '') + r.deps.map(htmlAlerta).join('');
}
async function gravarAtividade(id) {
  const box = $('#modalRoot .box'); const v = lerForm(box); const novo = box._novo;
  if (!v.designacao || !v.designacao.trim()) return toast('Indique a designação.', 'err');
  const errD = validarDatas(v); if (errD) return toast(errD, 'err');
  const orig = id ? S.byId.get(id) : null;
  if (v.estado === 'concluida' && !v.data_fim_efetiva) return toast('Indique a data em que foi concluída.', 'err');
  if (orig) {
    const muda = (orig.data_inicio_prevista && v.data_inicio_prevista !== orig.data_inicio_prevista) || (orig.data_fim_prevista && v.data_fim_prevista !== orig.data_fim_prevista);
    if (muda && !(v.motivo_alteracao || '').trim()) return toast('Indique o motivo da alteração das datas planeadas.', 'err');
    const imp = analisarImpactos(orig, v);
    if (imp.deps.some(x => x.novo) || imp.lim.length) {
      const ok = await dialogo({ titulo: 'Impactos da alteração', html: `<p class="small">A alteração não altera automaticamente nenhuma outra atividade. Analise os impactos abaixo e decida.</p>${imp.lim.length ? `<div class="alert warn small"><b>Fora dos limites:</b> ${imp.lim.map(esc).join('; ')}.</div>` : ''}${imp.deps.map(htmlAlerta).join('')}`, botoes: [{ txt: 'Voltar e rever', valor: false }, { txt: 'Gravar mesmo assim', cls: 'primary', valor: true }] });
      if (!ok) return;
    }
  }
  const payload = {
    designacao: v.designacao.trim(), responsavel_id: v.responsavel_id ? Number(v.responsavel_id) : null, prioridade: v.prioridade,
    data_inicio_prevista: v.data_inicio_prevista, data_fim_prevista: v.data_fim_prevista, data_fim_efetiva: v.estado === 'concluida' ? v.data_fim_efetiva : null,
    estado: v.estado, peso: Number(v.peso) || 1, decisao_pendente: !!v.decisao_pendente, decisao_descricao: v.decisao_pendente ? v.decisao_descricao : null,
    motivo_bloqueio: v.estado === 'bloqueada' ? v.motivo_bloqueio : null, observacoes: v.observacoes,
    cor: v.cor_def ? null : v.cor
  };
  if (v.percentagem != null) payload.percentagem = Math.max(0, Math.min(100, Number(v.percentagem) || 0));
  if (payload.estado === 'concluida') payload.percentagem = 100;
  if (payload.data_inicio_efetiva && payload.estado === 'nao_iniciada') payload.estado = 'em_curso';
  try {
    if (id) { payload.motivo_alteracao = v.motivo_alteracao || null; await gravar('atividades', 'update', payload, { id }); }
    else {
      const areaId = novo.area_id || Number(v.area_id); if (!areaId) return toast('Escolha a área.', 'err');
      const irmaos = novo.parent_id ? (S.filhosDe.get(novo.parent_id) || []) : (S.tarefasDe.get(areaId) || []);
      Object.assign(payload, { area_id: areaId, parent_id: novo.parent_id || null, ordem: irmaos.reduce((m, x) => Math.max(m, x.ordem), 0) + 1, origem: 'utilizador' });
      await gravar('atividades', 'insert', payload);

/* Alteração rápida de estado (painel) */
async function estadoRapido(id, estado, sel) {
  const a = S.byId.get(id); if (!a) return;
  const payload = { estado };
  if (estado === 'concluida') {
    const r = await dialogo({ titulo: 'Concluir atividade', html: `<div class="form"><label class="full">${esc(nomeAtiv(a))}</label><label class="full">Concluída em<input type="date" id="dFim" value="${ds(S.hoje)}"></label></div>`, botoes: [{ txt: 'Cancelar', valor: null }, { txt: 'Concluir', cls: 'primary', valor: w => ({ i: a.data_inicio_efetiva, f: w.querySelector('#dFim').value }) }] });
    if (!r || !r.f) { sel.value = a.estado; return; }
    if (r.i && pd(r.f) < pd(r.i)) { sel.value = a.estado; return toast('A conclusão efetiva é anterior ao início efetivo.', 'err'); }
    Object.assign(payload, { data_fim_efetiva: r.f, data_inicio_efetiva: r.i || null, percentagem: 100 });
  } else if (false) {
    const r = await dialogo({ titulo: 'Iniciar atividade', html: `<div class="form"><label class="full">${esc(nomeAtiv(a))}</label><label>Início efetivo (opcional)<input type="date" id="dIni" value="${ds(S.hoje)}"></label></div>`, botoes: [{ txt: 'Cancelar', valor: null }, { txt: 'Guardar', cls: 'primary', valor: w => ({ i: w.querySelector('#dIni').value }) }] });

    if (r == null) { sel.value = a.estado; return; }
    payload.motivo_bloqueio = r;
  }
  try { await gravar('atividades', 'update', payload, { id }); toast('Estado atualizado.'); await recarregar(); }
  catch (e) { sel.value = a.estado; toast(erroMsg(e), 'err'); }
}

function editarDep(id, pre) {

async function gravarDep(id) {

  if (!pi || !si) return toast('Escolha a predecessora e a sucessora a partir da lista.', 'err');
  if (pi === si) return toast('Uma atividade não pode depender de si própria.', 'err');
  const a = S.byId.get(pi), b = S.byId.get(si);
  if (a.parent_id === si || b.parent_id === pi) return toast('Não crie dependências entre uma tarefa e as suas próprias subtarefas: a hierarquia já as relaciona.', 'err');
  if (criaCiclo(S.deps, pi, si, id || null)) return toast('Dependência circular: não permitida.', 'err');
  const payload = { predecessora_id: pi, sucessora_id: si, tipo: v.tipo, desfasamento: parseInt(v.desfasamento || '0', 10) || 0, observacoes: v.observacoes };
  try {
    if (id) await gravar('dependencias', 'update', payload, { id }); else await gravar('dependencias', 'insert', payload);
    fecharTodos(); toast('Dependência guardada.'); await recarregar();
  } catch (e) { toast(erroMsg(e), 'err'); }
}
function verDep(id) {
  const d = S.deps.find(x => x.id === id); if (!d) return;

  </tbody></table></div>`;
}
function csv(tipo) {
  const linhas = [];
  const c = v => { if (v == null) return ''; const s = String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  if (tipo === 'atividades') {
    linhas.push(['Nº', 'Nível', 'Área', 'Designação', 'Responsável', 'Prioridade', 'Início inicial', 'Fim inicial', 'Início previsto', 'Fim previsto', 'Duração (' + unidadeCurta(metodo()) + ')', 'Início efetivo', 'Fim efetivo', 'Execução %', 'Estado', 'Situação', 'Peso', 'Observações']);
    for (const a of ordenarAtiv(S.ativ)) { const d = duracao(a.data_inicio_prevista, a.data_fim_prevista, metodo(), S.fer); linhas.push([codigo(a), a.nivel === 1 ? 'Tarefa' : 'Subtarefa', S.areaById.get(a.area_id).numero, a.designacao, nomeResp(a.responsavel_id), PRIORIDADES[a.prioridade], fd(a.data_inicio_inicial), fd(a.data_fim_inicial), fd(a.data_inicio_prevista), fd(a.data_fim_prevista), d == null || isNaN(d) ? '' : d, fd(a.data_inicio_efetiva), fd(a.data_fim_efetiva), Math.round(pctAt(a)), ESTADOS[a.estado], SITUACOES[sit(a)], a.peso, a.observacoes]); }
  } else if (tipo === 'areas') {
    linhas.push(['Nº', 'Área', 'Responsável', 'Unidade orgânica', 'Início previsto', 'Fim previsto', 'Início efetivo', 'Fim efetivo', 'Execução %', 'Estado']);
    for (const a of S.areas) linhas.push([a.numero, a.designacao, nomeResp(a.responsavel_id), a.unidade_organica, fd(a.data_inicio_prevista), fd(a.data_fim_prevista), fd(a.data_inicio_efetiva), fd(a.data_fim_efetiva), pctArea(a) == null ? '' : Math.round(pctArea(a)), ESTADOS[a.estado]]);
  } else if (tipo === 'dependencias') {
    linhas.push(['Predecessora', 'Tipo', 'Desfasamento', 'Sucessora', 'Situação']);
    for (const d of S.deps) linhas.push([nomeAtiv(S.byId.get(d.predecessora_id)), TIPOS_DEP[d.tipo], d.desfasamento, nomeAtiv(S.byId.get(d.sucessora_id)), avaliar(d).estado]);
  } else {
    linhas.push(['Marco', 'Área', 'Data inicial', 'Data prevista', 'Data efetiva', 'Responsável', 'Estado']);
    for (const m of S.marcos) linhas.push([m.designacao, m.area_id ? S.areaById.get(m.area_id).numero : '', fd(m.data_inicial), fd(m.data_prevista), fd(m.data_efetiva), nomeResp(m.responsavel_id), sitMarco(m)[1]]);
  }
  const blob = new Blob(['﻿' + linhas.map(l => l.map(c).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `ecsf_${tipo}_${ds(S.hoje)}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function aposSessao() {

  if (!S.sessao) return ecraLogin();

  if (error || !p) return ecraLogin('Não foi possível obter o seu perfil. ' + (error ? erroMsg(error) : ''));
  S.perfil = p;
  if (p.papel === 'pendente') {
    $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
    $('#login').innerHTML = `<div class="card"><h1>Acesso pendente</h1><p>A sua conta (${esc(p.email)}) foi criada, mas ainda não tem acesso. O coordenador do projeto tem de lhe atribuir um papel em Configurações → Utilizadores.</p><button class="btn" data-act="sair">Terminar sessão</button></div>`;
    return;
  }

  try { await carregarTudo(); } catch (e) { $('#view').innerHTML = `<div class="alert">Erro ao carregar dados: ${esc(erroMsg(e))}</div>`; return; }
  const h = (location.hash || '').replace('#', '').split('/');

}

/* ===== PLANEAMENTO — edição direta das datas ===== */
function planFiltro(a) {
  const P = S.plan;
  if (P.q) { const t = (codigo(a) + ' ' + a.designacao).toLowerCase(); if (!t.includes(P.q.toLowerCase())) return false; }
  if (P.so === 'semdatas' && (a.estado === 'cancelada' || !semDatas(a))) return false;
  if (P.so === 'atrasadas' && !eAtrasada(a, S.hoje)) return false;
  if (P.so === 'semresp' && (eFechada(a) || a.responsavel_id)) return false;
  return true;
}
function celula(lbl, html) { return `<div><span class="lbl-m">${lbl}</span>${html}</div>`; }
function linhaPlan(tipo, o, extraNome) {
  const ro = !podeEditar(); const dis = ro ? 'disabled' : '';
  const k = `data-tipo="${tipo}" data-id="${o.id}"`;
  const sel = tipo === 'area' ? `<select data-pl="estado" ${k} ${dis}>${optsObj(ESTADOS, o.estado)}</select>` : `<select data-act-change="estado-rapido" data-id="${o.id}" ${dis}>${optsObj(ESTADOS, o.estado)}</select>`;
  return `${celula('Início previsto', `<input type="date" data-pl="data_inicio_prevista" ${k} value="${o.data_inicio_prevista || ''}" class="${o.data_inicio_prevista ? '' : 'vazio'}" ${dis}>`)}
    ${celula('Fim previsto', `<input type="date" data-pl="data_fim_prevista" ${k} value="${o.data_fim_prevista || ''}" class="${o.data_fim_prevista ? '' : 'vazio'}" ${dis}>`)}
    ${celula('Duração', `<div class="dur" data-dur="${tipo}-${o.id}">${o.data_inicio_prevista && o.data_fim_prevista ? durTxt(o.data_inicio_prevista, o.data_fim_prevista) : '—'}</div>`)}
    ${celula('Responsável', `<select data-pl="responsavel_id" ${k} ${dis}>${optsResp(o.responsavel_id, '—')}</select>`)}
    ${celula('Estado', sel)}
    <button class="ico" title="Mais detalhes" data-act="${tipo === 'area' ? 'edit-area' : 'edit-ativ'}" data-id="${o.id}">✎</button>`;
}
function vPlaneamento() {
  const P = S.plan; const filt = !!(P.q || P.so);
  let corpo = '';
  for (const ar of S.areas) {
    const tarefas = S.tarefasDe.get(ar.id) || [];
    const datadas = tarefas.filter(t => !semDatas(t)).length;
    let filhos = tarefas.map(t => { const subs = (S.filhosDe.get(t.id) || []); const subsOk = filt ? subs.filter(planFiltro) : subs; return { t, subs, subsOk, ok: !filt || planFiltro(t) || subsOk.length }; }).filter(x => x.ok);
    if (filt && !filhos.length) continue;
    const aberta = P.aberta.has(ar.id) || filt;
    corpo += `<div class="pl-r area"><div class="nm"><span class="car" data-act="pl-area" data-id="${ar.id}">${aberta ? '▼' : '▶'}</span><span class="lbl" data-act="pl-area" data-id="${ar.id}" style="cursor:pointer">${ar.numero}. ${esc(ar.designacao)}</span><span class="pl-mini nowrap">${datadas}/${tarefas.length} datadas</span></div>${linhaPlan('area', ar)}</div>`;
    if (!aberta) continue;
    for (const { t, subs, subsOk } of filhos) {
      const abertaT = P.abertaT.has(t.id) || (filt && subsOk.length && !planFiltro(t));
      corpo += `<div class="pl-r t"><div class="nm">${subs.length ? `<span class="car" data-act="pl-tarefa" data-id="${t.id}">${abertaT ? '▼' : '▶'}</span>` : '<span class="car"></span>'}<span class="code">${codigo(t)}</span><span class="lbl" title="${esc(t.designacao)}">${esc(t.designacao)}</span>${subs.length ? `<span class="pl-mini nowrap">${subs.length} sub.</span>` : ''}</div>${linhaPlan('ativ', t)}</div>`;
      if (abertaT) for (const s of (filt ? subsOk : subs)) corpo += `<div class="pl-r s"><div class="nm"><span class="car"></span><span class="code">${codigo(s)}</span><span class="lbl" title="${esc(s.designacao)}">${esc(s.designacao)}</span></div>${linhaPlan('ativ', s)}</div>`;
    }
    if (podeEditar()) corpo += `<div class="pl-add"><button class="btn sm ghost" data-act="nova-tarefa" data-area="${ar.id}">＋ Acrescentar tarefa à área ${ar.numero}</button> <button class="btn sm ghost" data-act="ir" data-v="area" data-p="${ar.id}">Ficha da área</button></div>`;
  }
  return `<div class="toolbar">
      <input type="search" placeholder="Pesquisar tarefa…" value="${esc(P.q)}" data-act-input="pl-q" style="flex:1;min-width:180px;max-width:320px">
      <select data-act-change="pl-so"><option value="">Mostrar tudo</option><option value="semdatas" ${P.so === 'semdatas' ? 'selected' : ''}>Só sem datas</option><option value="semresp" ${P.so === 'semresp' ? 'selected' : ''}>Só sem responsável</option><option value="atrasadas" ${P.so === 'atrasadas' ? 'selected' : ''}>Só atrasadas</option></select>
      <button class="btn sm" data-act="pl-abrir">Abrir todas</button><button class="btn sm" data-act="pl-fechar">Fechar todas</button>
    </div>
    <div class="small muted" style="margin-bottom:10px">Escreva as datas diretamente — as alterações são gravadas automaticamente. Clique numa área para ver as suas tarefas; use ✎ para observações, dependências e execução. Duração em ${metodo() === 'calendario' ? 'dias de calendário' : 'dias úteis'}.</div>
    <div class="pl"><div class="pl-h"><div>Área / tarefa</div><div>Início previsto</div><div>Fim previsto</div><div class="right">Duração</div><div>Responsável</div><div>Estado</div><div></div></div>
    ${corpo || '<div class="bd empty" style="padding:14px">Nada corresponde à pesquisa.</div>'}</div>`;
}

/* Gravação imediata de um campo */
async function gravarCampoPlan(el) {
  const tipo = el.dataset.tipo, id = Number(el.dataset.id), campo = el.dataset.pl;
  const lista = tipo === 'area' ? S.areas : S.ativ;
  const orig = lista.find(x => x.id === id); if (!orig) return;
  let val = el.value === '' ? null : el.value;
  if (campo === 'responsavel_id') val = val ? Number(val) : null;
  const repor = () => { el.value = orig[campo] == null ? '' : orig[campo]; };
  const cand = Object.assign({}, orig, { [campo]: val });
  if (cand.data_inicio_prevista && cand.data_fim_prevista && pd(cand.data_fim_prevista) < pd(cand.data_inicio_prevista)) {
    repor(); return toast('A data de fim não pode ser anterior à data de início.', 'err');
  }
  const payload = { [campo]: val };
  if (campo === 'estado' && val === 'concluida' && !orig.data_fim_efetiva) {
    const f = await dialogo({ titulo: 'Concluir área', html: `<div class="form"><label class="full">Data de conclusão efetiva<input type="date" id="dF" value="${ds(S.hoje)}"></label></div>`, botoes: [{ txt: 'Cancelar', valor: null }, { txt: 'Concluir', cls: 'primary', valor: w => w.querySelector('#dF').value }] });
    if (!f) return repor(); payload.data_fim_efetiva = f;
  }
  if ((campo === 'data_inicio_prevista' || campo === 'data_fim_prevista') && orig[campo] && orig[campo] !== val) {
    const m = await dialogo({ titulo: 'Motivo da alteração', html: `<p class="small">Está a alterar uma data já planeada (${fd(orig[campo])} → ${val ? fd(val) : 'sem data'}). O planeamento inicial mantém-se e a alteração fica no histórico.</p><div class="form"><label class="full">Motivo<input id="mot" placeholder="Ex.: atraso na aprovação"></label></div>`, botoes: [{ txt: 'Cancelar', valor: null }, { txt: 'Gravar', cls: 'primary', valor: w => w.querySelector('#mot').value.trim() || undefined, manter: true }] });
    if (!m) return repor(); payload.motivo_alteracao = m;
  }
  if (tipo === 'ativ' && campo.startsWith('data_')) {
    const imp = analisarImpactos(orig, cand);
    if (imp.deps.some(x => x.novo) || imp.lim.length) {
      const ok = await dialogo({ titulo: 'Atenção: impacto da alteração', html: `<p class="small">Nenhuma outra atividade é alterada automaticamente. Decida se mantém esta data.</p>${imp.lim.length ? `<div class="alert warn small"><b>Fora dos limites:</b> ${imp.lim.map(esc).join('; ')}.</div>` : ''}${imp.deps.map(htmlAlerta).join('')}`, botoes: [{ txt: 'Cancelar', valor: false }, { txt: 'Gravar mesmo assim', cls: 'primary', valor: true }] });
      if (!ok) return repor();
    }
  }
  try {
    const r = await gravar(tipo === 'area' ? 'areas' : 'atividades', 'update', payload, { id });
    const novo = r[0]; const i = lista.findIndex(x => x.id === id); lista[i] = novo; indexar();
    el.classList.toggle('vazio', !el.value);
    const d = document.querySelector(`[data-dur="${tipo}-${id}"]`); if (d) d.textContent = novo.data_inicio_prevista && novo.data_fim_prevista ? durTxt(novo.data_inicio_prevista, novo.data_fim_prevista) : '—';
    toast('Gravado.');
  } catch (e) { repor(); toast(erroMsg(e), 'err'); }
}

  doc.save(`ECSF_Plano_de_Implementacao${op.areas ? '_areas_' + areasDoc.map(a => a.numero).join('-').slice(0, 40) : ''}_${ds(S.hoje)}.pdf`);

/* ===== Cronograma (Gantt) desenhado em PDF, como na aplicação ===== */
function linhasGanttPDF(areaId, comSubs) {
  const rows = [];
  const conj = areaId instanceof Set ? areaId : null; if (conj) areaId = null;
  for (const ar of S.areas) {
    if (areaId && ar.id !== areaId) continue;
    if (conj && !conj.has(ar.id)) continue;
    if (!areaId) rows.push({ tipo: 'area', label: `${ar.numero}. ${ar.designacao}`, ini: ar.data_inicio_prevista, fim: ar.data_fim_prevista, ini0: ar.data_inicio_inicial, fim0: ar.data_fim_inicial, pct: pctArea(ar) || 0, cor: ar.cor || COR_AREA, area: true, atras: ar.data_fim_prevista && pd(ar.data_fim_prevista) < S.hoje && !['concluida', 'cancelada'].includes(ar.estado), marcos: S.marcos.filter(m => m.area_id === ar.id && m.estado !== 'cancelado') });
    if (areaId || comSubs !== 'areas') for (const t of (S.tarefasDe.get(ar.id) || [])) {
      const push = (a, nivel) => { const s = sit(a); rows.push({ tipo: 'ativ', nivel, label: `${codigo(a)} ${a.designacao}`, ini: a.data_inicio_prevista, fim: a.data_fim_prevista, ini0: a.data_inicio_inicial, fim0: a.data_fim_inicial, pct: pctAt(a), cor: corDeAtiv(a) || COR_TAREFA, atras: s === 'atrasada', concl: s === 'concluida' || s === 'concluida_atraso', bloq: s === 'bloqueada', canc: a.estado === 'cancelada' }); };
      push(t, 1); if (comSubs === true) for (const s of (S.filhosDe.get(t.id) || [])) push(s, 2);
    }
  }
  return rows;
}
function intervaloRows(rows, extra) {
  const v = rows.flatMap(r => [pd(r.ini), pd(r.fim), ...(r.marcos || []).map(m => pd(m.data_prevista))]).concat(extra ? extra.map(pd) : [pd(S.cfg.data_inicio), pd(S.cfg.data_fim)]).filter(x => x != null);
  if (!v.length) return null;
  let a = Math.min(...v), b = Math.max(...v);
  const d0 = new Date(a * DIA_MS), d1 = new Date(b * DIA_MS);
  a = Math.round(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), 1) / DIA_MS); b = Math.round(Date.UTC(d1.getUTCFullYear(), d1.getUTCMonth() + 1, 1) / DIA_MS) - 1;
  return [a, b];
}
/* Desenha e pagina. o = { x, y, w, bottom, labelW, rowH, t0, t1, novaPagina: () => yInicial, titulo } */
function desenharGanttPDF(doc, rows, o) {
  const rgb = h => hexRgb(h); const mix = (h, a, f) => rgb(misturar(h, a, f));
  const rowH = o.rowH || 5.2, hdrH = 9, labelW = o.labelW, gx = o.x + labelW, gw = o.w - labelW;
  const span = o.t1 - o.t0 + 1; const X = n => gx + (n - o.t0) / span * gw;
  const meses = Math.round(span / 30.4); const passo = meses > 30 ? 3 : 1;
  let y = o.y;
  const cabecalho = () => {
    doc.setFillColor(20, 38, 61); doc.rect(o.x, y, o.w, hdrH, 'F');
    doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.text(pdfTxt(o.titulo || 'Área / tarefa'), o.x + 1.5, y + 6);
    let d = new Date(o.t0 * DIA_MS); let yy = d.getUTCFullYear(), mm = d.getUTCMonth();
    doc.setFontSize(6);
    while (true) {
      const n = Math.round(Date.UTC(yy, mm, 1) / DIA_MS); if (n > o.t1) break;
      const nx = Math.round(Date.UTC(yy, mm + passo, 1) / DIA_MS); const x0 = X(Math.max(n, o.t0)), x1 = X(Math.min(nx, o.t1 + 1));
      doc.setDrawColor(70, 90, 120); doc.setLineWidth(0.15); doc.line(x0, y, x0, y + hdrH);
      const lbl = passo === 1 ? (MESES[mm] + (mm === 0 || n <= o.t0 ? ' ' + String(yy).slice(2) : '')) : ('T' + (Math.floor(mm / 3) + 1) + ' ' + String(yy).slice(2));
      doc.setFont('helvetica', mm === 0 ? 'bold' : 'normal'); if (x1 - x0 > doc.getTextWidth(lbl) + 1) doc.text(lbl, x0 + (x1 - x0) / 2, y + 6, { align: 'center' });
      mm += passo; if (mm >= 12) { mm -= 12; yy++; }
    }
    doc.setTextColor(0); y += hdrH;
  };
  const grelha = (yTop, yBot) => {
    let d = new Date(o.t0 * DIA_MS); let yy = d.getUTCFullYear(), mm = d.getUTCMonth();
    while (true) { const n = Math.round(Date.UTC(yy, mm, 1) / DIA_MS); if (n > o.t1) break; doc.setDrawColor(mm === 0 ? 170 : 225); doc.setLineWidth(mm === 0 ? 0.25 : 0.1); doc.line(X(n), yTop, X(n), yBot); mm += passo; if (mm >= 12) { mm -= 12; yy++; } }
    if (S.hoje >= o.t0 && S.hoje <= o.t1) { doc.setDrawColor(231, 76, 60); doc.setLineWidth(0.35); doc.line(X(S.hoje), yTop, X(S.hoje), yBot); }
    for (const v of [S.cfg.data_inicio, S.cfg.data_fim].filter(Boolean)) { const n = pd(v) + (v === S.cfg.data_fim ? 1 : 0); if (n >= o.t0 && n <= o.t1 + 1) { doc.setDrawColor(120, 130, 150); doc.setLineWidth(0.3); doc.setLineDashPattern([1, 1], 0); doc.line(X(n), yTop, X(n), yBot); doc.setLineDashPattern([], 0); } }
  };
  const losango = (cx, cy, r, fill, stroke) => { doc.setFillColor(...fill); doc.setDrawColor(...stroke); doc.setLineWidth(0.3); doc.lines([[r, r], [-r, r], [-r, -r], [r, -r]], cx, cy - r, [1, 1], 'FD', true); };
  cabecalho(); let yTop = y; let k = 0;
  for (const r of rows) {
    if (y + rowH > o.bottom) { grelha(yTop, y); y = o.novaPagina(); cabecalho(); yTop = y; k = 0; }
    if (r.area) { doc.setFillColor(238, 242, 247); doc.rect(o.x, y, o.w, rowH, 'F'); } else if (k % 2) { doc.setFillColor(250, 251, 252); doc.rect(o.x, y, o.w, rowH, 'F'); }
    doc.setDrawColor(235); doc.setLineWidth(0.1); doc.line(o.x, y + rowH, o.x + o.w, y + rowH);
    // rótulo
    doc.setFont('helvetica', r.area ? 'bold' : 'normal'); doc.setFontSize(r.area ? 7 : 6.5); doc.setTextColor(r.nivel === 2 ? 95 : 20);
    const ind = r.area ? 1.5 : r.nivel === 2 ? 6 : 3.5; let t = pdfTxt(r.label); const max = labelW - ind - 1.5;
    if (doc.getTextWidth(t) > max) { while (doc.getTextWidth(t + '...') > max && t.length > 3) t = t.slice(0, -1); t += '...'; }
    doc.text(t, o.x + ind, y + rowH / 2 + 1.1); doc.setTextColor(0);
    // barras
    const i = pd(r.ini), f = pd(r.fim);
    if (i != null && f != null) {
      const bh = r.area ? rowH * 0.42 : rowH * 0.52, by = y + (rowH - bh) / 2;
      const i0 = pd(r.ini0), f0 = pd(r.fim0);
      if (i0 != null && f0 != null && (i0 !== i || f0 !== f)) { doc.setFillColor(148, 163, 184); doc.rect(X(i0), y + rowH - 1.1, Math.max(0.4, X(f0 + 1) - X(i0)), 0.6, 'F'); }
      const x0 = X(Math.max(i, o.t0)), x1 = X(Math.min(f, o.t1) + 1), bw = Math.max(0.6, x1 - x0);
      const base = r.bloq ? [230, 185, 214] : r.concl && !r.area ? [159, 211, 180] : mix(r.cor, '#ffffff', r.area ? 0.35 : 0.55);
      const cheio = r.concl && !r.area ? [46, 125, 79] : r.area ? mix(r.cor, '#000000', r.cor === COR_AREA ? 0 : 0.25) : rgb(r.cor);
      doc.setFillColor(...base); doc.rect(x0, by, bw, bh, 'F');
      if (r.pct > 0) { doc.setFillColor(...cheio); doc.rect(x0, by, bw * Math.min(100, r.pct) / 100, bh, 'F'); }
      if (r.atras) { doc.setDrawColor(192, 57, 43); doc.setLineWidth(0.45); doc.rect(x0, by, bw, bh, 'S'); }
    } else { doc.setFont('helvetica', 'italic'); doc.setFontSize(5.5); doc.setTextColor(160); doc.text('por planear', gx + 1.5, y + rowH / 2 + 1); doc.setTextColor(0); }
    for (const m of (r.marcos || [])) { const n = pd(m.data_efetiva || m.data_prevista); if (n == null || n < o.t0 || n > o.t1) continue; const done = m.estado === 'concluido' || m.data_efetiva; const late = marcoAtrasado(m); losango(X(n), y + rowH / 2, 1.5, done ? [46, 125, 79] : late ? [192, 57, 43] : [255, 255, 255], done ? [46, 125, 79] : late ? [192, 57, 43] : [178, 106, 0]); }
    y += rowH; k++;
  }
  grelha(yTop, y);
  doc.setDrawColor(200); doc.setLineWidth(0.2); doc.line(gx, yTop - hdrH, gx, y);
  return y;
}
function legendaGanttPDF(doc, x, y) {
  doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); let cx = x;
  const item = (desenha, txt) => { desenha(cx, y); cx += 7; doc.setTextColor(80); doc.text(pdfTxt(txt), cx, y + 1.6); cx += doc.getTextWidth(pdfTxt(txt)) + 6; doc.setTextColor(0); };
  item((a, b) => { doc.setFillColor(157, 183, 216); doc.rect(a, b, 6, 2.4, 'F'); doc.setFillColor(31, 95, 168); doc.rect(a, b, 3, 2.4, 'F'); }, 'Previsto (parte escura = % executada)');
  item((a, b) => { doc.setFillColor(148, 163, 184); doc.rect(a, b + 1.6, 6, 0.6, 'F'); }, 'Planeamento inicial');
  item((a, b) => { doc.setDrawColor(192, 57, 43); doc.setLineWidth(0.45); doc.rect(a, b, 6, 2.4, 'S'); }, 'Atrasada');
  item((a, b) => { doc.setFillColor(159, 211, 180); doc.rect(a, b, 6, 2.4, 'F'); }, 'Concluída');
  item((a, b) => { doc.setDrawColor(178, 106, 0); doc.setFillColor(255, 255, 255); doc.lines([[1.3, 1.3], [-1.3, 1.3], [-1.3, -1.3], [1.3, -1.3]], a + 3, b - 0.1, [1, 1], 'FD', true); }, 'Marco');
  item((a, b) => { doc.setDrawColor(231, 76, 60); doc.setLineWidth(0.35); doc.line(a + 3, b - 0.5, a + 3, b + 3); }, 'Hoje');
}

Object.assign(ACOES, {
  'rel-modo': el => { S._relModo = el.dataset.k; render(); },

document.addEventListener('change', ev => { const el = ev.target.closest('[data-rel-area]'); if (!el) return; const id = Number(el.dataset.relArea); el.checked ? S._relSel.add(id) : S._relSel.delete(id); const sp = document.querySelector('[data-act="rel-modo"][data-k="escolher"]'); if (sp) sp.textContent = `Escolher áreas (${S._relSel.size})`; const info = el.closest('.bd').querySelector('.row .muted'); if (info) info.textContent = S._relSel.size ? S._relSel.size + ' área(s) selecionada(s)' : 'Nenhuma área selecionada'; });
