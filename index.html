<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Transportes DDS</title>
<style>
  :root{
    --bg:#eef2f6; --surface:#ffffff; --surface-2:#f7f9fb;
    --primary:#15486b; --primary-d:#0f3650; --primary-l:#e7f0f6;
    --text:#1f2937; --muted:#667085; --border:#e2e8f0;
    --ok:#2e7d5b; --ok-bg:#e6f4ec;
    --warn:#b26a00; --warn-bg:#fbf0dd;
    --info:#1f5f8b; --info-bg:#e5f0f8;
    --danger:#b3261e; --danger-bg:#fbe9e7;
    --slate:#5b6b7b; --slate-bg:#eceff2;
    --radius:12px; --shadow:0 1px 3px rgba(16,40,60,.08),0 1px 2px rgba(16,40,60,.06);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;
       min-height:100svh;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
  a{color:var(--primary)}

  /* ---- App shell ---- */
  .topbar{position:sticky;top:0;z-index:30;background:var(--primary);color:#fff;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;box-shadow:var(--shadow)}
  .topbar h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  .topbar .sub{font-size:12px;opacity:.85;font-weight:400}
  .nav{position:sticky;top:0;z-index:20;background:var(--primary-d);display:flex;gap:4px;overflow-x:auto;
    padding:6px 10px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{white-space:nowrap;border:0;background:transparent;color:#cfe0ec;padding:8px 12px;border-radius:8px;
    font-size:14px;font-weight:550;cursor:pointer}
  .nav button.active{background:rgba(255,255,255,.16);color:#fff}
  .wrap{max-width:960px;margin:0 auto;padding:14px 12px 40px}

  /* ---- Common ---- */
  .view-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
  .view-head h2{margin:0;font-size:19px;font-weight:650}
  .btn{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:active{background:var(--primary-d)}
  .btn-ghost{background:var(--surface);color:var(--primary);border:1px solid var(--border)}
  .btn-sm{padding:7px 10px;font-size:13px;border-radius:8px}
  .btn-danger{background:var(--danger-bg);color:var(--danger)}
  .btn-block{width:100%;justify-content:center}
  .btn:disabled{opacity:.5}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--border);border-radius:9px;
    padding:9px 10px;font-size:14px;flex:1;min-width:120px}
  .search{flex:2;min-width:150px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:12px 13px}
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .item-title{font-weight:650;font-size:15px}
  .item-sub{color:var(--muted);font-size:13px;margin-top:2px}
  .item-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--text)}
  .item-meta b{color:var(--muted);font-weight:550}
  .item-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
  .p-novo{background:var(--slate-bg);color:var(--slate)}
  .p-analise{background:var(--info-bg);color:var(--info)}
  .p-aguardar{background:var(--warn-bg);color:var(--warn)}
  .p-aprovado{background:var(--ok-bg);color:var(--ok)}
  .p-indeferido{background:var(--danger-bg);color:var(--danger)}
  .p-cancelado{background:var(--slate-bg);color:var(--slate)}
  .p-previsto{background:var(--info-bg);color:var(--info)}
  .p-realizado{background:var(--ok-bg);color:var(--ok)}
  .p-comp{background:#efe7f6;color:#6b3fa0}
  .p-disp{background:var(--ok-bg);color:var(--ok)}
  .p-indisp{background:var(--danger-bg);color:var(--danger)}
  .p-manut{background:var(--warn-bg);color:var(--warn)}
  .p-off{background:var(--slate-bg);color:var(--slate)}

  .empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:14px}
  .empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

  /* ---- Dashboard ---- */
  .dash-group{margin-bottom:18px}
  .dash-group h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:650;letter-spacing:.3px}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:12px 14px}
  .stat .n{font-size:24px;font-weight:700;line-height:1}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:4px}
  .stat.accent{background:var(--primary-l);border-color:#cfe0ec}
  .stat.accent .n{color:var(--primary)}

  /* ---- Modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(15,30,45,.45);z-index:50;display:none;
    align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .modal{background:var(--surface);width:100%;max-width:620px;max-height:92dvh;border-radius:18px 18px 0 0;
    display:flex;flex-direction:column;overflow:hidden}
  @media(min-width:640px){.overlay{align-items:center}.modal{border-radius:18px;max-height:90dvh}}
  .modal-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;
    justify-content:space-between;gap:10px;flex:0 0 auto}
  .modal-head h3{margin:0;font-size:16px;font-weight:650}
  .modal-x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;color:var(--muted)}
  .modal-body{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto}
  .modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex:0 0 auto;
    padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .modal-foot .btn{flex:1;justify-content:center}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);
    border-radius:9px;padding:10px;font-size:16px}
  .field textarea{min-height:64px;resize:vertical}
  .field-row{display:flex;gap:10px}
  .field-row .field{flex:1}
  .check{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:550}
  .check input{width:20px;height:20px}
  .sub-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .sub-row{display:flex;gap:8px;align-items:center}
  .sub-row input{flex:1}
  .icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;width:38px;height:38px;
    font-size:16px;cursor:pointer;flex:0 0 auto;color:var(--muted)}
  .add-line{background:none;border:1px dashed var(--border);color:var(--primary);border-radius:9px;padding:9px;
    width:100%;font-weight:600;cursor:pointer;font-size:13.5px}
  .divider{height:1px;background:var(--border);margin:14px 0}
  .section-label{font-size:13px;font-weight:700;color:var(--text);margin:2px 0 8px}

  /* ---- Toast ---- */
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:#1f2937;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:80;
    box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
    max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--danger)}

  .banner{background:var(--danger-bg);color:var(--danger);border:1px solid #f3c9c5;border-radius:10px;
    padding:11px 13px;font-size:13.5px;margin-bottom:12px;display:none}
  .banner.show{display:block}

  .loading{text-align:center;color:var(--muted);padding:30px;font-size:14px}
  .timeline{list-style:none;padding:0;margin:0}
  .timeline li{padding:8px 0 8px 16px;border-left:2px solid var(--border);position:relative;font-size:13.5px}
  .timeline li:before{content:"";position:absolute;left:-5px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
  .timeline .t{color:var(--muted);font-size:12px}

  /* ---- Relatórios ---- */
  .rel-count{font-size:13px;color:var(--muted);margin-bottom:8px}
  .rel-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
  .rel-tab{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
  .rel-tab th{background:var(--surface-2);text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--muted);font-weight:650}
  .rel-tab td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  .rel-tab tr:last-child td{border-bottom:0}

  /* ---- Folha do motorista / escala ---- */
  .esc-page{max-width:720px;margin:0 auto;color:#111}
  .esc-head{border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:12px}
  .esc-org{font-size:12px;color:#333}
  .esc-title{font-size:20px;font-weight:700;margin-top:2px}
  .esc-meta{font-size:13px;margin-top:2px}
  .esc-section{background:var(--primary);color:#fff;padding:5px 10px;font-weight:700;border-radius:5px;margin:14px 0 8px;font-size:13px}
  .esc-section-c{background:#6b3fa0}
  .esc-serv{border:1px solid #ccc;border-radius:6px;padding:8px 10px;margin-bottom:8px}
  .esc-serv-h{font-weight:700;margin-bottom:5px;font-size:13.5px}
  .esc-tab{width:100%;border-collapse:collapse}
  .esc-tab th{text-align:left;width:128px;color:#555;font-weight:600;vertical-align:top;padding:2px 8px 2px 0;font-size:12.5px}
  .esc-tab td{padding:2px 0;font-size:12.5px}
  .esc-day{margin-bottom:4px}
  .esc-day-h{font-weight:700;background:#eef2f6;color:#15486b;padding:5px 9px;border-radius:5px;margin:10px 0 6px;font-size:13px}
  .esc-empty{color:#777;font-style:italic;font-size:13px}

  /* ---- Impressão ---- */
  #printArea{display:none}
  @media print{
    @page{margin:14mm}
    html,body{background:#fff}
    .topbar,.nav,.wrap,.overlay,.toast{display:none !important}
    #printArea{display:block !important}
    .esc-page{page-break-after:always;max-width:none}
    .esc-page:last-child{page-break-after:auto}
    .esc-serv{page-break-inside:avoid}
    .esc-section{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
  <div class="topbar">
    <h1>🚌 Transportes DDS <span class="sub">· Cabeceiras de Basto</span></h1>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="wrap">
    <div class="banner" id="banner"></div>
    <div id="view"><div class="loading">A carregar…</div></div>
  </div>

  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>
  <div id="printArea"></div>

<script>
/* =========================================================
   Configuração Supabase
========================================================= */
const SB_URL = 'https://ruthhkhlmyrrzyfwmtls.supabase.co';
const SB_KEY = 'sb_publishable_ewwb05rGVH8CJYLSCRmm8Q_9vLHLci8';
const REST = SB_URL + '/rest/v1/';
const H = { apikey: SB_KEY, 'Content-Type': 'application/json' };

async function sbGet(path){
  const r = await fetch(REST + path, { headers: H });
  if(!r.ok) throw new Error('GET ' + path + ' → ' + r.status + ' ' + await r.text());
  return r.json();
}
async function sbInsert(table, body){
  const r = await fetch(REST + table, { method:'POST',
    headers:{...H, Prefer:'return=representation'}, body: JSON.stringify(body) });
  if(!r.ok) throw new Error('INSERT ' + table + ' → ' + r.status + ' ' + await r.text());
  const j = await r.json(); return Array.isArray(j) ? j[0] : j;
}
async function sbUpdate(table, id, body){
  const r = await fetch(REST + table + '?id=eq.' + id, { method:'PATCH',
    headers:{...H, Prefer:'return=representation'}, body: JSON.stringify(body) });
  if(!r.ok) throw new Error('UPDATE ' + table + ' → ' + r.status + ' ' + await r.text());
  const j = await r.json(); return Array.isArray(j) ? j[0] : j;
}
async function sbDelete(table, filter){
  const r = await fetch(REST + table + '?' + filter, { method:'DELETE',
    headers:{...H, Prefer:'return=minimal'} });
  if(!r.ok) throw new Error('DELETE ' + table + ' → ' + r.status + ' ' + await r.text());
}
async function logHist(tipo, id, pedidoId, descricao){
  try{ await sbInsert('historico', { entidade_tipo:tipo, entidade_id:id, pedido_id:pedidoId, descricao }); }
  catch(e){ console.warn('hist', e); }
}

/* =========================================================
   Utilidades
========================================================= */
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
function fmtData(d){ if(!d) return '—'; const p=String(d).slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
function fmtDataDia(d){ if(!d) return '—'; const dt=new Date(String(d).slice(0,10)+'T00:00:00'); return fmtData(d)+', '+DIAS[dt.getDay()]; }
function fmtHora(h){ return h ? String(h).slice(0,5) : '—'; }
function fmtEur(v){ return (v==null||v==='') ? '—' : Number(v).toLocaleString('pt-PT',{style:'currency',currency:'EUR'}); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekRange(){ const d=new Date(); const dow=(d.getDay()+6)%7; const mon=new Date(d); mon.setDate(d.getDate()-dow);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  return {ini:iso(mon), fim:iso(sun)}; }

let toastT;
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(err?' err':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',2600); }

/* Modal */
function openModal(html){ $('#modal').innerHTML=html; $('#overlay').classList.add('open'); document.body.style.overflow='hidden'; }
function closeModal(){ $('#overlay').classList.remove('open'); document.body.style.overflow=''; $('#modal').innerHTML=''; }
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

/* Confirmação (sem confirm nativo) */
function confirmar(msg, onYes, danger){
  openModal(`
    <div class="modal-head"><h3>Confirmar</h3><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body"><p style="margin:6px 0 2px">${esc(msg)}</p></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn ${danger?'btn-danger':'btn-primary'}" id="cfmYes">Confirmar</button>
    </div>`);
  $('#cfmYes').onclick=async()=>{ try{ await onYes(); }catch(e){ toast(e.message,true);} };
}

/* =========================================================
   Estado / caches
========================================================= */
const cache = { areas:[], entidades:[], contactos:[], tipos:[], motoristas:[], viaturas:[] };
async function loadCaches(){
  const [areas,entidades,contactos,tipos,motoristas,viaturas] = await Promise.all([
    sbGet('areas?select=*&order=ordem'),
    sbGet('entidades?select=*&order=nome'),
    sbGet('contactos_entidades?select=*&order=principal.desc,nome'),
    sbGet('tipos_servico?select=*&order=ordem'),
    sbGet('motoristas?select=*&order=nome'),
    sbGet('viaturas?select=*&order=matricula'),
  ]);
  Object.assign(cache,{areas,entidades,contactos,tipos,motoristas,viaturas});
}
const areaNome = id => (cache.areas.find(a=>a.id===id)||{}).nome || '';
const entNome  = id => (cache.entidades.find(e=>e.id===id)||{}).nome || '';
const tipoNome = id => (cache.tipos.find(t=>t.id===id)||{}).nome || '';
const motNome  = id => (cache.motoristas.find(m=>m.id===id)||{}).nome || '';
const viatLabel= id => { const v=cache.viaturas.find(x=>x.id===id); return v?(v.matricula+(v.marca?' · '+v.marca:'')):''; };
function opts(list, sel, valKey, labelFn, placeholder){
  let h = placeholder!==undefined ? `<option value="">${esc(placeholder)}</option>` : '';
  list.forEach(o=>{ const v=o[valKey]; h+=`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(labelFn(o))}</option>`; });
  return h;
}

/* =========================================================
   Navegação
========================================================= */
const VIEWS = [
  ['dashboard','Painel'], ['pedidos','Pedidos'], ['servicos','Serviços'], ['escalas','Escalas'],
  ['entidades','Entidades'], ['motoristas','Motoristas'], ['viaturas','Viaturas'], ['tipos','Tipos'],
  ['relatorios','Relatórios']
];
let current = 'dashboard';
function buildNav(){
  $('#nav').innerHTML = VIEWS.map(([k,l])=>`<button data-v="${k}" class="${k===current?'active':''}" onclick="go('${k}')">${l}</button>`).join('');
}
function go(v){ current=v; buildNav(); render(); }
function render(){
  const el=$('#view'); el.innerHTML='<div class="loading">A carregar…</div>';
  ({dashboard:viewDashboard,pedidos:viewPedidos,servicos:viewServicos,escalas:viewEscalas,entidades:viewEntidades,
    motoristas:viewMotoristas,viaturas:viewViaturas,tipos:viewTipos,relatorios:viewRelatorios}[current])().catch(e=>{
    el.innerHTML=`<div class="empty"><b>Ocorreu um erro</b>${esc(e.message)}</div>`;
  });
}

/* =========================================================
   PAINEL
========================================================= */
async function viewDashboard(){
  const wk = weekRange(); const hoje = todayISO();
  const [ped, serv, mot, viat, pag] = await Promise.all([
    sbGet('pedidos?select=id,estado'),
    sbGet('servicos?select=id,data,estado,motorista_id,viatura_id,complementar'),
    sbGet('motoristas?select=id,estado'),
    sbGet('viaturas?select=id,estado'),
    sbGet('pagamentos?select=valor_total,estado'),
  ]);
  const cP = e => ped.filter(x=>x.estado===e).length;
  const servHoje = serv.filter(s=>s.data===hoje);
  const servSem = serv.filter(s=>s.data>=wk.ini && s.data<=wk.fim);
  const motServ = new Set(servHoje.map(s=>s.motorista_id).filter(Boolean));
  const viatServ = new Set(servHoje.map(s=>s.viatura_id).filter(Boolean));
  const compSem = servSem.filter(s=>s.complementar);
  const aPagar = pag.filter(p=>p.estado==='Previsto'||p.estado==='Realizado'||p.estado==='A processar')
                    .reduce((a,p)=>a+Number(p.valor_total||0),0);
  const motAtivos = mot.filter(m=>m.estado==='Ativo');

  function grp(title, cards){ return `<div class="dash-group"><h3>${title}</h3><div class="stats">${cards}</div></div>`; }
  function st(n,l,accent){ return `<div class="stat ${accent?'accent':''}"><div class="n">${n}</div><div class="l">${l}</div></div>`; }

  $('#view').innerHTML =
    `<div class="view-head"><h2>Painel</h2></div>`+
    grp('Pedidos',
      st(cP('Novo'),'Novos',true)+st(cP('Em análise'),'Em análise')+st(cP('A aguardar informação'),'A aguardar')+
      st(cP('Aprovado'),'Aprovados')+st(cP('Indeferido'),'Indeferidos'))+
    grp('Serviços',
      st(servHoje.length,'Hoje',true)+st(servSem.length,'Esta semana')+
      st(serv.filter(s=>s.estado==='Previsto').length,'Por realizar'))+
    grp('Motoristas',
      st(motServ.size,'Em serviço hoje')+st(Math.max(motAtivos.length-motServ.size,0),'Disponíveis'))+
    grp('Viaturas',
      st(viatServ.size,'Em serviço hoje')+st(viat.filter(v=>v.estado==='Disponível').length,'Disponíveis')+
      st(viat.filter(v=>v.estado==='Indisponível').length,'Indisponíveis')+
      st(viat.filter(v=>v.estado==='Manutenção').length,'Manutenção'))+
    grp('Serviços complementares',
      st(compSem.length,'Esta semana')+st(fmtEur(aPagar),'Total a processar',true));
}

/* =========================================================
   PEDIDOS
========================================================= */
const EST_PEDIDO = ['Novo','Em análise','A aguardar informação','Aprovado','Indeferido','Cancelado'];
function pillEstadoPedido(e){
  const m={'Novo':'p-novo','Em análise':'p-analise','A aguardar informação':'p-aguardar','Aprovado':'p-aprovado','Indeferido':'p-indeferido','Cancelado':'p-cancelado'};
  return `<span class="pill ${m[e]||'p-novo'}">${esc(e)}</span>`;
}
let pedidosData=[], pedidoFiltro={q:'',estado:'',area:''};
async function viewPedidos(){
  pedidosData = await sbGet('pedidos?select=*&order=data_pedido.desc,numero.desc');
  $('#view').innerHTML = `
    <div class="view-head"><h2>Pedidos</h2><button class="btn btn-primary" onclick="editPedido()">+ Novo</button></div>
    <div class="toolbar">
      <input class="search" id="pq" placeholder="Pesquisar nº, entidade, destino…" value="${esc(pedidoFiltro.q)}">
      <select id="pest">${opts(EST_PEDIDO.map(e=>({v:e})),pedidoFiltro.estado,'v',o=>o.v,'Todos os estados')}</select>
      <select id="par">${opts(cache.areas,pedidoFiltro.area,'id',a=>a.nome,'Todas as áreas')}</select>
    </div>
    <div id="pedList" class="list"></div>`;
  $('#pq').oninput=e=>{pedidoFiltro.q=e.target.value;renderPedList();};
  $('#pest').onchange=e=>{pedidoFiltro.estado=e.target.value;renderPedList();};
  $('#par').onchange=e=>{pedidoFiltro.area=e.target.value;renderPedList();};
  renderPedList();
}
function renderPedList(){
  const q=pedidoFiltro.q.toLowerCase();
  let list=pedidosData.filter(p=>{
    if(pedidoFiltro.estado && p.estado!==pedidoFiltro.estado) return false;
    if(pedidoFiltro.area && p.area_id!==pedidoFiltro.area) return false;
    if(q){ const s=(p.numero+' '+entNome(p.entidade_id)+' '+(p.destino||'')+' '+(p.descricao||'')).toLowerCase();
      if(!s.includes(q)) return false; }
    return true;
  });
  const el=$('#pedList');
  if(!list.length){ el.innerHTML=`<div class="empty"><b>Sem pedidos</b>Cria o primeiro pedido com o botão “+ Novo”.</div>`; return; }
  el.innerHTML=list.map(p=>`
    <div class="item">
      <div class="item-top">
        <div><div class="item-title">${esc(p.numero||'—')} · ${esc(entNome(p.entidade_id))}</div>
          <div class="item-sub">${esc(areaNome(p.area_id))} · ${esc(tipoNome(p.tipo_servico_id)||'—')}</div></div>
        ${pillEstadoPedido(p.estado)}
      </div>
      <div class="item-meta">
        <span><b>Data pretendida:</b> ${fmtData(p.data_pretendida)}</span>
        <span><b>Saída:</b> ${fmtHora(p.hora_saida)}</span>
        <span><b>Regresso:</b> ${fmtHora(p.hora_regresso)}</span>
        <span><b>Destino:</b> ${esc(p.destino||'—')}</span>
        <span><b>Passageiros:</b> ${p.num_passageiros??'—'}</span>
      </div>
      <div class="item-actions">
        <button class="btn btn-ghost btn-sm" onclick="editPedido('${p.id}')">Abrir</button>
        <button class="btn btn-ghost btn-sm" onclick="verHistorico('${p.id}')">Histórico</button>
        ${p.estado==='Aprovado'?`<button class="btn btn-primary btn-sm" onclick="criarServicoDePedido('${p.id}')">Criar serviço</button>`:''}
      </div>
    </div>`).join('');
}

async function editPedido(id){
  let p = id ? await sbGet('pedidos?id=eq.'+id).then(r=>r[0]) : {estado:'Novo'};
  let pontos = id ? await sbGet('pontos_recolha?select=*&pedido_id=eq.'+id+'&order=ordem') : [];
  openModal(pedidoForm(p, pontos));
  wirePedidoForm(p);
}
function pontosRows(pontos){
  const rows = (pontos.length?pontos:[{local:''}]).map((pt,i)=>`
    <div class="sub-row"><input class="pt-input" placeholder="Ponto de recolha ${i+1}" value="${esc(pt.local||'')}">
      <button type="button" class="icon-btn" onclick="this.parentNode.remove()">×</button></div>`).join('');
  return rows;
}
function pedidoForm(p, pontos){
  return `
  <div class="modal-head"><h3>${p.id?'Pedido '+esc(p.numero||''):'Novo pedido'}</h3><button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="field-row">
      <div class="field"><label>Área</label><select id="f_area">${opts(cache.areas,p.area_id,'id',a=>a.nome,'—')}</select></div>
      <div class="field"><label>Estado</label><select id="f_estado">${opts(EST_PEDIDO.map(e=>({v:e})),p.estado,'v',o=>o.v)}</select></div>
    </div>
    <div class="field"><label>Entidade requerente</label><select id="f_ent"></select></div>
    <div class="field"><label>Contacto</label><select id="f_cont"></select></div>
    <div class="field"><label>Tipo de serviço</label><select id="f_tipo"></select></div>
    <div class="field-row">
      <div class="field"><label>Data pretendida</label><input type="date" id="f_datap" value="${esc(p.data_pretendida||'')}"></div>
      <div class="field"><label>Passageiros</label><input type="number" id="f_pass" inputmode="numeric" value="${esc(p.num_passageiros??'')}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Hora de saída</label><input type="time" id="f_saida" value="${fmtHora(p.hora_saida)==='—'?'':fmtHora(p.hora_saida)}"></div>
      <div class="field"><label>Hora de regresso</label><input type="time" id="f_reg" value="${fmtHora(p.hora_regresso)==='—'?'':fmtHora(p.hora_regresso)}"></div>
    </div>
    <div class="section-label">Pontos de recolha</div>
    <div class="sub-list" id="pontosBox">${pontosRows(pontos)}</div>
    <button type="button" class="add-line" onclick="addPonto()">+ Adicionar ponto</button>
    <div class="field" style="margin-top:12px"><label>Destino</label><input id="f_dest" value="${esc(p.destino||'')}"></div>
    <div class="field"><label>Descrição do serviço</label><textarea id="f_desc">${esc(p.descricao||'')}</textarea></div>
    <div class="field"><label>Observações</label><textarea id="f_obs">${esc(p.observacoes||'')}</textarea></div>
  </div>
  <div class="modal-foot">
    ${p.id?`<button class="btn btn-danger" onclick="apagarPedido('${p.id}')">Apagar</button>`:''}

  </div>`;
}
function addPonto(){ const box=$('#pontosBox'); const d=document.createElement('div'); d.className='sub-row';
  d.innerHTML=`<input class="pt-input" placeholder="Ponto de recolha"><button type="button" class="icon-btn" onclick="this.parentNode.remove()">×</button>`;
  box.appendChild(d); }
function fillEntSelect(areaId, selEnt){
  const list=cache.entidades.filter(e=>e.area_id===areaId && e.ativo!==false);
  $('#f_ent').innerHTML=opts(list, selEnt,'id',e=>e.nome,'—');
}
function fillContSelect(entId, selCont){
  const list=cache.contactos.filter(c=>c.entidade_id===entId && c.ativo!==false);
  $('#f_cont').innerHTML=opts(list, selCont,'id',c=>c.nome+(c.telefone?' · '+c.telefone:''),'—');
}
function fillTipoSelect(areaId, selTipo){
  const list=cache.tipos.filter(t=>(t.area_id===areaId||t.area_id==null) && t.ativo!==false);
  $('#f_tipo').innerHTML=opts(list, selTipo,'id',t=>t.nome,'—');
}
function wirePedidoForm(p){
  fillEntSelect(p.area_id, p.entidade_id);
  fillContSelect(p.entidade_id, p.contacto_id);
  fillTipoSelect(p.area_id, p.tipo_servico_id);
  $('#f_area').onchange=e=>{ fillEntSelect(e.target.value); fillTipoSelect(e.target.value); $('#f_cont').innerHTML='<option value="">—</option>'; };
  $('#f_ent').onchange=e=>fillContSelect(e.target.value);
  $('#savePed').onclick=()=>savePedido(p);
}
function collectPontos(){
  return [...document.querySelectorAll('#pontosBox .pt-input')].map(i=>i.value.trim()).filter(Boolean);
}
async function savePedido(p){
  const body={
    area_id:$('#f_area').value||null, entidade_id:$('#f_ent').value||null, contacto_id:$('#f_cont').value||null,
    tipo_servico_id:$('#f_tipo').value||null, data_pretendida:$('#f_datap').value||null,
    hora_saida:$('#f_saida').value||null, hora_regresso:$('#f_reg').value||null,
    destino:$('#f_dest').value.trim()||null, num_passageiros:$('#f_pass').value?Number($('#f_pass').value):null,
    descricao:$('#f_desc').value.trim()||null, observacoes:$('#f_obs').value.trim()||null, estado:$('#f_estado').value
  };
  if(!body.area_id||!body.entidade_id){ toast('Área e entidade são obrigatórias',true); return; }
  $('#savePed').disabled=true;
  try{
    const pontos=collectPontos();
    if(p.id){
      const estadoAntigo=p.estado;
      await sbUpdate('pedidos',p.id,body);
      await sbDelete('pontos_recolha','pedido_id=eq.'+p.id);
      for(let i=0;i<pontos.length;i++) await sbInsert('pontos_recolha',{pedido_id:p.id,local:pontos[i],ordem:i});
      if(estadoAntigo!==body.estado) await logHist('pedido',p.id,p.id,'Estado alterado para '+body.estado);
      toast('Pedido atualizado');
    }else{
      const novo=await sbInsert('pedidos',body);
      for(let i=0;i<pontos.length;i++) await sbInsert('pontos_recolha',{pedido_id:novo.id,local:pontos[i],ordem:i});
      await logHist('pedido',novo.id,novo.id,'Pedido criado');
      toast('Pedido '+(novo.numero||'')+' criado');
    }
    closeModal(); if(current==='pedidos') viewPedidos();
  }catch(e){ toast(e.message,true); $('#savePed').disabled=false; }
}
function apagarPedido(id){ confirmar('Apagar este pedido? Os serviços associados ficam sem pedido.', async()=>{
  await sbDelete('pedidos','id=eq.'+id); closeModal(); toast('Pedido apagado'); viewPedidos(); }, true); }

async function verHistorico(pedidoId){
  const h=await sbGet('historico?select=*&pedido_id=eq.'+pedidoId+'&order=created_at.asc');
  openModal(`
    <div class="modal-head"><h3>Histórico</h3><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      ${h.length?`<ul class="timeline">${h.map(x=>`<li><div>${esc(x.descricao)}</div><div class="t">${new Date(x.created_at).toLocaleString('pt-PT')}</div></li>`).join('')}</ul>`
        :'<div class="empty">Sem registos de histórico.</div>'}
    </div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="closeModal()">Fechar</button></div>`);
}

const EST_SERV=['Previsto','Realizado','Cancelado'];
function pillEstadoServ(e){ const m={'Previsto':'p-previsto','Realizado':'p-realizado','Cancelado':'p-cancelado'}; return `<span class="pill ${m[e]||'p-previsto'}">${esc(e)}</span>`; }
let servData=[], servFiltro={q:'',estado:'',motorista:'',tipoComp:''};
async function viewServicos(){
  servData=await sbGet('servicos?select=*&order=data.desc,hora_saida');
  $('#view').innerHTML=`
    <div class="view-head"><h2>Serviços</h2><button class="btn btn-primary" onclick="editServico()">+ Novo</button></div>
    <div class="toolbar">
      <input class="search" id="sq" placeholder="Pesquisar entidade, destino…" value="${esc(servFiltro.q)}">
      <select id="smot">${opts(cache.motoristas,servFiltro.motorista,'id',m=>m.nome,'Todos os motoristas')}</select>
      <select id="scomp">
        <option value="">Normais + complementares</option>
        <option value="0" ${servFiltro.tipoComp==='0'?'selected':''}>Só normais</option>
        <option value="1" ${servFiltro.tipoComp==='1'?'selected':''}>Só complementares</option>
      </select>
    </div>
    <div id="servList" class="list"></div>`;
  $('#sq').oninput=e=>{servFiltro.q=e.target.value;renderServList();};
  $('#smot').onchange=e=>{servFiltro.motorista=e.target.value;renderServList();};
  $('#scomp').onchange=e=>{servFiltro.tipoComp=e.target.value;renderServList();};
  renderServList();
}
function renderServList(){
  const q=servFiltro.q.toLowerCase();
  let list=servData.filter(s=>{
    if(servFiltro.motorista && s.motorista_id!==servFiltro.motorista) return false;
    if(servFiltro.tipoComp==='1' && !s.complementar) return false;
    if(servFiltro.tipoComp==='0' && s.complementar) return false;
    if(q){ const t=(entNome(s.entidade_id)+' '+(s.destino||'')+' '+(s.descricao||'')).toLowerCase(); if(!t.includes(q)) return false; }
    return true;
  });
  const el=$('#servList');
  if(!list.length){ el.innerHTML=`<div class="empty"><b>Sem serviços</b>Cria a partir de um pedido aprovado ou com “+ Novo”.</div>`; return; }
  el.innerHTML=list.map(s=>`
    <div class="item">
      <div class="item-top">
        <div><div class="item-title">${fmtDataDia(s.data)}</div>
          <div class="item-sub">${esc(entNome(s.entidade_id))} · ${esc(tipoNome(s.tipo_servico_id)||'—')}</div></div>
        <div style="text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end">
          ${pillEstadoServ(s.estado)}${s.complementar?'<span class="pill p-comp">Complementar</span>':''}</div>
      </div>
      <div class="item-meta">
        <span><b>Saída:</b> ${fmtHora(s.hora_saida)}</span><span><b>Regresso:</b> ${fmtHora(s.hora_regresso)}</span>
        <span><b>Destino:</b> ${esc(s.destino||'—')}</span><span><b>Passageiros:</b> ${s.num_passageiros??'—'}</span>
        <span><b>Motorista:</b> ${esc(motNome(s.motorista_id)||'—')}</span>
        <span><b>Viatura:</b> ${esc(viatLabel(s.viatura_id)||'—')}</span>
      </div>
      <div class="item-actions"><button class="btn btn-ghost btn-sm" onclick="editServico('${s.id}')">Abrir</button></div>
    </div>`).join('');
}
async function criarServicoDePedido(pedidoId){
  const p=await sbGet('pedidos?id=eq.'+pedidoId).then(r=>r[0]);
  const pontos=await sbGet('pontos_recolha?select=*&pedido_id=eq.'+pedidoId+'&order=ordem');
  const s={ pedido_id:p.id, data:p.data_pretendida, area_id:p.area_id, entidade_id:p.entidade_id,
    tipo_servico_id:p.tipo_servico_id, descricao:p.descricao, destino:p.destino,
    hora_saida:p.hora_saida, hora_regresso:p.hora_regresso, num_passageiros:p.num_passageiros,
    estado:'Previsto', complementar:false };
  openModal(servicoForm(s, pontos.map(x=>({local:x.local}))));
  wireServicoForm(s);
}
async function editServico(id){
  let s = id ? await sbGet('servicos?id=eq.'+id).then(r=>r[0]) : {estado:'Previsto',complementar:false};
  let pontos = id ? await sbGet('pontos_recolha?select=*&servico_id=eq.'+id+'&order=ordem') : [];
  openModal(servicoForm(s,pontos)); wireServicoForm(s);
}

      <div class="field"><label>Motorista</label><select id="s_mot">${opts(cache.motoristas.filter(m=>m.estado==='Ativo'),s.motorista_id,'id',m=>m.nome,'— por atribuir —')}</select></div>
      <div class="field"><label>Viatura</label><select id="s_viat">${opts(cache.viaturas,s.viatura_id,'id',v=>v.matricula+(v.marca?' · '+v.marca:''),'— por atribuir —')}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Distância (km)</label><input type="number" id="s_km" inputmode="decimal" value="${esc(s.distancia_km??'')}"></div>

function wireServicoForm(s){
  const fillEnt=(a,sel)=>{ $('#s_ent').innerHTML=opts(cache.entidades.filter(e=>e.area_id===a),sel,'id',e=>e.nome,'—'); };
  const fillTipo=(a,sel)=>{ $('#s_tipo').innerHTML=opts(cache.tipos.filter(t=>t.area_id===a||t.area_id==null),sel,'id',t=>t.nome,'—'); };
  fillEnt(s.area_id,s.entidade_id); fillTipo(s.area_id,s.tipo_servico_id);
  $('#s_area').onchange=e=>{ fillEnt(e.target.value); fillTipo(e.target.value); };
  $('#s_mot').onchange=e=>{ const m=cache.motoristas.find(x=>x.id===e.target.value);
    if(m&&m.viatura_habitual_id&&!$('#s_viat').value) $('#s_viat').value=m.viatura_habitual_id; };
  $('#saveServ').onclick=()=>saveServico(s);
}
async function saveServico(s){
  const body={
    area_id:$('#s_area').value||null, entidade_id:$('#s_ent').value||null, tipo_servico_id:$('#s_tipo').value||null,
    data:$('#s_data').value||null, num_passageiros:$('#s_pass').value?Number($('#s_pass').value):null,
    hora_saida:$('#s_saida').value||null, hora_regresso:$('#s_reg').value||null,
    destino:$('#s_dest').value.trim()||null, descricao:$('#s_desc').value.trim()||null,
    motorista_id:$('#s_mot').value||null, viatura_id:$('#s_viat').value||null,
    distancia_km:$('#s_km').value?Number($('#s_km').value):null,
    complementar:$('#s_comp').checked, estado:$('#s_estado').value, observacoes:$('#s_obs').value.trim()||null
  };
  if(!body.entidade_id||!body.data){ toast('Entidade e data são obrigatórias',true); return; }
  $('#saveServ').disabled=true;
  try{
    const pontos=collectPontos();
    if(s.id){
      await sbUpdate('servicos',s.id,body);
      await sbDelete('pontos_recolha','servico_id=eq.'+s.id);
      for(let i=0;i<pontos.length;i++) await sbInsert('pontos_recolha',{servico_id:s.id,local:pontos[i],ordem:i});
      toast('Serviço atualizado');
    }else{
      const novo=await sbInsert('servicos',{...body,pedido_id:s.pedido_id||null});
      for(let i=0;i<pontos.length;i++) await sbInsert('pontos_recolha',{servico_id:novo.id,local:pontos[i],ordem:i});
      if(s.pedido_id) await logHist('pedido',s.pedido_id,s.pedido_id,'Serviço criado a partir do pedido');
      toast('Serviço criado');
    }
    closeModal(); if(current==='servicos') viewServicos(); else if(current==='pedidos') viewPedidos();
  }catch(e){ toast(e.message,true); $('#saveServ').disabled=false; }
}
function apagarServico(id){ confirmar('Apagar este serviço?', async()=>{
  await sbDelete('servicos','id=eq.'+id); closeModal(); toast('Serviço apagado'); viewServicos(); }, true); }

/* =========================================================
   ENTIDADES + CONTACTOS

let entFiltro={q:'',area:''};
async function viewEntidades(){
  $('#view').innerHTML=`
    <div class="view-head"><h2>Entidades</h2><button class="btn btn-primary" onclick="editEntidade()">+ Nova</button></div>
    <div class="toolbar">
      <input class="search" id="eq" placeholder="Pesquisar entidade…" value="${esc(entFiltro.q)}">
      <select id="ear">${opts(cache.areas,entFiltro.area,'id',a=>a.nome,'Todas as áreas')}</select>
    </div>
    <div id="entList" class="list"></div>`;
  $('#eq').oninput=e=>{entFiltro.q=e.target.value;renderEntList();};
  $('#ear').onchange=e=>{entFiltro.area=e.target.value;renderEntList();};
  renderEntList();
}
function renderEntList(){
  const q=entFiltro.q.toLowerCase();
  let list=cache.entidades.filter(e=>{
    if(entFiltro.area && e.area_id!==entFiltro.area) return false;
    if(q && !e.nome.toLowerCase().includes(q)) return false; return true;
  });
  const el=$('#entList');

/* =========================================================
   Cálculo de custos (complementares)
========================================================= */
function horasEntre(hi, hf){
  if(!hi||!hf) return 0;
  const [h1,m1]=String(hi).slice(0,5).split(':').map(Number);
  const [h2,m2]=String(hf).slice(0,5).split(':').map(Number);
  let mins=(h2*60+m2)-(h1*60+m1); if(mins<0) mins+=1440;
  return Math.round(mins/60*100)/100;
}
function custoKm(distancia, taxas){
  const d=Number(distancia||0); if(!d||!taxas||!taxas.length) return 0;
  const ts=taxas.slice().sort((a,b)=>((a.km_ate==null?Infinity:a.km_ate)-(b.km_ate==null?Infinity:b.km_ate)));
  let prev=0, cost=0;
  for(const t of ts){
    const top=(t.km_ate==null?Infinity:Number(t.km_ate));
    const upper=Math.min(d, top);
    const km=upper-prev;
    if(km>0) cost+=km*Number(t.valor_km||0);
    prev=top; if(d<=top) break;
  }
  return Math.round(cost*100)/100;
}

function weekOf(iso){ const d=new Date(iso+'T00:00:00'); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow);
  const f=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  const fim=new Date(d); fim.setDate(d.getDate()+6); return {ini:f(d),fim:f(fim)}; }
function shiftWeek(iniISO, days){ const d=new Date(iniISO+'T00:00:00'); d.setDate(d.getDate()+days); return weekOf(
  d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); }

/* ---- Gráficos SVG (responsivos e autossuficientes) ---- */
function svgBars(title, items){
  const W=360, rowH=24, padTop=32, padBottom=8, left=118, right=40;
  const H=padTop+items.length*rowH+padBottom;
  const max=Math.max(1,...items.map(i=>i.value)); const barW=W-left-right;
  let b='';
  items.forEach((it,idx)=>{ const y=padTop+idx*rowH; const w=Math.max(2,barW*it.value/max); const col=it.color||PAL[idx%PAL.length];
    b+=`<text x="${left-8}" y="${y+14}" text-anchor="end" font-size="11" fill="#333">${esc(clip(it.label,17))}</text>`;
    b+=`<rect x="${left}" y="${y+3}" width="${w.toFixed(1)}" height="15" rx="3" fill="${col}"/>`;
    b+=`<text x="${left+w+5}" y="${y+15}" font-size="11" font-weight="600" fill="#333">${it.value}</text>`; });
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="max-width:100%;height:auto;display:block" font-family="-apple-system,Arial,sans-serif"><text x="0" y="15" font-size="13" font-weight="700" fill="#15486b">${esc(title)}</text>${b}</svg>`;
  return {svg,w:W,h:H};
}
function svgDonut(title, items){
  const total=items.reduce((a,i)=>a+i.value,0)||1; const cx=66,cy=92,r=48,rin=27; let ang=-Math.PI/2, arcs='';
  items.forEach((it,idx)=>{ const frac=it.value/total; const a2=ang+frac*2*Math.PI; const col=it.color||PAL[idx%PAL.length];
    if(it.value>0){ if(frac>=0.999){ arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}"/>`; }
      else { const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2); const large=frac>0.5?1:0;
      arcs+=`<path d="M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="${col}"/>`; } }
    ang=a2; });
  arcs+=`<circle cx="${cx}" cy="${cy}" r="${rin}" fill="#fff"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="16" font-weight="700" fill="#15486b">${total}</text>`;
  let leg=''; items.forEach((it,idx)=>{ const ly=40+idx*18; const col=it.color||PAL[idx%PAL.length];
    leg+=`<rect x="140" y="${ly-9}" width="10" height="10" rx="2" fill="${col}"/><text x="156" y="${ly}" font-size="11" fill="#333">${esc(clip(it.label,17))} (${it.value})</text>`; });
  const H=Math.max(160,40+items.length*18+14);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="360" height="${H}" viewBox="0 0 360 ${H}" style="max-width:100%;height:auto;display:block" font-family="-apple-system,Arial,sans-serif"><text x="0" y="15" font-size="13" font-weight="700" fill="#15486b">${esc(title)}</text>${arcs}${leg}</svg>`;
  return {svg,w:360,h:H};
}
function relChartSVGs(data){
  const est=EST_PEDIDO.map(e=>({label:e,value:data.porEstado[e]||0,color:statusColor(e)})).filter(i=>i.value>0);
  const ar=Object.keys(data.porArea).map((k,i)=>({label:k,value:data.porArea[k],color:PAL[i%PAL.length]}));
  const mo=Object.keys(data.porMot).sort((a,b)=>data.porMot[b]-data.porMot[a]).slice(0,8).map((k,i)=>({label:k,value:data.porMot[k],color:PAL[i%PAL.length]}));
  const c=[]; if(est.length) c.push(svgDonut('Pedidos por estado',est)); if(ar.length) c.push(svgBars('Serviços por área',ar)); if(mo.length) c.push(svgBars('Serviços por motorista',mo)); return c;
}

/* ---- Período (mês / semana / entre datas) ---- */
function relPeriodo(){
  if(relModo==='semana') return {de:relSemana.ini, ate:relSemana.fim, label:'Semana de '+fmtData(relSemana.ini)+' a '+fmtData(relSemana.fim)};
  if(relModo==='intervalo') return {de:relDe, ate:relAte, label:'De '+fmtData(relDe)+' a '+fmtData(relAte)};
  const [y,m]=relMes.split('-').map(Number); const last=new Date(y,m,0).getDate();
  const nome=new Date(y,m-1,1).toLocaleDateString('pt-PT',{month:'long',year:'numeric'});
  return {de:relMes+'-01', ate:relMes+'-'+String(last).padStart(2,'0'), label:nome.charAt(0).toUpperCase()+nome.slice(1)};
}
async function computeRelData(){
  const per=relPeriodo();
  let peds=await sbGet('pedidos?select=*&data_pedido=gte.'+per.de+'&data_pedido=lte.'+per.ate+'&order=data_pedido');
  let servs=await sbGet('servicos?select=*&data=gte.'+per.de+'&data=lte.'+per.ate+'&order=data');
  if(relArea){ peds=peds.filter(p=>p.area_id===relArea); servs=servs.filter(s=>s.area_id===relArea); }
  const porEstado={}; EST_PEDIDO.forEach(e=>porEstado[e]=0); peds.forEach(p=>{porEstado[p.estado]=(porEstado[p.estado]||0)+1;});
  const porArea={}; servs.forEach(s=>{ const k=areaNome(s.area_id)||'—'; porArea[k]=(porArea[k]||0)+1; });
  const porMot={}; servs.forEach(s=>{ if(s.motorista_id){ const k=motNome(s.motorista_id); porMot[k]=(porMot[k]||0)+1; } });
  const comp=servs.filter(s=>s.complementar);
  const horasComp=comp.reduce((a,s)=>a+horasEntre(s.hora_saida,s.hora_regresso),0);
  return { de:per.de, ate:per.ate, label:per.label, peds, servs, porEstado, porArea, porMot,
    kpis:{ pedidos:peds.length, aprovados:porEstado['Aprovado']||0, servicos:servs.length,
      realizados:servs.filter(s=>s.estado==='Realizado').length, complementares:comp.length,
      horasComp:Math.round(horasComp*100)/100 } };
}

    let r=4; ws.getCell('A'+r).value='Indicadores'; ws.getCell('A'+r).font={bold:true}; r++;
    const kpis=[['Pedidos',data.kpis.pedidos,'FF15486B'],['Aprovados',data.kpis.aprovados,'FF2E7D5B'],['Serviços',data.kpis.servicos,'FF1F5F8B'],
      ['Realizados',data.kpis.realizados,'FF0F766E'],['Complementares',data.kpis.complementares,'FF6B3FA0'],['Horas complementares',data.kpis.horasComp,'FFB26A00']];
    kpis.forEach(([l,v,c])=>{ const a=ws.getCell('A'+r), b=ws.getCell('B'+r); a.value=l; b.value=v;
      [a,b].forEach(cell=>{ cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:c}}; cell.font={color:{argb:'FFFFFFFF'},bold:true}; }); r++; });
    const tabela=(titulo,obj)=>{ r++; ws.getCell('A'+r).value=titulo; ws.getCell('A'+r).font={bold:true}; r++;
      Object.keys(obj).forEach(kk=>{ ws.getCell('A'+r).value=kk; ws.getCell('B'+r).value=obj[kk]; r++; }); };
    tabela('Pedidos por estado',data.porEstado);
    tabela('Serviços por área',data.porArea);
    const motOrd={}; Object.keys(data.porMot).sort((a,b)=>data.porMot[b]-data.porMot[a]).forEach(k=>motOrd[k]=data.porMot[k]);
    tabela('Serviços por motorista',motOrd);
    try{ const imgs=await relChartPNGs(data); let row=3;
      for(const png of imgs){ const id=wb.addImage({base64:png.b64,extension:'png'}); ws.addImage(id,{tl:{col:3,row:row},ext:{width:png.w,height:png.h}}); row+=Math.ceil(png.h/20)+2; } }catch(e){ console.warn('img',e); }
    const wp=wb.addWorksheet('Pedidos');
    wp.addRow(['Nº','Data pedido','Área','Entidade','Tipo','Estado','Passageiros','Data pretendida','Destino']);
    wp.getRow(1).font={bold:true,color:{argb:'FFFFFFFF'}}; wp.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF15486B'}};
    data.peds.forEach(p=>wp.addRow([p.numero||'',fmtData(p.data_pedido),areaNome(p.area_id),entNome(p.entidade_id),tipoNome(p.tipo_servico_id)||'',p.estado,p.num_passageiros??'',fmtData(p.data_pretendida),p.destino||'']));
    [12,13,18,26,20,18,12,14,26].forEach((w,i)=>wp.getColumn(i+1).width=w);
    const buf=await wb.xlsx.writeBuffer();
    downloadBlob(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'relatorio_transportes_'+data.de+'_a_'+data.ate+'.xlsx');
    toast('Excel exportado');
  }catch(e){ toast('Excel: '+e.message,true); }
}

/* ---- Vista ---- */
async function viewRelatorios(){
  if(!relMes){ const d=new Date(); relMes=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  if(!relSemana) relSemana=weekRange();
  if(!relDe){ relDe=relMes+'-01'; relAte=todayISO(); }
  $('#view').innerHTML=`
    <div class="view-head"><h2>Relatórios</h2></div>
    <div class="toolbar">
      <select id="rmodo" style="flex:1">
        <option value="mes" ${relModo==='mes'?'selected':''}>Mês</option>
        <option value="semana" ${relModo==='semana'?'selected':''}>Semana</option>
        <option value="intervalo" ${relModo==='intervalo'?'selected':''}>Entre datas</option>
      </select>
      <span id="rpick" style="flex:2;display:flex;gap:8px"></span>
      <select id="rarea" style="flex:1">${opts(cache.areas,relArea,'id',a=>a.nome,'Todas as áreas')}</select>
    </div>
    <div class="toolbar">
      <button class="btn btn-ghost btn-sm" id="rpdf">Exportar PDF</button>
      <button class="btn btn-ghost btn-sm" id="rxls">Exportar Excel</button>
    </div>
    <div id="relOut"></div>`;
  renderRelPicker();
  $('#rmodo').onchange=e=>{ relModo=e.target.value; renderRelPicker(); renderRel(); };
  $('#rarea').onchange=e=>{ relArea=e.target.value; renderRel(); };
  $('#rpdf').onclick=exportRelPDF;
  $('#rxls').onclick=exportRelExcel;
  renderRel();
}
function renderRelPicker(){
  const el=$('#rpick');
  if(relModo==='mes'){ el.innerHTML=`<input type="month" id="rmes" value="${relMes}" style="flex:1">`; $('#rmes').onchange=e=>{ relMes=e.target.value; renderRel(); }; }
  else if(relModo==='intervalo'){ el.innerHTML=`<input type="date" id="rd1" value="${relDe}" style="flex:1"><input type="date" id="rd2" value="${relAte}" style="flex:1">`;
    $('#rd1').onchange=e=>{ relDe=e.target.value; renderRel(); }; $('#rd2').onchange=e=>{ relAte=e.target.value; renderRel(); }; }
  else { el.innerHTML=`<button class="btn btn-ghost btn-sm" id="rwp">◀</button><input type="date" id="rwd" value="${relSemana.ini}" style="flex:1"><button class="btn btn-ghost btn-sm" id="rwn">▶</button>`;
    $('#rwp').onclick=()=>{ relSemana=shiftWeek(relSemana.ini,-7); $('#rwd').value=relSemana.ini; renderRel(); };
    $('#rwn').onclick=()=>{ relSemana=shiftWeek(relSemana.ini,7); $('#rwd').value=relSemana.ini; renderRel(); };
    $('#rwd').onchange=e=>{ relSemana=weekOf(e.target.value); renderRel(); }; }
}
async function renderRel(){
  const out=$('#relOut'); out.innerHTML='<div class="loading">A calcular…</div>';
  try{ relResult=await computeRelData(); out.innerHTML=relScreenHTML(relResult); }
  catch(e){ relResult=null; out.innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
}

/* =========================================================
   Arranque
========================================================= */
async function init(){
  buildNav();
  try{ await loadCaches(); render(); }
  catch(e){
    $('#banner').className='banner show';
    $('#banner').textContent='Não foi possível ligar à base de dados. Verifica o URL/chave do Supabase. Detalhe: '+e.message;
    $('#view').innerHTML='';
  }
}
init();
</script>
